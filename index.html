<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#EFECE6" id="metaThemeColor" />
  <meta name="description" content="KUBIKO — Puzzle arcade tátil 8x8 com 15 mundos físicos, Modo FEVER x10, mascote OLED reativo e 12 assinaturas musicais de streak." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KUBIKO" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>KUBIKO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #EFECE6;
      --bg-surface: #FAF8F4;
      --bg-surface-2: #E4DFD5;
      --border-ink: #D2CBC0;
      --text-primary: #171A1F;
      --text-muted: #5C626E;
      --accent: #FF551A;
      --accent-lip: #B83509;
      --key-bg: #FAF8F4;
      --key-lip: #CFC8BC;
      --key-text: #171A1F;
      --oled-bg: #0D1117;
      --oled-border: #2B323D;
      --fuse-off: #CFC9BE;
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: contain;
      touch-action: none;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-ui);
      transition: background-color 600ms ease, color 400ms ease;
    }

    /* =========================================================================
       HOMEPAGE (TELA INICIAL COM BOTÃO JOGAR)
       ========================================================================= */
    .home-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      transition: opacity 280ms ease, transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .home-screen.hidden {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
    }

    .home-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-surface);
      border: 2px solid var(--border-ink);
      border-radius: 24px;
      padding: 28px 24px 24px;
      box-shadow: 0 8px 0 var(--border-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      position: relative;
    }

    .home-top-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-edition {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .home-oled-wrap {
      cursor: pointer;
      width: 108px;
      height: 56px;
      border-radius: 14px;
      background: var(--oled-bg);
      border: 3px solid var(--oled-border);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 2px;
    }

    #homeMascotCanvas {
      width: 102px;
      height: 50px;
      display: block;
    }

    .home-title-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .home-logo {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(38px, 10vw, 48px);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.14em;
      color: var(--text-primary);
      margin: 0 auto;
    }

    .home-logo-word {
      display: inline-block;
      letter-spacing: -0.04em;
      line-height: 0.72;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    @supports not (text-box-trim: trim-both) {
      .home-logo-word,
      .brand-logo-word {
        transform: translateY(0.03em);
      }
    }

    .home-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.86em;
      height: 0.86em;
      padding: 0;
      border-radius: 11px;
      background: var(--accent);
      border-bottom: 4px solid var(--accent-lip);
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .home-logo-badge svg {
      width: 56%;
      height: 56%;
      display: block;
    }

    .home-sub {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-muted);
      max-width: 280px;
    }

    .home-tiles-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
    }

    .mini-key {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.22);
      position: relative;
    }

    .mini-key::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 4px;
      border: 1.5px solid rgba(255, 255, 255, 0.42);
    }

    .home-record-panel {
      width: 100%;
      background: var(--bg-surface-2);
      border: 1.5px solid var(--border-ink);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-record-lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .home-record-val {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .home-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 2px;
    }

    .play-cta-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 15px;
      background: var(--accent);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 5px 0 var(--accent-lip);
      transform: translateY(0);
      transition: transform 90ms ease, box-shadow 90ms ease;
    }

    .play-cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--accent-lip);
    }

    .continue-cta-btn {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--border-ink);
      border-radius: 13px;
      background: var(--key-bg);
      color: var(--key-text);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 0 var(--key-lip);
      transform: translateY(0);
      transition: transform 90ms ease, box-shadow 90ms ease;
    }

    .continue-cta-btn.show {
      display: inline-flex;
    }

    .continue-cta-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--key-lip);
    }

    /* =========================================================================
       TELA PRINCIPAL DO JOGO
       ========================================================================= */
    #app {
      width: 100%;
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      gap: 8px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(18px, 4.6vw, 22px);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.14em;
      color: var(--text-primary);
    }

    .brand-logo-word {
      display: inline-block;
      letter-spacing: -0.04em;
      line-height: 0.72;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.94em;
      height: 0.94em;
      padding: 0;
      border-radius: 6px;
      background: var(--accent);
      border-bottom: 2px solid var(--accent-lip);
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .brand-badge svg {
      width: 58%;
      height: 58%;
      display: block;
    }

    .world-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 142px;
      transition: background-color 450ms ease, border-color 450ms ease, color 450ms ease;
    }

    .world-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .key-btn {
      appearance: none;
      border: 1px solid var(--border-ink);
      background: var(--key-bg);
      color: var(--key-text);
      min-width: 44px;
      height: 40px;
      padding: 0 10px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--key-lip);
      transform: translateY(0);
      transition: transform 90ms ease, box-shadow 90ms ease, background-color 300ms ease, color 300ms ease;
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--key-lip);
    }

    .key-btn svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    /* HUD PANEL */
    .hud-deck {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-ink);
      border-radius: 14px;
      padding: 8px 10px;
      box-shadow: 0 3px 0 var(--border-ink);
      flex-shrink: 0;
      transition: background-color 450ms ease, border-color 450ms ease;
    }

    .stat-block {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .stat-block.right {
      align-items: flex-end;
      text-align: right;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: clamp(20px, 5.4vw, 26px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--text-primary);
      margin-top: 1px;
      transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1), color 220ms ease;
    }

    .stat-value.bump {
      transform: scale(1.1);
      color: var(--accent);
    }

    /* OLED MASCOT & FUSE */
    .mascot-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .oled-bezel {
      cursor: pointer;
      width: 82px;
      height: 44px;
      border-radius: 10px;
      background: var(--oled-bg);
      border: 2px solid var(--oled-border);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #mascotCanvas {
      width: 78px;
      height: 40px;
      display: block;
    }

    .fuse-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fuse-seg {
      width: 18px;
      height: 5px;
      border-radius: 3px;
      background: var(--fuse-off);
      transition: background-color 180ms ease, transform 180ms ease;
    }

    .fuse-seg.active {
      background: var(--accent);
    }

    .fuse-seg.hot {
      background: #F59E0B;
      transform: scaleY(1.25);
    }

    .fuse-seg.warn {
      background: #EF4444;
      transform: scaleY(1.3);
    }

    .combo-tag {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--accent);
      min-width: 24px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }


    /* MODO FEVER ARCO-ÍRIS (x10) */
    @keyframes feverRainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.fever-mode {
      background: linear-gradient(125deg, #FF3B30, #FF9500, #FFCC00, #34C759, #00C7BE, #007AFF, #AF52DE, #FF2D55);
      background-size: 320% 320%;
      animation: feverRainbowShift 3.6s ease infinite;
    }

    body.fever-mode .hud-deck {
      border-color: #FFFFFF;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    }

    body.fever-mode .world-pill {
      background: linear-gradient(90deg, #FF3B30, #FF9500, #34C759, #007AFF, #FF2D55);
      background-size: 260% 100%;
      animation: feverRainbowShift 2.2s linear infinite;
      border-color: #FFFFFF;
      color: #FFFFFF;
    }

    body.fever-mode .world-dot {
      background: #FFFFFF !important;
    }

    body.fever-mode .combo-tag {
      color: #FF2D55;
      font-size: 11px;
    }

    .fuse-seg.fever {
      background: linear-gradient(90deg, #FF3B30, #FFCC00, #34C759, #00C7BE, #FF2D55);
      background-size: 200% 100%;
      animation: feverRainbowShift 1.4s linear infinite;
      transform: scaleY(1.45);
    }

    /* PLAYFIELD */
    .stage-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* GAME OVER MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(10, 12, 16, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 2px solid var(--border-ink);
      border-radius: 18px;
      padding: 22px 20px 20px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      transform: translateY(14px) scale(0.96);
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-kicker {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.14);
      color: #EF4444;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .modal-title {
      margin: 0 0 14px;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .modal-stat-box {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-ink);
      border-radius: 12px;
      padding: 10px 8px;
    }

    .modal-stat-box .lbl {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .modal-stat-box .val {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .modal-record-badge {
      display: none;
      margin: -6px 0 14px;
      padding: 6px 12px;
      border-radius: 10px;
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #F59E0B;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .modal-record-badge.show {
      display: inline-block;
    }

    .cta-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--accent-lip);
      transform: translateY(0);
      transition: transform 90ms ease, box-shadow 90ms ease;
    }

    .cta-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--accent-lip);
    }
  </style>
</head>
<body>
  <!-- HOMEPAGE COM BOTÃO JOGAR -->
  <section class="home-screen" id="homeScreen" aria-label="Tela inicial do KUBIKO">
    <div class="home-card">
      <div class="home-top-row">
        <span class="home-edition">
          <span class="world-dot"></span>
          GRID 8×8 ARCADE
        </span>
        <button type="button" class="key-btn" id="btnHomeSound" aria-label="Alternar som" title="Som">
          <svg class="snd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="snd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>

      <div class="home-oled-wrap" aria-hidden="true">
        <canvas id="homeMascotCanvas" width="204" height="100"></canvas>
      </div>

      <div class="home-title-block">
        <div class="home-logo" aria-label="KUBIKO"><span class="home-logo-word">KUBIK</span><span class="home-logo-badge"><svg viewBox="0 0 24 28" aria-hidden="true"><rect x="4" y="3" width="16" height="22" rx="7.5" fill="none" stroke="currentColor" stroke-width="5.2"/></svg></span></div>
        <p class="home-sub">Encaixe blocos, dispare sequências de combos e desbloqueie novos materiais.</p>
      </div>

      <div class="home-tiles-strip" aria-hidden="true">
        <span class="mini-key" style="background:#FF551A"></span>
        <span class="mini-key" style="background:#0EA5E9"></span>
        <span class="mini-key" style="background:#10B981"></span>
        <span class="mini-key" style="background:#F59E0B"></span>
        <span class="mini-key" style="background:#F43F5E"></span>

    /* =========================================================================

       ========================================================================= */
    function makeOffscreen(w, h) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w));
      c.height = Math.max(1, Math.round(h));
      return c;
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w * 0.5, h * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    function clamp(v, min, max) {
      return v < min ? min : (v > max ? max : v);
    }

    function buildShuffledWorldOrder(avoidFirstIdx = -1) {
      const order = Array.from({ length: WORLDS.length }, (_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = order[i];
        order[i] = order[j];
        order[j] = tmp;
      }
      if (avoidFirstIdx >= 0 && order.length > 1 && order[0] === avoidFirstIdx) {
        const swapIdx = 1 + Math.floor(Math.random() * (order.length - 1));
        const tmp = order[0];
        order[0] = order[swapIdx];
        order[swapIdx] = tmp;
      }
      return order;
    }

        this.cellPx = cellPx;
        this.dpr = dpr;
        this.buildAuxSprites();
        this.buildAllBlockSprites();
        this.buildBoardCanvases(boardPx, padPx, gapPx);
      }

      buildAuxSprites() {
        const starColors = ['#FFFFFF', '#FDE047', ...BLOCK_PALETTE.map(p => p.light)];
        this.starSprites = starColors.map(col => {
          const s = 28;
          const c = makeOffscreen(s, s);
          const ctx = c.getContext('2d');
          ctx.translate(s / 2, s / 2);
          ctx.fillStyle = col;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const ang = (i * Math.PI) / 4;
            const rad = i % 2 === 0 ? 11 : 4.2;
            const px = Math.cos(ang) * rad;
            const py = Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          return c;
        });

        const gs = Math.max(36, Math.round(this.cellPx * 2.2 * this.dpr));
        this.glows = BLOCK_PALETTE.map(pal => {
          const c = makeOffscreen(gs, gs);
          const ctx = c.getContext('2d');
          const rad = gs / 2;
          const g = ctx.createRadialGradient(rad, rad, rad * 0.06, rad, rad, rad);
          g.addColorStop(0, '#FFFFFFCC');
          g.addColorStop(0.28, pal.glow + 'CC');
          g.addColorStop(0.62, pal.glow + '44');
          g.addColorStop(1, pal.glow + '00');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, gs, gs);
          return c;
        });

        this.feverGlows = FEVER_RAINBOW_COLORS.map(hex => {
          const c = makeOffscreen(gs, gs);
          const ctx = c.getContext('2d');
          const rad = gs / 2;
          const g = ctx.createRadialGradient(rad, rad, rad * 0.06, rad, rad, rad);
          g.addColorStop(0, '#FFFFFFDD');
          g.addColorStop(0.32, hex + 'CC');
          g.addColorStop(0.65, hex + '44');
          g.addColorStop(1, hex + '00');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, gs, gs);
          return c;
        });

        const orbS = 32;
        const orb = makeOffscreen(orbS, orbS);
        const octx = orb.getContext('2d');
        const og = octx.createRadialGradient(16, 16, 1, 16, 16, 16);
        og.addColorStop(0, 'rgba(255,255,255,0.95)');
        og.addColorStop(0.45, 'rgba(255,255,255,0.35)');
        og.addColorStop(1, 'rgba(255,255,255,0)');
        octx.fillStyle = og;
        octx.fillRect(0, 0, orbS, orbS);
        this.softOrb = orb;
      }

      buildAllBlockSprites() {
        const px = Math.max(20, Math.round(this.cellPx * this.dpr));
        this.blocks = {};
        this.deadBlocks = {};
        for (let wIdx = 0; wIdx < WORLDS.length; wIdx++) {
          const style = WORLDS[wIdx].style;
          this.blocks[wIdx] = [];
          for (let cIdx = 0; cIdx < BLOCK_PALETTE.length; cIdx++) {
            this.blocks[wIdx][cIdx] = this.renderBlockSprite(px, BLOCK_PALETTE[cIdx], style, cIdx);
          }
          this.deadBlocks[wIdx] = this.renderBlockSprite(px, DEAD_COLOR, style, -1);
        }
        // 8 blocos prismáticos arco-íris pré-renderizados para o MODO FEVER x10
        this.feverBlocks = FEVER_RAINBOW_COLORS.map((hex, i) => {
          const nextHex = FEVER_RAINBOW_COLORS[(i + 1) % FEVER_RAINBOW_COLORS.length];
          return this.renderFeverBlockSprite(px, hex, nextHex);
        });
      }

      renderFeverBlockSprite(size, c1, c2) {
        const c = makeOffscreen(size, size);
        const ctx = c.getContext('2d');
        const s = size;
        const pad = Math.max(1, s * 0.03);
        const w = s - pad * 2;
        const r = Math.max(3, s * 0.22);

        roundRectPath(ctx, pad, pad, w, w, r);
        const g = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
        g.addColorStop(0, '#FFFFFF');
        g.addColorStop(0.22, c1);
        g.addColorStop(0.82, c2);
        g.addColorStop(1, '#FFFFFF');
        ctx.fillStyle = g;
        ctx.fill();

        // Faceta prismática brilhante
        const ins = w * 0.16;
        roundRectPath(ctx, pad + ins, pad + ins, w - ins * 2, w - ins * 2, r * 0.55);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.88)';
        ctx.lineWidth = Math.max(1.5, s * 0.042);
        roundRectPath(ctx, pad + 1.5, pad + 1.5, w - 3, w - 3, r * 0.9);
        ctx.stroke();
        return c;
      }

      renderBlockSprite(size, pal, style, colorIdx) {
        const c = makeOffscreen(size, size);
        const ctx = c.getContext('2d');
        const s = size;
        const pad = Math.max(1, s * 0.03);
        const w = s - pad * 2;
        const r = Math.max(3, s * 0.18);

        if (style === 'keycap') {
          roundRectPath(ctx, pad, pad, w, w, r);
          ctx.fillStyle = pal.dark;
          ctx.fill();

          const gBody = ctx.createLinearGradient(0, pad, 0, pad + w);
          gBody.addColorStop(0, pal.light);
          gBody.addColorStop(0.28, pal.base);
          gBody.addColorStop(1, pal.dark);
          roundRectPath(ctx, pad, pad, w, w * 0.91, r);
          ctx.fillStyle = gBody;
          ctx.fill();

          const ins = w * 0.13;
          const gTop = ctx.createLinearGradient(0, pad + ins, 0, pad + w - ins * 1.4);
          gTop.addColorStop(0, pal.base);
          gTop.addColorStop(1, pal.light);
          roundRectPath(ctx, pad + ins, pad + ins * 0.72, w - ins * 2, w - ins * 2.1, r * 0.62);
          ctx.fillStyle = gTop;
          ctx.fill();

          const bw = w * 0.28;
          const bh = Math.max(2, s * 0.055);
          roundRectPath(ctx, (s - bw) * 0.5, pad + w * 0.56, bw, bh, bh * 0.5);
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.38)';
          ctx.lineWidth = Math.max(1, s * 0.028);
          roundRectPath(ctx, pad + 1, pad + 1, w - 2, w * 0.9 - 2, r * 0.92);
          ctx.stroke();

        } else if (style === 'crt') {
          const ch = Math.max(3, s * 0.14);
          ctx.beginPath();
          ctx.moveTo(pad + ch, pad);
          ctx.lineTo(pad + w - ch, pad);
          ctx.lineTo(pad + w, pad + ch);
          ctx.lineTo(pad + w, pad + w - ch);
          ctx.lineTo(pad + w - ch, pad + w);
          ctx.lineTo(pad + ch, pad + w);
          ctx.lineTo(pad, pad + w - ch);
          ctx.lineTo(pad, pad + ch);
          ctx.closePath();

          const g = ctx.createLinearGradient(0, pad, 0, pad + w);
          g.addColorStop(0, pal.light);
          g.addColorStop(0.5, pal.base);
          g.addColorStop(1, pal.dark);
          ctx.fillStyle = g;
          ctx.fill();

          const m = s * 0.12;
          ctx.fillStyle = 'rgba(8, 12, 18, 0.34)';
          ctx.fillRect(pad + m, pad + m, w - m * 2, w - m * 2);
          ctx.strokeStyle = pal.light;
          ctx.lineWidth = Math.max(1.2, s * 0.036);
          ctx.strokeRect(pad + m + 1, pad + m + 1, w - m * 2 - 2, w - m * 2 - 2);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
          const step = Math.max(3, Math.round(s * 0.11));
          for (let y = pad + m; y < pad + w - m; y += step) {
            ctx.fillRect(pad + m, y, w - m * 2, Math.max(1, step * 0.34));
          }

          const pxDot = Math.max(2, s * 0.09);
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.fillRect(pad + m * 1.45, pad + m * 1.45, pxDot, pxDot);

        } else if (style === 'ceramic') {
          roundRectPath(ctx, pad, pad, w, w, r * 0.9);
          ctx.fillStyle = pal.dark;
          ctx.fill();

          const gTile = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
          gTile.addColorStop(0, pal.light);
          gTile.addColorStop(0.45, pal.base);
          gTile.addColorStop(1, pal.dark);
          roundRectPath(ctx, pad + s * 0.03, pad + s * 0.02, w - s * 0.06, w - s * 0.08, r * 0.78);
          ctx.fillStyle = gTile;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,252,245,0.52)';
          ctx.lineWidth = Math.max(1.5, s * 0.045);
          ctx.beginPath();
          ctx.moveTo(pad + r, pad + s * 0.08);
          ctx.lineTo(pad + w - r, pad + s * 0.08);
          ctx.stroke();

          const cx = s * 0.5;
          const cy = s * 0.5;
          ctx.strokeStyle = 'rgba(255,255,255,0.34)';
          ctx.fillStyle = 'rgba(255,255,255,0.22)';
          ctx.lineWidth = Math.max(1.5, s * 0.045);
          const motif = Math.abs(colorIdx) % 3;
          if (motif === 0) {
            ctx.beginPath();
            ctx.arc(cx, cy, w * 0.21, 0, Math.PI * 2);
            ctx.stroke();
          } else if (motif === 1) {
            ctx.beginPath();
            ctx.arc(cx, cy + w * 0.06, w * 0.22, Math.PI, 0);
            ctx.fill();
          } else {
            const d = w * 0.17;
            ctx.strokeRect(cx - d, cy - d, d * 2, d * 2);
          }

        } else if (style === 'gem') {
          const ch = s * 0.2;
          const x0 = pad, y0 = pad, x1 = pad + w, y1 = pad + w;
          const cx = s * 0.5, cy = s * 0.5;

          const outer = [
            [x0 + ch, y0], [x1 - ch, y0],
            [x1, y0 + ch], [x1, y1 - ch],
            [x1 - ch, y1], [x0 + ch, y1],
            [x0, y1 - ch], [x0, y0 + ch]
          ];
          const innerScale = 0.54;
          const inner = outer.map(([px, py]) => [
            cx + (px - cx) * innerScale,
            cy + (py - cy) * innerScale
          ]);

          const shades = [
            pal.light, pal.light,
            pal.base, pal.dark,
            pal.dark, pal.dark,
            pal.base, pal.light
          ];

          for (let i = 0; i < 8; i++) {
            const n = (i + 1) % 8;
            ctx.beginPath();
            ctx.moveTo(outer[i][0], outer[i][1]);
            ctx.lineTo(outer[n][0], outer[n][1]);
            ctx.lineTo(inner[n][0], inner[n][1]);
            ctx.lineTo(inner[i][0], inner[i][1]);
            ctx.closePath();
            ctx.fillStyle = shades[i];
            ctx.fill();
          }

          ctx.beginPath();
          inner.forEach(([px, py], i) => i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py));
          ctx.closePath();
          const gCenter = ctx.createLinearGradient(x0, y0, x1, y1);
          gCenter.addColorStop(0, pal.light);
          gCenter.addColorStop(0.55, pal.base);
          gCenter.addColorStop(1, pal.dark);
          ctx.fillStyle = gCenter;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.65)';
          ctx.lineWidth = Math.max(1.2, s * 0.036);
          ctx.beginPath();
          ctx.moveTo(inner[7][0], inner[7][1]);
          ctx.lineTo(inner[0][0], inner[0][1]);
          ctx.lineTo(inner[1][0], inner[1][1]);
          ctx.stroke();

        } else if (style === 'capsule') {
          const rCap = s * 0.28;
          roundRectPath(ctx, pad, pad, w, w, rCap);
          const gCap = ctx.createLinearGradient(0, pad, 0, pad + w);
          gCap.addColorStop(0, pal.base);
          gCap.addColorStop(0.62, pal.dark);
          gCap.addColorStop(1, pal.light);
          ctx.fillStyle = gCap;
          ctx.fill();

          ctx.save();
          roundRectPath(ctx, pad + 2, pad + 2, w - 4, w - 4, rCap * 0.9);
          ctx.clip();
          const gCaust = ctx.createRadialGradient(s * 0.5, pad + w * 0.9, s * 0.04, s * 0.5, pad + w * 0.9, w * 0.55);
          gCaust.addColorStop(0, 'rgba(255,255,255,0.58)');
          gCaust.addColorStop(0.5, pal.light + '66');
          gCaust.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = gCaust;
          ctx.fillRect(pad, pad, w, w);

          ctx.strokeStyle = 'rgba(255,255,255,0.68)';
          ctx.lineWidth = Math.max(2, s * 0.065);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(pad + w * 0.24, pad + w * 0.19);
          ctx.quadraticCurveTo(s * 0.5, pad + w * 0.11, pad + w * 0.76, pad + w * 0.19);
          ctx.stroke();

          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.beginPath();
          ctx.arc(pad + w * 0.72, pad + w * 0.64, Math.max(1.8, s * 0.06), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.strokeStyle = 'rgba(255,255,255,0.34)';
          ctx.lineWidth = Math.max(1, s * 0.03);
          roundRectPath(ctx, pad + 1, pad + 1, w - 2, w - 2, rCap);
          ctx.stroke();

        } else if (style === 'brushed') {
          // FORJA COBRE: Metal escovado industrial com chanfro metálico e 4 micro-rebites
          const rMet = Math.max(2, s * 0.12);
          roundRectPath(ctx, pad, pad, w, w, rMet);
          const gMet = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
          gMet.addColorStop(0, pal.light);
          gMet.addColorStop(0.35, pal.base);
          gMet.addColorStop(0.65, pal.dark);
          gMet.addColorStop(1, pal.base);
          ctx.fillStyle = gMet;
          ctx.fill();

          // Linhas sutis de escovação metálica
          ctx.save();
          roundRectPath(ctx, pad + 2, pad + 2, w - 4, w - 4, rMet * 0.8);
          ctx.clip();
          const lineStep = Math.max(2, Math.round(s * 0.08));
          for (let y = pad + 2; y < pad + w - 2; y += lineStep) {
            ctx.fillStyle = (y % (lineStep * 2) === 0) ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.12)';
            ctx.fillRect(pad, y, w, 1);
          }
          ctx.restore();

          // Placa interna chanfrada
          const ins = w * 0.14;
          roundRectPath(ctx, pad + ins, pad + ins, w - ins * 2, w - ins * 2, rMet * 0.5);
          ctx.strokeStyle = 'rgba(255,255,255,0.32)';
          ctx.lineWidth = Math.max(1, s * 0.028);
          ctx.stroke();

          // 4 micro-rebites nos cantos
          const rv = Math.max(1.5, s * 0.042);
          const ro = pad + w * 0.17;
          const rivets = [
            [ro, ro], [pad + w - (ro - pad), ro],
            [ro, pad + w - (ro - pad)], [pad + w - (ro - pad), pad + w - (ro - pad)]
          ];
          for (const [rx, ry] of rivets) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.arc(rx + 0.6, ry + 0.8, rv, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.62)';
            ctx.beginPath();
            ctx.arc(rx, ry, rv * 0.82, 0, Math.PI * 2);
            ctx.fill();
          }

        } else if (style === 'origami') {
          // PAPEL ORIGAMI: 4 faces triangulares dobradas convergindo no centro
          const x0 = pad, y0 = pad, x1 = pad + w, y1 = pad + w;
          const cx = s * 0.5, cy = s * 0.5;
          const rPap = Math.max(2, s * 0.1);

          ctx.save();
          roundRectPath(ctx, x0, y0, w, w, rPap);
          ctx.clip();

          // Triângulo superior (mais claro)
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(cx, cy); ctx.closePath();
          ctx.fillStyle = pal.light; ctx.fill();
          // Triângulo esquerdo (médio-claro)
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(cx, cy); ctx.lineTo(x0, y1); ctx.closePath();
          ctx.fillStyle = pal.base; ctx.fill();
          // Triângulo direito (médio-escuro)
          ctx.beginPath(); ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); ctx.lineTo(cx, cy); ctx.closePath();
          ctx.fillStyle = pal.base; ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fill();
          // Triângulo inferior (sombra)
          ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(cx, cy); ctx.lineTo(x1, y1); ctx.closePath();
          ctx.fillStyle = pal.dark; ctx.fill();

          // Vincos brancos sutis nas diagonais
          ctx.strokeStyle = 'rgba(255,255,255,0.42)';
          ctx.lineWidth = Math.max(1, s * 0.025);
          ctx.beginPath();
          ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
          ctx.moveTo(x1, y0); ctx.lineTo(x0, y1);
          ctx.stroke();
          ctx.restore();

          ctx.strokeStyle = 'rgba(0,0,0,0.18)';
          ctx.lineWidth = Math.max(1, s * 0.026);
          roundRectPath(ctx, x0 + 0.5, y0 + 0.5, w - 1, w - 1, rPap);
          ctx.stroke();

        } else if (style === 'frost') {
          // GELO ÁRTICO: Bloco cristalino translúcido com fraturas diagonais e brilho glacial
          const rIce = Math.max(3, s * 0.2);
          roundRectPath(ctx, pad, pad, w, w, rIce);
          const gIce = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
          gIce.addColorStop(0, '#FFFFFF');
          gIce.addColorStop(0.22, pal.light);
          gIce.addColorStop(0.68, pal.base);
          gIce.addColorStop(1, pal.dark);
          ctx.fillStyle = gIce;
          ctx.fill();

          ctx.save();
          roundRectPath(ctx, pad + 2, pad + 2, w - 4, w - 4, rIce * 0.85);
          ctx.clip();
          // Faceta diagonal de refração glacial
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.beginPath();
          ctx.moveTo(pad, pad + w * 0.55);
          ctx.lineTo(pad + w * 0.65, pad);
          ctx.lineTo(pad + w, pad);
          ctx.lineTo(pad + w * 0.35, pad + w);
          ctx.lineTo(pad, pad + w);
          ctx.closePath();
          ctx.fill();

          // Micro-fratura cristalina
          ctx.strokeStyle = 'rgba(255,255,255,0.62)';
          ctx.lineWidth = Math.max(1, s * 0.026);
          ctx.beginPath();
          ctx.moveTo(pad + w * 0.2, pad + w * 0.24);
          ctx.lineTo(pad + w * 0.48, pad + w * 0.45);
          ctx.lineTo(pad + w * 0.78, pad + w * 0.32);
          ctx.stroke();
          ctx.restore();

          ctx.strokeStyle = 'rgba(255,255,255,0.72)';
          ctx.lineWidth = Math.max(1.2, s * 0.036);
          roundRectPath(ctx, pad + 1.5, pad + 1.5, w - 3, w - 3, rIce * 0.9);
          ctx.stroke();

        } else if (style === 'circuit') {
          // CIRCUITO PCB: Microchip eletrônico com trilhas impressas e pad central
          const rPcb = Math.max(2, s * 0.14);
          roundRectPath(ctx, pad, pad, w, w, rPcb);
          ctx.fillStyle = pal.dark;
          ctx.fill();

          roundRectPath(ctx, pad + s * 0.05, pad + s * 0.05, w - s * 0.1, w - s * 0.1, rPcb * 0.75);
          const gPcb = ctx.createLinearGradient(0, pad, 0, pad + w);
          gPcb.addColorStop(0, pal.base);
          gPcb.addColorStop(1, pal.dark);
          ctx.fillStyle = gPcb;
          ctx.fill();

          // Trilhas metálicas internas
          const cx = s * 0.5, cy = s * 0.5;
          ctx.strokeStyle = pal.light;
          ctx.lineWidth = Math.max(1.2, s * 0.034);
          ctx.beginPath();
          ctx.moveTo(pad + w * 0.16, cy); ctx.lineTo(pad + w * 0.84, cy);
          ctx.moveTo(cx, pad + w * 0.16); ctx.lineTo(cx, pad + w * 0.84);
          ctx.stroke();

          // Pad central estilo chip
          const chipS = w * 0.36;
          roundRectPath(ctx, cx - chipS * 0.5, cy - chipS * 0.5, chipS, chipS, chipS * 0.22);
          ctx.fillStyle = pal.light;
          ctx.fill();
          roundRectPath(ctx, cx - chipS * 0.25, cy - chipS * 0.25, chipS * 0.5, chipS * 0.5, chipS * 0.14);
          ctx.fillStyle = pal.dark;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.34)';
          ctx.lineWidth = Math.max(1, s * 0.025);
          roundRectPath(ctx, pad + 1, pad + 1, w - 2, w - 2, rPcb);
          ctx.stroke();

        } else if (style === 'marble') {
          // ATELIÊ MÁRMORE: Pedra polida arquitetônica com moldura dupla e brilho acetinado
          const rMar = Math.max(3, s * 0.16);
          roundRectPath(ctx, pad, pad, w, w, rMar);
          const gMar = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
          gMar.addColorStop(0, pal.light);
          gMar.addColorStop(0.5, pal.base);
          gMar.addColorStop(1, pal.dark);
          ctx.fillStyle = gMar;
          ctx.fill();

          // Moldura arquitetônica em baixo-relevo
          const m1 = w * 0.13;
          roundRectPath(ctx, pad + m1, pad + m1, w - m1 * 2, w - m1 * 2, rMar * 0.65);
          ctx.strokeStyle = 'rgba(255,255,255,0.42)';
          ctx.lineWidth = Math.max(1.2, s * 0.035);
          ctx.stroke();

          // Veio diagonal acetinado
          ctx.save();
          roundRectPath(ctx, pad + m1, pad + m1, w - m1 * 2, w - m1 * 2, rMar * 0.65);
          ctx.clip();
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = Math.max(2, s * 0.08);
          ctx.beginPath();
          ctx.moveTo(pad, pad + w * 0.72);
          ctx.quadraticCurveTo(s * 0.48, s * 0.45, pad + w, pad + w * 0.22);
          ctx.stroke();
          ctx.restore();

        } else if (style === 'wood') {
          // MADEIRA TECA: Marcenaria artesanal com veios horizontais e encaixe marchetado
          const rWood = Math.max(2, s * 0.14);
          roundRectPath(ctx, pad, pad, w, w, rWood);
          const gW = ctx.createLinearGradient(0, pad, 0, pad + w);
          gW.addColorStop(0, pal.light);
          gW.addColorStop(0.5, pal.base);
          gW.addColorStop(1, pal.dark);
          ctx.fillStyle = gW;
          ctx.fill();

          ctx.save();
          roundRectPath(ctx, pad + 2, pad + 2, w - 4, w - 4, rWood * 0.8);
          ctx.clip();
          ctx.strokeStyle = 'rgba(40, 20, 5, 0.16)';
          ctx.lineWidth = Math.max(1, s * 0.032);
          for (let i = 1; i <= 5; i++) {
            const yy = pad + (w / 6) * i;
            ctx.beginPath();
            ctx.moveTo(pad, yy);
            ctx.quadraticCurveTo(s * 0.5, yy + (i % 2 === 0 ? 3 : -3), pad + w, yy);
            ctx.stroke();
          }
          ctx.restore();

          // Marchetaria central
          const mw = w * 0.36;
          roundRectPath(ctx, (s - mw) * 0.5, (s - mw) * 0.5, mw, mw, rWood * 0.5);
          ctx.strokeStyle = 'rgba(255, 248, 235, 0.42)';
          ctx.lineWidth = Math.max(1.2, s * 0.035);
          ctx.stroke();

        } else if (style === 'magma') {
          // VULCÃO BASALTO: Rocha vulcânica escura com fissuras incandescentes
          const rMag = Math.max(2, s * 0.14);
          roundRectPath(ctx, pad, pad, w, w, rMag);
          ctx.fillStyle = pal.light;
          ctx.fill();

          const inset = s * 0.07;
          roundRectPath(ctx, pad + inset, pad + inset, w - inset * 2, w - inset * 2, rMag * 0.7);
          const gRock = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
          gRock.addColorStop(0, '#2B2120');
          gRock.addColorStop(1, '#140E0E');
          ctx.fillStyle = gRock;
          ctx.fill();

          // Fissuras de magma luminosas
          ctx.strokeStyle = pal.light;
          ctx.lineWidth = Math.max(1.6, s * 0.055);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(pad + w * 0.22, pad + w * 0.24);
          ctx.lineTo(s * 0.52, s * 0.48);
          ctx.lineTo(pad + w * 0.78, pad + w * 0.32);
          ctx.moveTo(s * 0.52, s * 0.48);
          ctx.lineTo(pad + w * 0.64, pad + w * 0.78);
          ctx.stroke();

          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = Math.max(0.8, s * 0.02);
          ctx.stroke();

        } else if (style === 'deco') {
          // OURO ART DÉCO: Moldura geométrica anos 1920 com raios solares
          const rDeco = Math.max(2, s * 0.1);
          roundRectPath(ctx, pad, pad, w, w, rDeco);
          const gDeco = ctx.createLinearGradient(pad, pad, pad + w, pad + w);
          gDeco.addColorStop(0, pal.base);
          gDeco.addColorStop(1, pal.dark);
          ctx.fillStyle = gDeco;
          ctx.fill();

          // Dupla moldura dourada
          ctx.strokeStyle = '#FDE047';
          ctx.lineWidth = Math.max(1.4, s * 0.04);
          roundRectPath(ctx, pad + s * 0.05, pad + s * 0.05, w - s * 0.1, w - s * 0.1, rDeco * 0.6);
          ctx.stroke();

          // Leque Art Déco interno
          const cx = s * 0.5;
          const by = pad + w * 0.78;
          ctx.strokeStyle = 'rgba(253, 224, 71, 0.55)';
          ctx.lineWidth = Math.max(1, s * 0.028);
          for (let a = -2; a <= 2; a++) {
            const ang = -Math.PI * 0.5 + a * 0.34;
            ctx.beginPath();
            ctx.moveTo(cx, by);
            ctx.lineTo(cx + Math.cos(ang) * w * 0.42, by + Math.sin(ang) * w * 0.42);
            ctx.stroke();
          }

        } else if (style === 'neon') {
          // NEON TÓQUIO: Miolo escuro translúcido com tubo de neon duplo e núcleo branco
          const rNeo = Math.max(3, s * 0.2);
          roundRectPath(ctx, pad, pad, w, w, rNeo);
          ctx.fillStyle = '#0D1324';
          ctx.fill();

          // Tubo externo colorido
          ctx.strokeStyle = pal.light;
          ctx.lineWidth = Math.max(2.6, s * 0.09);
          roundRectPath(ctx, pad + s * 0.08, pad + s * 0.08, w - s * 0.16, w - s * 0.16, rNeo * 0.78);
          ctx.stroke();

          // Núcleo branco fino
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = Math.max(1, s * 0.028);
          roundRectPath(ctx, pad + s * 0.08, pad + s * 0.08, w - s * 0.16, w - s * 0.16, rNeo * 0.78);
          ctx.stroke();

          // Miolo luminoso sutil
          const dotR = w * 0.13;
          ctx.fillStyle = pal.base;
          ctx.beginPath();
          ctx.arc(s * 0.5, s * 0.5, dotR, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // TERRACOTA DESERTO: Argila fosca com borda macia e arco solar gravado
          const rDune = Math.max(4, s * 0.24);
          roundRectPath(ctx, pad, pad, w, w, rDune);
          ctx.fillStyle = pal.dark;
          ctx.fill();

          const gClay = ctx.createLinearGradient(0, pad, 0, pad + w);
          gClay.addColorStop(0, pal.light);
          gClay.addColorStop(0.55, pal.base);
          gClay.addColorStop(1, pal.dark);
          roundRectPath(ctx, pad, pad, w, w * 0.93, rDune);
          ctx.fillStyle = gClay;
          ctx.fill();

          // Arco solar minimalista gravado
          ctx.strokeStyle = 'rgba(255, 247, 237, 0.5)';
          ctx.lineWidth = Math.max(1.5, s * 0.045);
          ctx.beginPath();
          ctx.arc(s * 0.5, pad + w * 0.62, w * 0.24, Math.PI, 0);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(pad + w * 0.22, pad + w * 0.68);
          ctx.lineTo(pad + w * 0.78, pad + w * 0.68);
          ctx.stroke();
        }

        return c;
      }

      buildBoardCanvases(boardPx, padPx, gapPx) {
        const bw = Math.max(64, Math.round(boardPx * this.dpr));
        this.boardCanvases = WORLDS.map(w => {
          const c = makeOffscreen(bw, bw);
          const ctx = c.getContext('2d');
          ctx.scale(this.dpr, this.dpr);

          roundRectPath(ctx, 0, 0, boardPx, boardPx, 16);
          ctx.fillStyle = w.boardBg;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = w.boardBorder;
          ctx.stroke();

          const cellR = Math.max(4, this.cellPx * 0.16);
          for (let r = 0; r < BOARD_SIZE; r++) {
            for (let col = 0; col < BOARD_SIZE; col++) {
              const x = padPx + col * (this.cellPx + gapPx);
              const y = padPx + r * (this.cellPx + gapPx);
              roundRectPath(ctx, x, y, this.cellPx, this.cellPx, cellR);
              ctx.fillStyle = w.cellBg;
              ctx.fill();
              roundRectPath(ctx, x + 1, y + 1.5, this.cellPx - 2, this.cellPx - 2.5, Math.max(3, cellR - 1));
              ctx.fillStyle = w.cellInner;
              ctx.fill();
            }
          }
          return c;
        });
      }
    }

    /* =========================================================================
       4. MASCOTE OLED GEOMÉTRICO (14 EXPRESSÕES ANIMADAS A 60 FPS)
       ========================================================================= */
    class MascotOLED {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.state = 'idle';
        this.timer = 0;
        this.stateDuration = 0;
        this.blinkTimer = 2.4;
        this.isBlinking = false;
        this.lookX = 0;
        this.lookY = 0;
        this.targetLookX = 0;
        this.targetLookY = 0;
        this.color = WORLDS[0].oledColor;
        this.t = 0;
        this.homeCycleTimer = 3.2;
      }

      setWorldColor(hex) {
        this.color = hex;
      }

      setLook(nx, ny) {
        this.targetLookX = clamp(nx, -1, 1);
        this.targetLookY = clamp(ny, -1, 1);
      }

      setState(nextState, duration = 0) {
        if (this.state === 'gameOver' && nextState !== 'idle') return;
        this.state = nextState;
        this.timer = 0;
        this.stateDuration = duration;
      }

      poke() {
        const reactions = ['wink', 'love', 'hyped', 'proud', 'curious', 'combo2'];
        const pick = reactions[Math.floor(Math.random() * reactions.length)];
        this.setState(pick, 1.35);
      }

      updateHomeShowcase(dt) {
        this.homeCycleTimer -= dt;
        if (this.homeCycleTimer <= 0) {
          this.homeCycleTimer = 3.0 + Math.random() * 2.2;
          const moods = ['wink', 'curious', 'hyped', 'proud', 'love', 'idle', 'combo2'];
          const next = moods[Math.floor(Math.random() * moods.length)];
          if (next === 'idle') {
            this.setState('idle', 0);
            this.setLook((Math.random() - 0.5) * 1.1, (Math.random() - 0.5) * 0.6);
          } else {
            this.setState(next, 1.65);
            this.setLook(0, 0);
          }
        }
        this.update(dt, 'idle');
      }

      update(dt, fallbackMood) {
        this.t += dt;
        this.lookX += (this.targetLookX - this.lookX) * Math.min(1, dt * 14);
        this.lookY += (this.targetLookY - this.lookY) * Math.min(1, dt * 14);

        if (this.stateDuration > 0) {
          this.timer += dt;
          if (this.timer >= this.stateDuration) {
            this.state = fallbackMood || 'idle';
            this.stateDuration = 0;
            this.timer = 0;
          }
        } else if (
          this.state === 'idle' ||
          this.state === 'focused' ||
          this.state === 'sleepy' ||
          this.state === 'danger' ||
          this.state === 'fuseWarning'
        ) {
          this.state = fallbackMood || 'idle';
        }

        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
          if (!this.isBlinking) {
            this.isBlinking = true;
            this.blinkTimer = 0.11;
          } else {
            this.isBlinking = false;
            this.blinkTimer = 2.2 + Math.random() * 2.6;
          }
        }

        this.render();
      }

      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = '#0B0F14';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        for (let y = 0; y < h; y += 4) ctx.fillRect(0, y, w, 1);

        let col = this.color;
        if (this.state === 'danger' || this.state === 'fuseWarning' || this.state === 'dizzy') {
          col = '#F87171';
        } else if (this.state === 'newRecord' || this.state === 'allClear' || this.state === 'aimMulti') {
          col = '#FDE047';
        } else if (this.state === 'love') {
          col = '#FB7185';
        } else if (this.state === 'fire') {
          col = '#FF6B2B';
        } else if (this.state === 'sleepy') {
          col = '#7DD3FC';
        }

        ctx.strokeStyle = col;
        ctx.fillStyle = col;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const cx = w * 0.5;
        const cy = h * 0.52;
        const ox = this.lookX * 9;
        const oy = this.lookY * 5;
        const lx = cx - 26 + ox;
        const rx = cx + 26 + ox;
        const ey = cy - 4 + oy;

        switch (this.state) {
          case 'gameOver': {
            ctx.lineWidth = 4.5;
            this.drawX(ctx, cx - 26, cy - 4, 8);
            this.drawX(ctx, cx + 26, cy - 4, 8);
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy + 18);
            ctx.quadraticCurveTo(cx, cy + 12, cx + 12, cy + 18);
            ctx.stroke();
            break;
          }
          case 'fever': {

            const c1 = FEVER_RAINBOW_COLORS[Math.floor(this.t * 14) % FEVER_RAINBOW_COLORS.length];
            const c2 = FEVER_RAINBOW_COLORS[(Math.floor(this.t * 14) + 3) % FEVER_RAINBOW_COLORS.length];
            const sc = 1 + Math.sin(this.t * 22) * 0.2;
            const hop = Math.abs(Math.sin(this.t * 16)) * -3.5;
            this.drawCrown(ctx, cx, 9 + hop, '#FDE047');
            ctx.fillStyle = c1;
            this.drawStar(ctx, cx - 26, cy - 2 + hop, 12.5 * sc);
            ctx.fillStyle = c2;
            this.drawStar(ctx, cx + 26, cy - 2 + hop, 12.5 * sc);

            ctx.beginPath();
            ctx.arc(cx, cy + 16 + hop, 11.5, 0, Math.PI);

          }
          case 'fire': {

            const jx = Math.sin(this.t * 50) * 1.8;
            this.drawCrown(ctx, cx + jx, 10, '#FDE047');
            const fl = Math.sin(this.t * 28) * 3;

            this.drawFlameEye(ctx, cx + 26 + jx, cy - 1, 13, -fl, '#FF6B2B', '#FDE047');

          }
          case 'combo4Plus': {

            roundRectPath(ctx, cx - 44, cy - 12, 36, 20, 6);
            ctx.fill();
            roundRectPath(ctx, cx + 8, cy - 12, 36, 20, 6);
            ctx.fill();
            ctx.fillRect(cx - 10, cy - 8, 20, 4);
            const sweep = ((this.t * 95) % 44) - 8;
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - 42 + sweep, cy - 10);
            ctx.lineTo(cx - 48 + sweep, cy + 6);
            ctx.moveTo(cx + 10 + sweep, cy - 10);
            ctx.lineTo(cx + 4 + sweep, cy + 6);
            ctx.stroke();
            ctx.strokeStyle = col;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy + 13, 12, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();

          }
          case 'combo3': {

            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(cx - 34, cy - 13 + bounce);
            ctx.lineTo(cx - 18, cy - 3 + bounce);
            ctx.lineTo(cx - 34, cy + 7 + bounce);
            ctx.moveTo(cx + 34, cy - 13 + bounce);
            ctx.lineTo(cx + 18, cy - 3 + bounce);
            ctx.lineTo(cx + 34, cy + 7 + bounce);

          }
          case 'combo2': {
            const sc = 1 + Math.sin(this.t * 18) * 0.18;
            this.drawStar(ctx, cx - 26, cy - 5, 12 * sc);
            this.drawStar(ctx, cx + 26, cy - 5, 12 * sc);

            ctx.beginPath();
            ctx.arc(cx + 26, cy - 4, r1, 0, Math.PI * 2);
