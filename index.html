        for (const b of this.banners) {
          if (!b.active) {
            b.active = true;
            b.life = 0;
            b.maxLife = 1.05;
            b.sprite = c;
            b.sw = 360;
            b.sh = 74;
            return;
          }
        }
      }

      /* -----------------------------------------------------------------------
         LOOP PRINCIPAL (60/120 FPS)
         ----------------------------------------------------------------------- */
      loop(ts) {
        const rawDt = (ts - this.lastTs) / 1000;
        this.lastTs = ts;
        const dt = Math.min(0.05, Math.max(0.001, rawDt));

        this.update(dt);
        if (!this.isHomeOpen) {
          this.render();
        }
        requestAnimationFrame((t) => this.loop(t));
      }

      update(dt) {
        this.time += dt;
        if (this.isHomeOpen) {
          this.homeMascot.updateHomeShowcase(dt);
          return;
        }

        if (!this.drag.active && !this.gameOver) {
          this.idleSeconds += dt;
        } else {
          this.idleSeconds = 0;
        }

        this.mascot.update(dt, this.getMoodFallback());

        if (this.hitstop > 0) {
          this.hitstop = Math.max(0, this.hitstop - dt);
          return;
        }

        if (this.shakeTime > 0) {
          this.shakeTime = Math.max(0, this.shakeTime - dt);
        }

        if (this.gameOver && this.gameOverAnim < 1) {
          this.gameOverAnim = Math.min(1, this.gameOverAnim + dt * 1.4);
        }

        for (const p of this.tray) {
          if (p && p.spawnAnim < 1) {
            p.spawnAnim = Math.min(1, p.spawnAnim + dt * 4.2);
          }
        }

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (this.cellPop[r][c] > 0) {
              this.cellPop[r][c] = Math.max(0, this.cellPop[r][c] - dt * 7.2);
            }
          }
        }

        if (this.waveActive) {
          this.waveTime += dt;
          if (this.waveTime >= 0.72) this.waveActive = false;
        }

        for (let i = this.dominoQueue.length - 1; i >= 0; i--) {
          const d = this.dominoQueue[i];
          d.delay -= dt;
          if (d.delay <= 0) {
            if (!d.pipped) {
              d.pipped = true;
              const pt = this.cellCenter(d.r, d.c);
              const isFev = this.feverMoves > 0;
              const ringCol = isFev
                ? FEVER_RAINBOW_COLORS[(d.r + d.c) % FEVER_RAINBOW_COLORS.length]
                : (BLOCK_PALETTE[d.colorId] ? BLOCK_PALETTE[d.colorId].glow : '#FFFFFF');
              this.spawnBurst(pt.x, pt.y, d.colorId, 6);
              this.spawnShatter(pt.x, pt.y, d.colorId, isFev);
              this.spawnCellRing(pt.x, pt.y, ringCol);
              if (d.idx % 2 === 0) this.audio.playDominoPip(d.idx, this.combo);
            }
            d.total -= dt;
            if (d.total <= 0) {
              this.dominoQueue.splice(i, 1);
            }
          }
        }

        if (this.boardRimFlash > 0) {
          this.boardRimFlash = Math.max(0, this.boardRimFlash - dt * 3.1);
        }
        if (this.boardZoom > 0) {
          this.boardZoom = Math.max(0, this.boardZoom - dt * 0.16);
        }
        if (this.screenFlash > 0) {
          this.screenFlash = Math.max(0, this.screenFlash - dt * 1.25);
        }

        // Emite micro-faíscas contínuas quando o bloco arrastado pode quebrar linha/coluna
        if (this.drag.active && this.drag.canDrop && (this.drag.predictedRows.length > 0 || this.drag.predictedCols.length > 0)) {
          this.previewSparkTimer -= dt;
          if (this.previewSparkTimer <= 0) {
            this.previewSparkTimer = 0.075;
            const sparkCol = BLOCK_PALETTE[this.drag.piece.colorId].glow;
            for (const r of this.drag.predictedRows) this.spawnPreviewSpark(true, r, sparkCol);
            for (const c of this.drag.predictedCols) this.spawnPreviewSpark(false, c, sparkCol);
          }
        } else {
          this.previewSparkTimer = 0;
        }

        for (const p of this.particles) {
          if (!p.active) continue;
          p.life += dt;
          if (p.life >= p.maxLife) { p.active = false; continue; }
          p.vy += (p.gravity || 0) * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vrot * dt;
        }

        for (const l of this.lasers) {
          if (!l.active) continue;
          l.life += dt;
          if (l.life >= l.maxLife) l.active = false;
        }

        for (const f of this.flashes) {
          if (!f.active) continue;
          f.life += dt;
          if (f.life >= f.maxLife) f.active = false;
        }

        for (const s of this.shockwaves) {
          if (!s.active) continue;
          if (s.delay > 0) { s.delay -= dt; continue; }
          s.life += dt;
          if (s.life >= s.maxLife) s.active = false;
        }

        for (const p of this.popups) {
          if (!p.active) continue;
          p.life += dt;
          if (p.life >= p.maxLife) p.active = false;
        }

        for (const b of this.banners) {
          if (!b.active) continue;
          b.life += dt;
          if (b.life >= b.maxLife) b.active = false;
        }

        for (const sh of this.shatterPool) {
          if (!sh.active) continue;
          sh.life += dt;
          if (sh.life >= sh.maxLife) { sh.active = false; continue; }
          sh.vy += 560 * dt;
          sh.x += sh.vx * dt;
          sh.y += sh.vy * dt;
          sh.rot += sh.vrot * dt;
        }

        for (const r of this.cellRingPool) {
          if (!r.active) continue;
          r.life += dt;
          if (r.life >= r.maxLife) r.active = false;
        }

        for (const ct of this.cutterPool) {
          if (!ct.active) continue;
          ct.life += dt;
          if (ct.life >= ct.maxLife) ct.active = false;
        }

        for (const cf of this.confettiPool) {
          if (!cf.active) continue;
          cf.life += dt;
          if (cf.life >= cf.maxLife) { cf.active = false; continue; }
          cf.vy += 120 * dt;
          cf.x += (cf.vx + Math.sin(cf.phase) * 35) * dt;
          cf.y += cf.vy * dt;
          cf.phase += cf.vphase * dt;
          cf.rot += cf.vrot * dt;
        }

        for (const b of this.bloomPool) {
          if (!b.active) continue;
          b.life += dt;
          if (b.life >= b.maxLife) b.active = false;
        }

        for (const r of this.rayPool) {
          if (!r.active) continue;
          r.life += dt;
          r.rot += r.vrot * dt;
          if (r.life >= r.maxLife) r.active = false;
        }

        for (const a of this.ambient) {
          a.y -= a.vy * dt;
          if (a.y < -0.04) {
            a.y = 1.04;
            a.x = Math.random();
          }
        }
      }

      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);
        ctx.clearRect(0, 0, this.w, this.h);

        const world = WORLDS[this.worldIdx];
        ctx.save();
        ctx.fillStyle = world.ambientColor;
        for (const a of this.ambient) {
          const pulse = 0.16 + Math.sin(this.time * 2.2 + a.phase) * 0.1;
          if (a.bright && this.sprites.softOrb) {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = pulse * 1.35;
            const sz = a.r * 5.2;
            ctx.drawImage(this.sprites.softOrb, a.x * this.w - sz * 0.5, a.y * this.h - sz * 0.5, sz, sz);
            ctx.globalCompositeOperation = 'source-over';
          } else {
            ctx.globalAlpha = pulse;
            ctx.beginPath();
            ctx.arc(a.x * this.w, a.y * this.h, a.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        let sx = 0, sy = 0;
        if (this.shakeTime > 0) {
          const factor = this.shakeTime * 4;
          sx = (Math.random() - 0.5) * this.shakeMag * Math.min(1, factor);
          sy = (Math.random() - 0.5) * this.shakeMag * Math.min(1, factor);
        }

        ctx.save();
        if (this.boardZoom > 0) {
          const z = 1 + Math.sin((this.boardZoom / 0.032) * Math.PI * 0.5) * this.boardZoom;
          const bcx = this.boardX + this.boardPx * 0.5;
          const bcy = this.boardY + this.boardPx * 0.5;
          ctx.translate(bcx + sx, bcy + sy);
          ctx.scale(z, z);
          ctx.translate(-bcx, -bcy);
        } else {
          ctx.translate(sx, sy);
        }

        const boardSprite = this.sprites.boardCanvases[this.worldIdx];
        if (boardSprite) {
          ctx.drawImage(boardSprite, this.boardX, this.boardY, this.boardPx, this.boardPx);
        }

        if (this.feverMoves > 0 && !this.gameOver) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const fevCol = FEVER_RAINBOW_COLORS[Math.floor(this.time * 10) % FEVER_RAINBOW_COLORS.length];
          ctx.strokeStyle = fevCol;
          ctx.globalAlpha = 0.72 + Math.sin(this.time * 14) * 0.22;
          ctx.lineWidth = 4.5;
          roundRectPath(ctx, this.boardX - 2, this.boardY - 2, this.boardPx + 4, this.boardPx + 4, 18);
          ctx.stroke();
          ctx.restore();
        } else if (this.combo >= 2 && !this.gameOver) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = world.accent;
          ctx.globalAlpha = 0.35 + Math.sin(this.time * 7) * 0.2;
          ctx.lineWidth = 3;
          roundRectPath(ctx, this.boardX - 1.5, this.boardY - 1.5, this.boardPx + 3, this.boardPx + 3, 17);
          ctx.stroke();
          ctx.restore();
        }

        // Pulso de impacto na moldura do tabuleiro ao quebrar linhas
        if (this.boardRimFlash > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = this.boardRimColor;
          ctx.globalAlpha = this.boardRimFlash * 0.85;
          ctx.lineWidth = 3 + this.boardRimFlash * 4.5;
          roundRectPath(ctx, this.boardX - 2, this.boardY - 2, this.boardPx + 4, this.boardPx + 4, 18);
          ctx.stroke();
          ctx.restore();
        }

        const step = this.cellPx + this.gapPx;
        const innerSpan = this.boardPx - this.padPx * 2;
        const hasPredClear = this.drag.active && this.drag.canDrop &&
          (this.drag.predictedRows.length > 0 || this.drag.predictedCols.length > 0);
        const predMulti = hasPredClear && (this.drag.predictedRows.length + this.drag.predictedCols.length >= 2);
        const predPulse = 0.5 + 0.5 * Math.sin(this.time * 13);

        // 2. Efeitos de antecipação quando um bloco AINDA NÃO ADICIONADO vai quebrar linha/coluna
        if (hasPredClear) {
          const predPal = BLOCK_PALETTE[this.drag.piece.colorId];
          const predColor = predMulti ? '#FDE047' : predPal.glow;
          const sweepPos = ((this.time * 1.65) % 1.35) - 0.18;

          ctx.save();
          // Faixa luminosa + varredura de energia + borda + colchetes [ ] nas pontas
          for (const r of this.drag.predictedRows) {
            const ry = this.boardY + this.padPx + r * step;
            const rx = this.boardX + this.padPx;

            ctx.fillStyle = predColor;
            ctx.globalAlpha = 0.16 + predPulse * 0.14;
            roundRectPath(ctx, rx - 2, ry - 2, innerSpan + 4, this.cellPx + 4, 9);
            ctx.fill();

            // Feixe de varredura deslizante
            ctx.save();
            roundRectPath(ctx, rx, ry, innerSpan, this.cellPx, 8);
            ctx.clip();
            ctx.globalCompositeOperation = 'lighter';
            const sxPos = rx + sweepPos * innerSpan;
            const swW = this.cellPx * 2.1;
            const gSweep = ctx.createLinearGradient(sxPos - swW * 0.5, 0, sxPos + swW * 0.5, 0);
            gSweep.addColorStop(0, 'rgba(255,255,255,0)');
            gSweep.addColorStop(0.5, 'rgba(255,255,255,0.45)');
            gSweep.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gSweep;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(sxPos - swW * 0.5, ry, swW, this.cellPx);
            ctx.restore();

            // Contorno energizado
            ctx.strokeStyle = predColor;
            ctx.globalAlpha = 0.65 + predPulse * 0.35;
            ctx.lineWidth = 2.5;
            roundRectPath(ctx, rx - 1.5, ry - 1.5, innerSpan + 3, this.cellPx + 3, 9);
            ctx.stroke();

            // Colchetes de mira nas pontas esquerda e direita
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2.5;
            const bk = 7;
            ctx.beginPath();
            ctx.moveTo(rx + bk, ry - 3); ctx.lineTo(rx - 3, ry - 3); ctx.lineTo(rx - 3, ry + this.cellPx + 3); ctx.lineTo(rx + bk, ry + this.cellPx + 3);
            ctx.moveTo(rx + innerSpan - bk, ry - 3); ctx.lineTo(rx + innerSpan + 3, ry - 3); ctx.lineTo(rx + innerSpan + 3, ry + this.cellPx + 3); ctx.lineTo(rx + innerSpan - bk, ry + this.cellPx + 3);
            ctx.stroke();
          }

          for (const c of this.drag.predictedCols) {
            const cx = this.boardX + this.padPx + c * step;
            const cy = this.boardY + this.padPx;

            ctx.fillStyle = predColor;
            ctx.globalAlpha = 0.16 + predPulse * 0.14;
            roundRectPath(ctx, cx - 2, cy - 2, this.cellPx + 4, innerSpan + 4, 9);
            ctx.fill();

            ctx.save();
            roundRectPath(ctx, cx, cy, this.cellPx, innerSpan, 8);
            ctx.clip();
            ctx.globalCompositeOperation = 'lighter';
            const syPos = cy + sweepPos * innerSpan;
            const swH = this.cellPx * 2.1;
            const gSweep = ctx.createLinearGradient(0, syPos - swH * 0.5, 0, syPos + swH * 0.5);
            gSweep.addColorStop(0, 'rgba(255,255,255,0)');
            gSweep.addColorStop(0.5, 'rgba(255,255,255,0.45)');
            gSweep.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gSweep;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(cx, syPos - swH * 0.5, this.cellPx, swH);
            ctx.restore();

            ctx.strokeStyle = predColor;
            ctx.globalAlpha = 0.65 + predPulse * 0.35;
            ctx.lineWidth = 2.5;
            roundRectPath(ctx, cx - 1.5, cy - 1.5, this.cellPx + 3, innerSpan + 3, 9);
            ctx.stroke();

            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2.5;
            const bk = 7;
            ctx.beginPath();
            ctx.moveTo(cx - 3, cy + bk); ctx.lineTo(cx - 3, cy - 3); ctx.lineTo(cx + this.cellPx + 3, cy - 3); ctx.lineTo(cx + this.cellPx + 3, cy + bk);
            ctx.moveTo(cx - 3, cy + innerSpan - bk); ctx.lineTo(cx - 3, cy + innerSpan + 3); ctx.lineTo(cx + this.cellPx + 3, cy + innerSpan + 3); ctx.lineTo(cx + this.cellPx + 3, cy + innerSpan - bk);
            ctx.stroke();
          }
          ctx.restore();
        }

        const waveRad = this.waveTime * 19;
        for (let r = 0; r < BOARD_SIZE; r++) {
          const rowPredicted = hasPredClear && this.drag.predictedRows.includes(r);
          for (let c = 0; c < BOARD_SIZE; c++) {
            const colorId = this.board.grid[r][c];
            if (colorId === null) continue;

            const colPredicted = hasPredClear && this.drag.predictedCols.includes(c);
            const isPredictedCell = rowPredicted || colPredicted;

            const x = this.boardX + this.padPx + c * step;
            const y = this.boardY + this.padPx + r * step;

            let useWorld = this.worldIdx;
            let wavePop = 0;
            if (this.waveActive) {
              const dist = Math.hypot(r - this.waveOriginR, c - this.waveOriginC);
              if (dist > waveRad) {
                useWorld = this.prevWorldIdx;
              } else if (waveRad - dist < 1.8) {
                wavePop = Math.sin(((waveRad - dist) / 1.8) * Math.PI) * 0.14;
              }
            }

            const pop = this.cellPop[r][c];
            const squash = pop > 0 ? Math.sin(pop * Math.PI) * 0.14 : 0;
            const predBreath = isPredictedCell ? (0.04 + predPulse * 0.05) : 0;
            const scaleX = 1 + squash + wavePop + predBreath;
            const scaleY = 1 - squash * 0.65 + wavePop + predBreath;

            const deadPhase = this.gameOver && ((r + c) / 14 <= this.gameOverAnim);
            // Blocos da linha prestes a quebrar brilham com a cor da peça arrastada
            const displayColorId = (isPredictedCell && !deadPhase) ? this.drag.piece.colorId : colorId;
            let sprite;
            if (deadPhase) {
              sprite = this.sprites.deadBlocks[useWorld];
            } else if (this.feverMoves > 0 && this.sprites.feverBlocks.length > 0) {
              const fIdx = (r + c + Math.floor(this.time * 8)) % this.sprites.feverBlocks.length;
              sprite = this.sprites.feverBlocks[fIdx];
            } else {
              sprite = this.sprites.blocks[useWorld][displayColorId];
            }

            if ((this.combo >= 2 || this.feverMoves > 0 || isPredictedCell) && !deadPhase) {
              const glow = (this.feverMoves > 0 && this.sprites.feverGlows)
                ? this.sprites.feverGlows[(r + c + Math.floor(this.time * 8)) % this.sprites.feverGlows.length]
                : this.sprites.glows[displayColorId];
              if (glow) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const glowAlpha = isPredictedCell
                  ? (0.35 + predPulse * 0.28)
                  : (this.feverMoves > 0 ? 0.34 : (this.combo >= 3 ? 0.28 : 0.18));
                ctx.globalAlpha = glowAlpha;
                const gSize = this.cellPx * (isPredictedCell ? 1.85 : (this.feverMoves > 0 ? 1.75 : 1.6));
                ctx.drawImage(glow, x + (this.cellPx - gSize) * 0.5, y + (this.cellPx - gSize) * 0.5, gSize, gSize);
                ctx.restore();
              }
            }

            if (scaleX !== 1 || scaleY !== 1) {
              const dw = this.cellPx * scaleX;
              const dh = this.cellPx * scaleY;
              ctx.drawImage(sprite, x + (this.cellPx - dw) * 0.5, y + (this.cellPx - dh) * 0.5, dw, dh);
            } else {
              ctx.drawImage(sprite, x, y, this.cellPx, this.cellPx);
            }

            // Brilho especular pulsante sobre células prestes a explodir
            if (isPredictedCell && !deadPhase) {
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              ctx.fillStyle = '#FFFFFF';
              ctx.globalAlpha = 0.14 + predPulse * 0.18;
              roundRectPath(ctx, x + 2, y + 2, this.cellPx - 4, this.cellPx - 4, Math.max(3, this.cellPx * 0.16));
              ctx.fill();
              ctx.restore();
            }
          }
        }

        // Crosshair pulsante nos pontos de cruzamento linha × coluna previstos
        if (hasPredClear && this.drag.predictedRows.length > 0 && this.drag.predictedCols.length > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (const r of this.drag.predictedRows) {
            for (const c of this.drag.predictedCols) {
              const pt = this.cellCenter(r, c);
              ctx.strokeStyle = '#FFFFFF';
              ctx.globalAlpha = 0.65 + predPulse * 0.35;
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, this.cellPx * (0.38 + predPulse * 0.16), 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        for (const d of this.dominoQueue) {
          const x = this.boardX + this.padPx + d.c * step;
          const y = this.boardY + this.padPx + d.r * step;
          const sprite = this.sprites.blocks[d.worldIdx][d.colorId];
          if (d.delay > 0) {
            ctx.drawImage(sprite, x, y, this.cellPx, this.cellPx);
          } else {
            const p = clamp(d.total / 0.14, 0, 1);
            const sz = this.cellPx * (0.25 + p * 0.92);
            ctx.save();
            ctx.globalAlpha = p;
            ctx.drawImage(sprite, x + (this.cellPx - sz) * 0.5, y + (this.cellPx - sz) * 0.5, sz, sz);
            // Micro-flash branco incandescente no instante inicial do estouro da célula
            if (p > 0.55) {
              ctx.globalCompositeOperation = 'lighter';
              ctx.fillStyle = '#FFFFFF';
              ctx.globalAlpha = (p - 0.55) * 1.8;
              roundRectPath(ctx, x + (this.cellPx - sz) * 0.5, y + (this.cellPx - sz) * 0.5, sz, sz, Math.max(4, sz * 0.2));
              ctx.fill();
            }
            ctx.restore();
          }
        }

        if (this.drag.active && this.drag.canDrop && this.drag.piece) {
          const piece = this.drag.piece;
          const sprite = this.sprites.blocks[this.worldIdx][piece.colorId];
          ctx.save();
          ctx.globalAlpha = hasPredClear ? (0.56 + predPulse * 0.24) : 0.38;
          for (let r = 0; r < piece.matrix.length; r++) {
            for (let c = 0; c < piece.matrix[0].length; c++) {
              if (!piece.matrix[r][c]) continue;
              const x = this.boardX + this.padPx + (this.drag.snapC + c) * step;
              const y = this.boardY + this.padPx + (this.drag.snapR + r) * step;
              ctx.drawImage(sprite, x, y, this.cellPx, this.cellPx);
              if (hasPredClear) {
                ctx.strokeStyle = predMulti ? '#FDE047' : '#FFFFFF';
                ctx.lineWidth = 2.2;
                roundRectPath(ctx, x + 1, y + 1, this.cellPx - 2, this.cellPx - 2, Math.max(3, this.cellPx * 0.16));
                ctx.stroke();
              }
            }
          }
          ctx.restore();
        }

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const f of this.flashes) {
          if (!f.active) continue;
          const a = 1 - f.life / f.maxLife;
          ctx.globalAlpha = a * 0.52;
          ctx.fillStyle = f.color;
          if (f.isRow) {
            const ry = this.boardY + this.padPx + f.index * step;
            roundRectPath(ctx, this.boardX + this.padPx, ry, this.boardPx - this.padPx * 2, this.cellPx, 8);
          } else {
            const cx = this.boardX + this.padPx + f.index * step;
            roundRectPath(ctx, cx, this.boardY + this.padPx, this.cellPx, this.boardPx - this.padPx * 2, 8);
          }
          ctx.fill();
        }

        for (const l of this.lasers) {
          if (!l.active) continue;
          const t = l.life / l.maxLife;
          const outerThick = this.cellPx * (1 - t) * 1.15;
          const coreThick = this.cellPx * (1 - t) * 0.48;
          if (l.isRow) {
            const cy = this.boardY + this.padPx + l.index * step + this.cellPx * 0.5;
            ctx.globalAlpha = (1 - t) * 0.58;
            ctx.fillStyle = l.color;
            ctx.fillRect(this.boardX + this.padPx, cy - outerThick * 0.5, this.boardPx - this.padPx * 2, outerThick);
            ctx.globalAlpha = (1 - t) * 0.96;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(this.boardX + this.padPx, cy - coreThick * 0.5, this.boardPx - this.padPx * 2, coreThick);
          } else {
            const cx = this.boardX + this.padPx + l.index * step + this.cellPx * 0.5;
            ctx.globalAlpha = (1 - t) * 0.58;
            ctx.fillStyle = l.color;
            ctx.fillRect(cx - outerThick * 0.5, this.boardY + this.padPx, outerThick, this.boardPx - this.padPx * 2);
            ctx.globalAlpha = (1 - t) * 0.96;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(cx - coreThick * 0.5, this.boardY + this.padPx, coreThick, this.boardPx - this.padPx * 2);
          }
        }

        for (const s of this.shockwaves) {
          if (!s.active || s.delay > 0) continue;
          const t = s.life / s.maxLife;
          const ease = 1 - Math.pow(1 - t, 3);
          ctx.globalAlpha = (1 - t) * 0.78;
          ctx.strokeStyle = s.color;
          ctx.lineWidth = Math.max(1.5, (1 - t) * 8);
          ctx.beginPath();
          ctx.arc(s.x, s.y, ease * s.maxR, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Anéis de estouro por célula na onda dominó
        for (const r of this.cellRingPool) {
          if (!r.active) continue;
          const t = r.life / r.maxLife;
          const ease = 1 - Math.pow(1 - t, 2.5);
          ctx.globalAlpha = (1 - t) * 0.85;
          ctx.strokeStyle = r.color;
          ctx.lineWidth = Math.max(1.2, (1 - t) * 4.5);
          ctx.beginPath();
          ctx.arc(r.x, r.y, ease * r.maxR, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Lâmina cortadora de luz cruzando a linha/coluna de ponta a ponta
        for (const ct of this.cutterPool) {
          if (!ct.active) continue;
          const t = ct.life / ct.maxLife;
          const prog = ct.dir > 0 ? t : (1 - t);
          const span = this.boardPx - this.padPx * 2;
          const bladeLen = this.cellPx * 2.4;
          ctx.globalAlpha = (1 - t * 0.65) * 0.95;
          if (ct.isRow) {
            const cy = this.boardY + this.padPx + ct.index * step + this.cellPx * 0.5;
            const bx = this.boardX + this.padPx + prog * span;
            const g = ctx.createLinearGradient(bx - bladeLen * 0.5, 0, bx + bladeLen * 0.5, 0);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(0.5, '#FFFFFF');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(bx - bladeLen * 0.5, cy - this.cellPx * 0.42, bladeLen, this.cellPx * 0.84);
          } else {
            const cx = this.boardX + this.padPx + ct.index * step + this.cellPx * 0.5;
            const by = this.boardY + this.padPx + prog * span;
            const g = ctx.createLinearGradient(0, by - bladeLen * 0.5, 0, by + bladeLen * 0.5);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(0.5, '#FFFFFF');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(cx - this.cellPx * 0.42, by - bladeLen * 0.5, this.cellPx * 0.84, bladeLen);
          }
        }

        // Explosões radiais de brilho colorido (bloomPool)
        for (const b of this.bloomPool) {
          if (!b.active) continue;
          const t = b.life / b.maxLife;
          const ease = 1 - Math.pow(1 - t, 2.6);
          const sz = b.maxR * 2 * (0.25 + ease * 0.85);
          const gSprite = (b.isFever && this.sprites.feverGlows)
            ? this.sprites.feverGlows[(b.colorId + Math.floor(this.time * 12)) % this.sprites.feverGlows.length]
            : this.sprites.glows[b.colorId];
          if (gSprite) {
            ctx.globalAlpha = (1 - t) * 0.78;
            ctx.drawImage(gSprite, b.x - sz * 0.5, b.y - sz * 0.5, sz, sz);
          }
        }

        // Raios prismáticos giratórios (rayPool)
        for (const r of this.rayPool) {
          if (!r.active) continue;
          const t = r.life / r.maxLife;
          const ease = 1 - Math.pow(1 - t, 2.4);
          const len = r.maxR * (0.3 + ease * 0.85);
          const halfW = Math.max(2, (1 - t) * 11);
          ctx.save();
          ctx.translate(r.x, r.y);
          ctx.rotate(r.rot);
          ctx.globalAlpha = (1 - t) * 0.82;
          for (let i = 0; i < r.rays; i++) {
            const ang = (Math.PI * 2 * i) / r.rays;
            ctx.save();
            ctx.rotate(ang);
            ctx.fillStyle = (i % 2 === 0) ? r.color : r.color2;
            ctx.beginPath();
            ctx.moveTo(0, -halfW * 0.4);
            ctx.lineTo(len, 0);
            ctx.lineTo(0, halfW * 0.4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }
        ctx.restore();

        ctx.restore();

        // 7. Bandeja inferior de 3 peças
        const trayCenterY = this.trayY + this.trayH * 0.5;
        const maxSlotW = (this.boardPx / 3) * 0.84;
        const maxSlotH = this.trayH * 0.84;

        for (let i = 0; i < 3; i++) {
          const piece = this.tray[i];
          if (!piece) continue;
          if (this.drag.active && this.drag.trayIndex === i) continue;

          const rows = piece.matrix.length;
          const cols = piece.matrix[0].length;
          const fits = this.board.canFitMatrixAnywhere(piece.matrix);

          const baseCell = Math.min(this.cellPx * 0.62, maxSlotW / cols, maxSlotH / rows);
          const pGap = Math.max(2, baseCell * 0.1);
          const anim = piece.spawnAnim < 1
            ? (1 - Math.pow(1 - piece.spawnAnim, 3))
            : 1;
          const cell = baseCell * anim;
          const pw = cols * cell + (cols - 1) * pGap;
          const ph = rows * cell + (rows - 1) * pGap;
          const startX = this.slotCenters[i] - pw * 0.5;
          const startY = trayCenterY - ph * 0.5;

          const sprite = (this.feverMoves > 0 && this.sprites.feverBlocks.length > 0)
            ? this.sprites.feverBlocks[(i * 2 + Math.floor(this.time * 8)) % this.sprites.feverBlocks.length]
            : this.sprites.blocks[this.worldIdx][piece.colorId];
          ctx.save();
          if (!fits) ctx.globalAlpha = 0.34;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!piece.matrix[r][c]) continue;
              ctx.drawImage(sprite, startX + c * (cell + pGap), startY + r * (cell + pGap), cell, cell);
            }
          }
          ctx.restore();
        }

        // 8. Peça sendo arrastada
        if (this.drag.active && this.drag.piece) {
          const piece = this.drag.piece;
          const liftY = this.drag.isTouch ? Math.max(72, this.cellPx * 1.95) : Math.max(26, this.cellPx * 0.65);
          const rows = piece.matrix.length;
          const cols = piece.matrix[0].length;
          const scale = 1.04;
          const dCell = this.cellPx * scale;
          const dGap = this.gapPx * scale;
          const pw = cols * dCell + (cols - 1) * dGap;
          const ph = rows * dCell + (rows - 1) * dGap;
          const sx0 = this.drag.x - pw * 0.5;
          const sy0 = (this.drag.y - liftY) - ph * 0.5;
          const sprite = (this.feverMoves > 0 && this.sprites.feverBlocks.length > 0)
            ? this.sprites.feverBlocks[Math.floor(this.time * 10) % this.sprites.feverBlocks.length]
            : this.sprites.blocks[this.worldIdx][piece.colorId];

          // Halo luminoso atrás da peça arrastada (mais forte ao prever quebra)
          const dragGlow = (this.feverMoves > 0 && this.sprites.feverGlows)
            ? this.sprites.feverGlows[Math.floor(this.time * 10) % this.sprites.feverGlows.length]
            : this.sprites.glows[piece.colorId];
          if (dragGlow) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = hasPredClear ? (0.45 + predPulse * 0.25) : 0.22;
            const gSz = dCell * 1.9;
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                if (!piece.matrix[r][c]) continue;
                const gx = sx0 + c * (dCell + dGap) + (dCell - gSz) * 0.5;
                const gy = sy0 + r * (dCell + dGap) + (dCell - gSz) * 0.5;
                ctx.drawImage(dragGlow, gx, gy, gSz, gSz);
              }
            }
            ctx.restore();
          }

          ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!piece.matrix[r][c]) continue;
              roundRectPath(ctx, sx0 + c * (dCell + dGap) + 3, sy0 + r * (dCell + dGap) + 7, dCell, dCell, dCell * 0.18);
              ctx.fill();
            }
          }
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!piece.matrix[r][c]) continue;
              ctx.drawImage(sprite, sx0 + c * (dCell + dGap), sy0 + r * (dCell + dGap), dCell, dCell);
            }
          }
        }

        // 9. Partículas (Fragmentos, Estrelas e Streaks de Velocidade)
        for (const p of this.particles) {
          if (!p.active) continue;
          const a = 1 - p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          if (p.kind === 1) {
            const star = this.sprites.starSprites[p.starIdx];
            const sz = p.size * 2.2;
            ctx.drawImage(star, -sz * 0.5, -sz * 0.5, sz, sz);
          } else if (p.kind === 2) {
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = p.color;
            const len = p.size * (0.6 + a * 0.9);
            const th = Math.max(1.8, 3.4 * a);
            roundRectPath(ctx, -len * 0.5, -th * 0.5, len, th, th * 0.5);
            ctx.fill();
          } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
          }
          ctx.restore();
        }

        // 9b. Estilhaços giratórios dos blocos quebrados
        for (const sh of this.shatterPool) {
          if (!sh.active) continue;
          const a = 1 - sh.life / sh.maxLife;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.fillStyle = sh.color;
          roundRectPath(ctx, -sh.w * 0.5, -sh.h * 0.5, sh.w, sh.h, 2);
          ctx.fill();
          ctx.fillStyle = sh.light;
          ctx.fillRect(-sh.w * 0.35, -sh.h * 0.35, sh.w * 0.7, Math.max(1.5, sh.h * 0.28));
          ctx.restore();
        }

        // 9c. Chuva de confetes metálicos 3D (multi-linhas / combos 3x+ / FEVER)
        for (const cf of this.confettiPool) {
          if (!cf.active) continue;
          const a = 1 - Math.pow(cf.life / cf.maxLife, 2);
          const flipW = Math.max(1.5, Math.abs(Math.cos(cf.phase)) * cf.size);
          ctx.save();
          ctx.globalAlpha = clamp(a, 0, 1);
          ctx.translate(cf.x, cf.y);
          ctx.rotate(cf.rot);
          ctx.fillStyle = cf.color;
          ctx.fillRect(-flipW * 0.5, -cf.size * 0.32, flipW, cf.size * 0.64);
          ctx.restore();
        }

        // 10. Banners centrais
        for (const b of this.banners) {
          if (!b.active || !b.sprite) continue;
          const t = b.life / b.maxLife;
          let sc = 1;
          let alpha = 1;
          if (t < 0.18) {
            const k = t / 0.18;
            sc = 0.55 + Math.sin(k * Math.PI * 0.65) * 0.55;
          } else if (t > 0.75) {
            alpha = 1 - (t - 0.75) / 0.25;
          }
          const bx = this.boardX + this.boardPx * 0.5;
          const by = this.boardY + this.boardPx * 0.34 - t * 18;
          const dw = Math.min(this.boardPx * 0.92, b.sw * 0.85) * sc;
          const dh = (b.sh / b.sw) * dw;

          ctx.save();
          ctx.globalAlpha = clamp(alpha, 0, 1);
          ctx.drawImage(b.sprite, bx - dw * 0.5, by - dh * 0.5, dw, dh);
          ctx.restore();
        }

        // 10b. Flash luminoso de impacto colorido (Additive Blending)
        if (this.screenFlash > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = this.screenFlashColor;
          ctx.globalAlpha = this.screenFlash;
          ctx.fillRect(0, 0, this.w, this.h);
          ctx.restore();
        }

        // 11. Z-ORDER MÁXIMO: Popups de pontuação WCAG AAA + Badge de Qualidade
        for (const p of this.popups) {
          if (!p.active) continue;
          const t = p.life / p.maxLife;
          const alpha = t < 0.14 ? t / 0.14 : (t > 0.72 ? (1 - t) / 0.28 : 1);
          const lift = Math.pow(t, 0.7) * 44;

          ctx.save();
          ctx.globalAlpha = clamp(alpha, 0, 1);

          ctx.font = '800 18px "Space Grotesk", system-ui, sans-serif';
          const scoreW = ctx.measureText(p.text).width;
          const pillW = Math.max(66, scoreW + 24);
          const pillH = 32;

          let badgeW = 0;
          const badgeH = 24;
          if (p.badge) {
            ctx.font = '800 12px "Inter", system-ui, sans-serif';
            badgeW = ctx.measureText(p.badge).width + 20;
          }

          const halfW = Math.max(pillW, badgeW) * 0.5 + 8;
          const px = clamp(p.x, halfW, this.w - halfW);
          const topPad = p.badge ? 46 : 24;
          const py = clamp(p.y - lift, topPad, this.h - 24);

          if (p.badge) {
            const by = py - pillH * 0.5 - badgeH * 0.5 - 5;
            roundRectPath(ctx, px - badgeW * 0.5, by - badgeH * 0.5, badgeW, badgeH, 12);
            ctx.fillStyle = p.badgeColor;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(13, 17, 23, 0.85)';
            ctx.stroke();

            ctx.font = '800 11.5px "Inter", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(p.badge, px, by + 0.5);
          }

          roundRectPath(ctx, px - pillW * 0.5, py - pillH * 0.5, pillW, pillH, 16);
          ctx.fillStyle = 'rgba(13, 17, 23, 0.94)';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = p.isGold ? '#FDE047' : '#FFFFFF';
          ctx.stroke();

          ctx.font = '800 18px "Space Grotesk", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = p.isGold ? '#FDE047' : '#FFFFFF';
          ctx.fillText(p.text, px, py + 0.5);

          ctx.restore();
        }

        ctx.restore();
      }
    }

    /* =========================================================================
       8. INICIALIZAÇÃO & SERVICE WORKER PWA
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      new KubikoGame();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  })();
  </script>
</body>
</html>
