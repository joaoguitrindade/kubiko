            ctx.arc(cx, cy + 12, 13, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = '#38BDF8';
            ctx.fillRect(14, 12 + Math.sin(this.t * 16) * 5, 6, 6);
            ctx.fillStyle = '#34D399';
            ctx.fillRect(w - 22, 16 + Math.cos(this.t * 14) * 5, 6, 6);
            break;
          }
          case 'newRecord': {
            this.drawCrown(ctx, cx, 10, '#FDE047');
            this.drawStar(ctx, cx - 26, cy + 2, 10);
            this.drawStar(ctx, cx + 26, cy + 2, 10);
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy + 17, 10, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
            break;
          }
          case 'place': {
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.arc(cx - 26, cy + 1, 9, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 26, cy + 1, 9, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy + 13, 8, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
            break;
          }
          case 'streakBroken': {
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx - 35, cy - 10);
            ctx.lineTo(cx - 17, cy - 4);
            ctx.moveTo(cx + 35, cy - 10);
            ctx.lineTo(cx + 17, cy - 4);
            ctx.stroke();
            ctx.fillRect(cx - 32, cy - 1, 12, 6);
            ctx.fillRect(cx + 20, cy - 1, 12, 6);
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy + 20);
            ctx.quadraticCurveTo(cx, cy + 12, cx + 12, cy + 20);
            ctx.stroke();
            break;
          }
          case 'fuseWarning': {
            const jitter = Math.sin(this.t * 34) * 1.8;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(cx - 26 + jitter, cy - 4, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 26 + jitter, cy - 4, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillRect(cx - 28 + jitter, cy - 6, 4, 4);
            ctx.fillRect(cx + 24 + jitter, cy - 6, 4, 4);
            ctx.beginPath();
            ctx.moveTo(cx - 14, cy + 17);
            ctx.lineTo(cx - 6, cy + 13);
            ctx.lineTo(cx, cy + 18);
            ctx.lineTo(cx + 6, cy + 13);
            ctx.lineTo(cx + 14, cy + 17);
            ctx.stroke();
            break;
          }
          case 'danger': {
            const dropY = 12 + ((this.t * 22) % 18);
            ctx.fillStyle = '#38BDF8';
            ctx.beginPath();
            ctx.arc(w - 18, dropY, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(lx, ey, 8.5, 0, Math.PI * 2);
            ctx.arc(rx, ey, 8.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy + 19);
            ctx.quadraticCurveTo(cx, cy + 13, cx + 12, cy + 19);
            ctx.stroke();
            break;
          }
          case 'tracking':
          case 'idle':
          default: {
            if (this.isBlinking && this.state === 'idle') {
              ctx.lineWidth = 4.5;
              ctx.beginPath();
              ctx.moveTo(lx - 9, ey);
              ctx.lineTo(lx + 9, ey);
              ctx.moveTo(rx - 9, ey);
              ctx.lineTo(rx + 9, ey);
              ctx.stroke();
            } else {
              roundRectPath(ctx, lx - 7, ey - 10, 14, 20, 6);
              ctx.fill();
              roundRectPath(ctx, rx - 7, ey - 10, 14, 20, 6);
              ctx.fill();
              ctx.fillStyle = '#0B0F14';
              ctx.beginPath();
              ctx.arc(lx + 2.2, ey - 4, 2.5, 0, Math.PI * 2);
              ctx.arc(rx + 2.2, ey - 4, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.strokeStyle = col;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(cx - 9, cy + 16);
            ctx.quadraticCurveTo(cx, cy + 21, cx + 9, cy + 16);
            ctx.stroke();
            break;
          }
        }
      }

      drawX(ctx, x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x - r, y - r);
        ctx.lineTo(x + r, y + r);
        ctx.moveTo(x + r, y - r);
        ctx.lineTo(x - r, y + r);
        ctx.stroke();
      }

      drawStar(ctx, x, y, r) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const ang = (i * Math.PI) / 4;
          const rad = i % 2 === 0 ? r : r * 0.42;
          const px = x + Math.cos(ang) * rad;
          const py = y + Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      drawDiamond(ctx, x, y, rx, ry) {
        ctx.beginPath();
        ctx.moveTo(x, y - ry);
        ctx.lineTo(x + rx, y);
        ctx.lineTo(x, y + ry);
        ctx.lineTo(x - rx, y);
        ctx.closePath();
        ctx.fill();
      }

      drawHeart(ctx, x, y, s) {
        ctx.beginPath();
        ctx.moveTo(x, y + s * 0.65);
        ctx.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.75, y - s * 1.0, x, y - s * 0.35);
        ctx.bezierCurveTo(x + s * 0.75, y - s * 1.0, x + s * 1.2, y - s * 0.1, x, y + s * 0.65);
        ctx.closePath();
        ctx.fill();
      }

      drawSpiral(ctx, cx, cy, maxR, startAng) {
        ctx.beginPath();
        for (let i = 0; i <= 22; i++) {
          const p = i / 22;
          const a = startAng + p * Math.PI * 3.4;
          const r = p * maxR;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      drawFlameEye(ctx, x, y, r, sway, outerCol, innerCol) {
        ctx.fillStyle = outerCol;
        ctx.beginPath();
        ctx.moveTo(x + sway, y - r);
        ctx.quadraticCurveTo(x + r * 0.9, y - r * 0.1, x + r * 0.65, y + r * 0.65);
        ctx.quadraticCurveTo(x, y + r * 0.9, x - r * 0.65, y + r * 0.65);
        ctx.quadraticCurveTo(x - r * 0.9, y - r * 0.1, x + sway, y - r);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = innerCol;
        ctx.beginPath();
        ctx.moveTo(x + sway * 0.5, y - r * 0.45);
        ctx.quadraticCurveTo(x + r * 0.42, y + r * 0.1, x, y + r * 0.55);
        ctx.quadraticCurveTo(x - r * 0.42, y + r * 0.1, x + sway * 0.5, y - r * 0.45);
        ctx.closePath();
        ctx.fill();
      }

      drawCrown(ctx, cx, y, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx - 14, y + 10);
        ctx.lineTo(cx - 16, y);
        ctx.lineTo(cx - 6, y + 6);
        ctx.lineTo(cx, y - 3);
        ctx.lineTo(cx + 6, y + 6);
        ctx.lineTo(cx + 16, y);
        ctx.lineTo(cx + 14, y + 10);
        ctx.closePath();
        ctx.fill();
      }
    }

    /* =========================================================================
       5. MOTOR SONORO PROCEDURAL MOBILE-READY (iOS SAFARI + ANDROID CHROME)
          - audioSession = 'playback' (toca mesmo no modo silencioso do iPhone)
          - Silent AudioBufferSourceNode unlock em touchstart/touchend/click
          - Trata estados 'suspended' E 'interrupted' do iOS
          - DynamicsCompressorNode para alto-falantes de celular sem distorção
       ========================================================================= */
    class StreakAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.enabled = true;
        this.unlocked = false;
        this.activeVoices = 0;
        this.maxVoices = 14;
        this.lastSig = -1;
        this.prevSig = -1;

        try {
          const saved = localStorage.getItem(STORAGE_SOUND_KEY);
          if (saved === '0') this.enabled = false;
        } catch (e) {}

        // Permite áudio no canal de mídia no iOS Safari 16.4+ mesmo com chave lateral no silencioso
        try {
          if (typeof navigator !== 'undefined' && navigator.audioSession) {
            navigator.audioSession.type = 'playback';
          }
        } catch (e) {}

        this.bindGlobalMobileUnlock();
      }

      bindGlobalMobileUnlock() {
        const events = ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'];
        const onGesture = () => {
          if (!this.enabled) return;
          this.unlock();
          if (this.ctx && this.ctx.state === 'running' && this.unlocked) {
            events.forEach(ev => document.removeEventListener(ev, onGesture, true));
          }
        };
        events.forEach(ev => document.addEventListener(ev, onGesture, { capture: true, passive: true }));

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && this.enabled && this.ctx && this.ctx.state !== 'running') {
            this.ctx.resume().catch(() => {});
          }
        });
      }

      ensureContext() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();

          // Compressor + ganho mestre para som limpo e audível em alto-falantes mobile
          const comp = this.ctx.createDynamicsCompressor();
          comp.threshold.setValueAtTime(-16, this.ctx.currentTime);
          comp.knee.setValueAtTime(18, this.ctx.currentTime);
          comp.ratio.setValueAtTime(4, this.ctx.currentTime);
          comp.attack.setValueAtTime(0.004, this.ctx.currentTime);
          comp.release.setValueAtTime(0.15, this.ctx.currentTime);

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(1.15, this.ctx.currentTime);

          this.masterGain.connect(comp);
          comp.connect(this.ctx.destination);
        }
        return this.ctx;
      }

      unlock(onReadyCallback = null) {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;

        // Dispara buffer silencioso de 1 sample síncrono dentro do gesto tátil (obrigatório no iOS WebKit)
        try {
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
          this.unlocked = true;
        } catch (e) {}

        if (ctx.state !== 'running') {
          ctx.resume().then(() => {
            if (onReadyCallback) onReadyCallback();
          }).catch(() => {});
        } else if (onReadyCallback) {
          onReadyCallback();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        try { localStorage.setItem(STORAGE_SOUND_KEY, this.enabled ? '1' : '0'); } catch (e) {}
        if (this.enabled) {
          this.unlock(() => this.playPickup());
        }
        return this.enabled;
      }

      tone(freq, type, startOffset, dur, vol = 0.14, slideTo = null, filterFreq = 0) {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx || this.activeVoices >= this.maxVoices) return;

        const schedule = () => {
          const now = ctx.currentTime + startOffset;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), now + dur);
          }

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          if (filterFreq > 0) {
            const filt = ctx.createBiquadFilter();
            filt.type = 'lowpass';
            filt.frequency.setValueAtTime(filterFreq, now);
            osc.connect(filt);
            filt.connect(gain);
          } else {
            osc.connect(gain);
          }

          gain.connect(this.masterGain || ctx.destination);
          this.activeVoices++;
          osc.onended = () => {
            this.activeVoices = Math.max(0, this.activeVoices - 1);
            try { osc.disconnect(); gain.disconnect(); } catch (e) {}
          };
          osc.start(now);
          osc.stop(now + dur + 0.025);
        };

        if (ctx.state !== 'running') {
          ctx.resume().then(schedule).catch(() => {});
        } else {
          schedule();
        }
      }

      playStartGame() {
        this.unlock(() => {
          [392.0, 493.88, 587.33, 783.99].forEach((n, i) => {
            this.tone(n, 'triangle', i * 0.045, 0.2, 0.13);
          });
        });
      }

      playPickup() {
        this.unlock();
        this.tone(330, 'triangle', 0, 0.07, 0.11, 510);
      }

      playHoverTick() {
        this.tone(880, 'sine', 0, 0.022, 0.032, 1000);
      }

      playPlace(blockCount) {
        this.unlock();
        const base = 150 + Math.min(8, blockCount) * 8;
        this.tone(base, 'triangle', 0, 0.095, 0.19, base * 0.65);
        this.tone(base * 2.2, 'sine', 0.01, 0.05, 0.08, base * 1.8);
      }

      playDominoPip(idx, combo) {
        const pent = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
        const mult = Math.pow(1.06, Math.min(combo, 10));
        this.tone(pent[idx % pent.length] * mult, 'sine', 0, 0.085, 0.07);
      }

      // 12 Assinaturas Musicais de Streak / Combo com anti-repetição
      playStreakSignature(combo, linesCleared) {
        this.unlock();
        let sig = Math.floor(Math.random() * 12);
        if (sig === this.lastSig || sig === this.prevSig) {
          sig = (sig + 3) % 12;
        }
        this.prevSig = this.lastSig;
        this.lastSig = sig;

        const transpose = Math.pow(1.059463, Math.min(combo - 1, 10));
        const extra = linesCleared >= 2 ? 1.12246 : 1;
        const f = (hz) => hz * transpose * extra;

        switch (sig) {
          case 0:
            [261.6, 329.6, 392.0, 523.2].forEach((n, i) => this.tone(f(n), 'sine', i * 0.045, 0.22, 0.14));
            break;
          case 1:
            [523.2, 659.2, 784.0, 1046.5].forEach((n, i) => this.tone(f(n), 'triangle', i * 0.04, 0.28, 0.11));
            break;
          case 2:
            [220.0, 277.2, 329.6, 440.0].forEach((n, i) => this.tone(f(n), 'sawtooth', i * 0.05, 0.18, 0.09, null, 1800));
            break;
          case 3:
            [330, 392, 494, 659, 784].forEach((n, i) => this.tone(f(n), 'square', i * 0.036, 0.11, 0.07));
            break;
          case 4:
            [261.6, 329.6, 392.0, 493.9].forEach((n, i) => {
              this.tone(f(n), 'sine', i * 0.025, 0.34, 0.11);
              this.tone(f(n * 2), 'triangle', i * 0.025, 0.12, 0.05);
            });
            break;
          case 5:
            [587.3, 880.0, 1174.6].forEach((n, i) => {
              this.tone(f(n), 'sine', i * 0.042, 0.25, 0.11, f(n * 1.03));
              this.tone(f(n * 1.5), 'triangle', i * 0.042, 0.14, 0.05);
            });
            break;
          case 6:
            [349.2, 440.0, 523.2, 659.2].forEach((n, i) => this.tone(f(n), 'triangle', i * 0.055, 0.32, 0.12));
            break;
          case 7:
            this.tone(f(110), 'sawtooth', 0, 0.18, 0.15, f(82), 620);
            [659.2, 880.0, 1318.5].forEach((n, i) => this.tone(f(n), 'sine', 0.06 + i * 0.035, 0.2, 0.09));
            break;
          case 8:
            [293.7, 329.6, 440.0, 466.2, 587.3].forEach((n, i) => this.tone(f(n), 'sawtooth', i * 0.042, 0.19, 0.075, null, 2400));
            break;
          case 9:
            [523.2, 784.0, 987.8, 1174.7].forEach((n, i) => this.tone(f(n), 'sine', i * 0.05, 0.38, 0.1));
            break;
          case 10:
            [261.6, 329.6, 392.0, 523.2].forEach((n, i) => this.tone(f(n), 'sawtooth', i * 0.055, 0.24, 0.085, null, 1450));
            break;
          case 11:
          default:
            [440, 554.4, 659.3, 880].forEach((n, i) => this.tone(f(n), 'triangle', i * 0.038, 0.22, 0.11, f(n * 1.25)));
            break;
        }
      }

      playQualityStimulus(tier) {
        this.unlock();
        if (tier === 'clean') {
          this.tone(523.25, 'sine', 0.03, 0.12, 0.085);
          this.tone(659.25, 'triangle', 0.08, 0.15, 0.09);
        } else if (tier === 'good') {
          this.tone(587.33, 'triangle', 0.08, 0.16, 0.095);
          this.tone(880.0, 'sine', 0.14, 0.2, 0.1);
        } else if (tier === 'great') {
          [523.25, 659.25, 783.99].forEach((n, i) => this.tone(n, 'triangle', 0.09 + i * 0.045, 0.22, 0.1));
        } else {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((n, i) => this.tone(n, 'sine', 0.08 + i * 0.04, 0.28, 0.11));
        }
      }

      playWorldShift() {
        [330, 440, 554.4, 659.3, 880].forEach((n, i) => this.tone(n, 'triangle', i * 0.055, 0.34, 0.11));
      }

      playFuseWarn() {
        this.tone(360, 'sine', 0, 0.09, 0.08, 300);
      }

      playStreakBroken() {
        this.tone(310, 'triangle', 0, 0.15, 0.1, 175);
      }

      playFeverStart() {
        this.unlock(() => {
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
          notes.forEach((n, i) => {
            this.tone(n, 'triangle', i * 0.045, 0.28, 0.13);
            this.tone(n * 1.5, 'sine', i * 0.045 + 0.015, 0.18, 0.06);
          });
        });
      }

      playFeverClear() {
        this.unlock();
        const notes = [659.25, 880.0, 1046.5, 1318.5, 1760.0];
        notes.forEach((n, i) => {
          this.tone(n, 'sine', i * 0.032, 0.24, 0.11);
        });
      }

      playRecordFanfare() {
        [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => this.tone(n, 'triangle', i * 0.07, 0.32, 0.13));
      }

      playGameOver() {
        [330, 293.7, 261.6, 196.0].forEach((n, i) => this.tone(n, 'sawtooth', i * 0.12, 0.32, 0.09, null, 900));
      }
    }

    /* =========================================================================
       6. TABULEIRO, RUNS ENGATILHADAS DE COMBO E GERADOR DE PEÇAS DE RECOMPENSA
       ========================================================================= */
    class Board {
      constructor() {
        this.grid = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
      }

      cloneGrid() {
        return this.grid.map(row => row.slice());
      }

      reset() {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) this.grid[r][c] = null;
        }
      }

      canPlace(matrix, sr, sc, customGrid = null) {
        const g = customGrid || this.grid;
        const rows = matrix.length;
        const cols = matrix[0].length;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (!matrix[r][c]) continue;
            const tr = sr + r;
            const tc = sc + c;
            if (tr < 0 || tr >= BOARD_SIZE || tc < 0 || tc >= BOARD_SIZE) return false;
            if (g[tr][tc] !== null) return false;
          }
        }
        return true;
      }

      countFillRatio() {
        let filled = 0;
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (this.grid[r][c] !== null) filled++;
          }
        }
        return filled / (BOARD_SIZE * BOARD_SIZE);
      }

      computeSnugScore(matrix, sr, sc) {
        let touching = 0;
        let perimeter = 0;
        const rows = matrix.length;
        const cols = matrix[0].length;
        const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (!matrix[r][c]) continue;
            for (const [dr, dc] of dirs) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && matrix[nr][nc]) continue;
              perimeter++;
              const gr = sr + nr;
              const gc = sc + nc;
              if (gr < 0 || gr >= BOARD_SIZE || gc < 0 || gc >= BOARD_SIZE || this.grid[gr][gc] !== null) {
                touching++;
              }
            }
          }
        }
        return perimeter > 0 ? touching / perimeter : 0;
      }

      predictClears(matrix, sr, sc, customGrid = null) {
        const g = customGrid || this.grid;
        const rows = [];
        const cols = [];
        const pRows = matrix.length;
        const pCols = matrix[0].length;

        const hasCell = (r, c) => {
          if (g[r][c] !== null) return true;
          const lr = r - sr;
          const lc = c - sc;
          return lr >= 0 && lr < pRows && lc >= 0 && lc < pCols && matrix[lr][lc] === 1;
        };

        for (let r = 0; r < BOARD_SIZE; r++) {
          let full = true;
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (!hasCell(r, c)) { full = false; break; }
          }
          if (full) rows.push(r);
        }

        for (let c = 0; c < BOARD_SIZE; c++) {
          let full = true;
          for (let r = 0; r < BOARD_SIZE; r++) {
            if (!hasCell(r, c)) { full = false; break; }
          }
          if (full) cols.push(c);
        }

        return { rows, cols };
      }

      place(piece, sr, sc) {
        if (!this.canPlace(piece.matrix, sr, sc)) return null;
        const placedCells = [];
        for (let r = 0; r < piece.matrix.length; r++) {
          for (let c = 0; c < piece.matrix[0].length; c++) {
            if (piece.matrix[r][c]) {
              this.grid[sr + r][sc + c] = piece.colorId;
              placedCells.push({ r: sr + r, c: sc + c });
            }
          }
        }

        const clearedRows = [];
        const clearedCols = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (this.grid[r].every(cell => cell !== null)) clearedRows.push(r);
        }
        for (let c = 0; c < BOARD_SIZE; c++) {
          let full = true;
          for (let r = 0; r < BOARD_SIZE; r++) {
            if (this.grid[r][c] === null) { full = false; break; }
          }
          if (full) clearedCols.push(c);
        }

        const clearedCells = [];
        const seen = new Set();
        for (const r of clearedRows) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const key = r * 8 + c;
            if (!seen.has(key)) {
              seen.add(key);
              clearedCells.push({ r, c, colorId: this.grid[r][c] });
            }
          }
        }
        for (const c of clearedCols) {
          for (let r = 0; r < BOARD_SIZE; r++) {
            const key = r * 8 + c;
            if (!seen.has(key)) {
              seen.add(key);
              clearedCells.push({ r, c, colorId: this.grid[r][c] });
            }
          }
        }

        for (const r of clearedRows) this.grid[r].fill(null);
        for (const c of clearedCols) {
          for (let r = 0; r < BOARD_SIZE; r++) this.grid[r][c] = null;
        }

        const isAllClear = this.countFillRatio() === 0;
        return { placedCells, clearedRows, clearedCols, clearedCells, isAllClear };
      }

      canFitMatrixAnywhere(matrix, customGrid = null) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (this.canPlace(matrix, r, c, customGrid)) return true;
          }
        }
        return false;
      }

      hasAnyValidMove(tray) {
        for (const p of tray) {
          if (p && this.canFitMatrixAnywhere(p.matrix)) return true;
        }
        return false;
      }
    }

    // Dificuldade progressiva contínua (0.0 no início -> 1.0 no late-game)
    function getDifficultyFactor(score, movesPlayed) {
      const byScore = Math.min(1, score / 4200);
      const byMoves = Math.min(1, movesPlayed / 55);
      return Math.min(1, byScore * 0.65 + byMoves * 0.35);
    }

    function countMatrixBlocks(matrix) {
      let n = 0;
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) n++;
        }
      }
      return n;
    }

    // Seleciona exclusivamente do catálogo canônico SHAPES, escalando o peso de peças complexas com a dificuldade
    function pickWeightedShape(difficulty = 0) {
      const weights = SHAPES.map(s => {
        const blocks = countMatrixBlocks(s.m);
        const span = Math.max(s.m.length, s.m[0].length);
        let mult = 1;
        if (blocks === 1) {
          // Bloco único 1x1 é propositalmente muito raro e diminui ainda mais com o progresso
          return Math.max(0.15, s.w * (1 - difficulty * 0.7));
        } else if (blocks === 2) {
          // Peças 1x2 ficam mais raras conforme o jogo avança
          mult = 1 - difficulty * 0.5;
        } else if (blocks === 3) {
          mult = 1 - difficulty * 0.15;
        } else if (blocks === 4) {
          mult = 1 + difficulty * 0.2;
        } else {
          // Peças grandes (5+ blocos, L 3x3, 2x3, 3x3, barra 1x5) aumentam progressivamente
          mult = 0.75 + difficulty * 0.95 + (span >= 4 ? difficulty * 0.25 : 0);
        }
        return Math.max(0.8, s.w * mult);
      });

      let total = 0;
      for (const w of weights) total += w;
      let roll = Math.random() * total;
      for (let i = 0; i < SHAPES.length; i++) {
        roll -= weights[i];
        if (roll <= 0) return SHAPES[i].m;
      }
      return SHAPES[0].m;
    }

    function simulatePlaceAndClear(grid, matrix, sr, sc, colorId) {
      const next = grid.map(r => r.slice());
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) next[sr + r][sc + c] = colorId;
        }
      }
      const fullRows = [];
      const fullCols = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        if (next[r].every(v => v !== null)) fullRows.push(r);
      }
      for (let c = 0; c < BOARD_SIZE; c++) {
        let ok = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (next[r][c] === null) { ok = false; break; }
        }
        if (ok) fullCols.push(c);
      }
      for (const r of fullRows) next[r].fill(null);
      for (const c of fullCols) {
        for (let r = 0; r < BOARD_SIZE; r++) next[r][c] = null;
      }
      return { grid: next, cleared: fullRows.length + fullCols.length };
    }

    /**
     * Busca EXCLUSIVAMENTE dentro do catálogo original SHAPES uma peça que,
     * se encaixada na posição correta pelo jogador, gera limpeza de linha/coluna.
     * Nunca cria peças novas nem formatos artificiais.
     */
    function findCanonicalComboShape(board, grid, difficulty, usedIndices) {
      const candidates = [];

      for (let i = 0; i < SHAPES.length; i++) {
        if (usedIndices && usedIndices.has(i)) continue;
        const matrix = SHAPES[i].m;
        const blocks = countMatrixBlocks(matrix);

        // Bloco único 1x1 nunca é entregue como recompensa automática de combo (mantém raridade)
        if (blocks === 1) continue;

        let bestForShape = null;
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (!board.canPlace(matrix, r, c, grid)) continue;
            const pred = board.predictClears(matrix, r, c, grid);
            const total = pred.rows.length + pred.cols.length;
            if (total > 0) {
              if (!bestForShape || total > bestForShape.cleared) {
                bestForShape = { shapeIdx: i, matrix, sr: r, sc: c, cleared: total, blocks };
              }
            }
          }
        }

        if (bestForShape) {
          // Pontua favorecendo multi-linhas e peças de porte compatível com a dificuldade atual
          const complexityBonus = difficulty * bestForShape.blocks * 0.45;
          bestForShape.rank = bestForShape.cleared * 3 + complexityBonus + Math.random() * 1.4;
          candidates.push(bestForShape);
        }
      }

      if (candidates.length === 0) return null;
      candidates.sort((a, b) => b.rank - a.rank);
      const topSlice = candidates.slice(0, Math.min(4, candidates.length));
      const chosen = topSlice[Math.floor(Math.random() * topSlice.length)];
      const sim = simulatePlaceAndClear(grid, chosen.matrix, chosen.sr, chosen.sc, 0);
      return { ...chosen, nextGrid: sim.grid };
    }

    /**
     * Gerador da bandeja fiel ao catálogo original SHAPES com dificuldade progressiva:
     * - Sem combo: distribuição padrão progressiva (fica mais exigente com pontuação/turnos).
     * - Com combo ativo: recompensa o jogador incluindo peças DO PRÓPRIO CATÁLOGO SHAPES
     *   que podem gerar novos combos caso encaixadas corretamente, mantendo os demais slots
     *   na curva real de dificuldade.
     */
    function generateTray(board, activeCombo = 0, score = 0, movesPlayed = 0) {
      const difficulty = getDifficultyFactor(score, movesPlayed);
      const usedColors = new Set();
      const usedComboShapeIdx = new Set();

      const pickColor = () => {
        let id = Math.floor(Math.random() * BLOCK_PALETTE.length);
        for (let i = 0; i < 6 && usedColors.has(id); i++) {
          id = Math.floor(Math.random() * BLOCK_PALETTE.length);
        }
        usedColors.add(id);
        return id;
      };

      const slots = [null, null, null];

      // Quantas peças de combo (exclusivamente de SHAPES) entram como recompensa
      let comboPiecesTarget = 0;
      if (activeCombo === 1) {
        comboPiecesTarget = Math.random() < 0.55 ? 1 : 0;
      } else if (activeCombo === 2) {
        comboPiecesTarget = Math.random() < 0.25 ? 2 : (Math.random() < 0.8 ? 1 : 0);
      } else if (activeCombo >= 3) {
        comboPiecesTarget = Math.random() < 0.45 ? 2 : 1;
      }

      if (comboPiecesTarget > 0) {
        let simGrid = board.cloneGrid();
        const slotOrder = [0, 1, 2].sort(() => Math.random() - 0.5);

        for (let step = 0; step < comboPiecesTarget; step++) {
          const move = findCanonicalComboShape(board, simGrid, difficulty, usedComboShapeIdx);
          if (!move) break;
          usedComboShapeIdx.add(move.shapeIdx);
          slots[slotOrder[step]] = {
            matrix: move.matrix,
            colorId: pickColor(),
            spawnAnim: 0,
            isComboReward: true
          };
          simGrid = move.nextGrid;
        }
      }

      // Slots restantes seguem a curva real de dificuldade do catálogo SHAPES
      for (let i = 0; i < 3; i++) {
        if (slots[i]) continue;
        slots[i] = {
          matrix: pickWeightedShape(difficulty),
          colorId: pickColor(),
          spawnAnim: 0,
          isComboReward: false
        };
      }

      // Regra justa anti-softlock no início/meio (evita 1x1 se qualquer outra peça couber)
      if (!board.hasAnyValidMove(slots) && difficulty < 0.35) {
        const fittingMulti = SHAPES.filter(s => countMatrixBlocks(s.m) > 1 && board.canFitMatrixAnywhere(s.m));
        const fittingPool = fittingMulti.length > 0
          ? fittingMulti
          : SHAPES.filter(s => board.canFitMatrixAnywhere(s.m));
        if (fittingPool.length > 0) {
          const chosen = fittingPool[Math.floor(Math.random() * fittingPool.length)];
          slots[Math.floor(Math.random() * 3)].matrix = chosen.m;
        }
      }

      return slots;
    }

    /**
     * Em ~35% das runs, prepara o tabuleiro com um arranjo tático inicial e 3 peças
     * EXCLUSIVAMENTE do catálogo SHAPES que, se encaixadas na ordem certa, geram combos.
     * Nas demais ~65% das runs, inicia o tabuleiro 100% limpo com a distribuição padrão.
     */
    function seedComboOpeningRun(board) {
      board.reset();

      const presets = [
        // Preset 1: Duas linhas + 1 coluna em tensão — exige leitura da ordem (1x3, L 2x2 e 1x2 de SHAPES)
        () => {
          for (let c = 0; c < 8; c++) {
            if (c < 2 || c > 4) board.grid[5][c] = 1;
            if (c !== 1 && c !== 2) board.grid[6][c] = 2;
            if (c !== 5 && c !== 6) board.grid[7][c] = 3;
          }
          // Abre espaço vertical para o L encaixar em (5,1)-(6,1)-(6,2) apenas após limpar ou em ordem certa
          board.grid[5][1] = null;
          board.grid[5][2] = null;
          board.grid[5][3] = 1;
          board.grid[5][4] = null;
          // Recalibra linha 5 para faltar exatamente (5,2),(5,3),(5,4)
          board.grid[5][1] = 1;
          board.grid[5][2] = null;
          board.grid[5][3] = null;
          board.grid[5][4] = null;
          // Linha 7: falta (7,1) para o L e (7,5),(7,6) para o 1x2 -> após L em (6,1), falta só (7,5),(7,6)!
          board.grid[7][1] = null;

          return [
            { matrix: SHAPES[3].m, colorId: 0, spawnAnim: 0, isComboReward: true }, // 1x3
            { matrix: SHAPES[5].m, colorId: 4, spawnAnim: 0, isComboReward: true }, // L [[1,1],[1,0]]
            { matrix: SHAPES[1].m, colorId: 2, spawnAnim: 0, isComboReward: true }  // 1x2
          ];
        },
        // Preset 2: Cruz Central — 2x2 fecha linha + coluna, abrindo linha 6 e coluna 1 (todas de SHAPES)
        () => {
          for (let c = 0; c < 8; c++) {
            if (c !== 3 && c !== 4) {
              board.grid[3][c] = 1;
              board.grid[4][c] = 5;
            }
          }
          for (let r = 0; r < 8; r++) {
            if (r !== 3 && r !== 4 && r !== 6 && r !== 7) {
              board.grid[r][3] = 3;
              board.grid[r][4] = 4;
            }
          }
          for (let c = 0; c < 8; c++) {
            if (c !== 3 && c !== 4) board.grid[6][c] = 6;
          }
          for (let r = 3; r < 8; r++) {
            if (board.grid[r][1] === null) board.grid[r][1] = 2;
          }

          return [
            { matrix: SHAPES[9].m, colorId: 0, spawnAnim: 0, isComboReward: true }, // 2x2
            { matrix: SHAPES[1].m, colorId: 3, spawnAnim: 0, isComboReward: true }, // 1x2
            { matrix: SHAPES[4].m, colorId: 2, spawnAnim: 0, isComboReward: true }  // 3x1
          ];
        },
        // Preset 3: Colunas e Base — T + 3x1 + 1x2 de SHAPES
        () => {
          for (let r = 0; r < 8; r++) {
            if (r !== 2 && r !== 3 && r !== 4) board.grid[r][5] = 4;
          }
          for (let c = 0; c < 8; c++) {
            if (c !== 2 && c !== 3 && c !== 4) board.grid[6][c] = 1;
            if (c !== 3 && c !== 5 && c !== 6) board.grid[7][c] = 2;
          }
          board.grid[7][5] = 3;
          // Em (6,2..4) + (7,3) encaixa o T [[1,1,1],[0,1,0]] limpando linha 6; depois 3x1 em (2..4,5) limpa col 5; depois sobra (7,6) -> ajustamos (7,5) vazio para 1x2
          board.grid[7][5] = null;
          board.grid[7][6] = null;
          board.grid[7][3] = null;
          // Coluna 5 precisa de (7,5) depois da linha 7 ou antes -> limpa col 5 com 3x1 em (2..4,5) usando (7,5) preenchido pelo 1x2 em (7,5..6)!
          return [
            { matrix: SHAPES[12].m, colorId: 0, spawnAnim: 0, isComboReward: true }, // T [[1,1,1],[0,1,0]]
            { matrix: SHAPES[1].m, colorId: 3, spawnAnim: 0, isComboReward: true },  // 1x2
            { matrix: SHAPES[4].m, colorId: 5, spawnAnim: 0, isComboReward: true }   // 3x1
          ];
        }
      ];

      const chosenPreset = presets[Math.floor(Math.random() * presets.length)];
      return chosenPreset().sort(() => Math.random() - 0.5);
    }

    /* =========================================================================
       7. GAME ENGINE PRINCIPAL (KUBIKO — 60/120 FPS COM HOMEPAGE & COMBO FLOW)

      loadBestScore() {
        try {
          return parseInt(localStorage.getItem(STORAGE_BEST_KEY) || '0', 10) || 0;
        } catch (e) { return 0; }
      }

      saveBestScore() {
        try { localStorage.setItem(STORAGE_BEST_KEY, String(this.bestScore)); } catch (e) {}
      }

      hasValidSavedRun() {
        try {
          const raw = localStorage.getItem(STORAGE_RUN_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          return Boolean(data && Array.isArray(data.grid) && data.grid.length === BOARD_SIZE && !data.gameOver && (data.score > 0 || data.grid.some(r => r.some(v => v !== null))));
        } catch (e) {
          return false;
        }
      }

      saveRunState() {
        try {
          const payload = {
            grid: this.board.grid,
            tray: this.tray.map(p => p ? { matrix: p.matrix, colorId: p.colorId, isComboReward: Boolean(p.isComboReward) } : null),
            score: this.score,
            movesPlayed: this.movesPlayed,
            combo: this.combo,
            fuseMoves: this.fuseMoves,
            feverMoves: this.feverMoves,
            linesSinceShift: this.linesSinceShift,
            worldOrder: this.worldOrder,
            worldStep: this.worldStep,
            worldIdx: this.worldIdx,
            gameOver: this.gameOver
          };
          localStorage.setItem(STORAGE_RUN_KEY, JSON.stringify(payload));
        } catch (e) {}
      }

      loadRunState() {
        try {
          const raw = localStorage.getItem(STORAGE_RUN_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data || !Array.isArray(data.grid) || data.grid.length !== BOARD_SIZE || data.gameOver) return false;
          for (let r = 0; r < BOARD_SIZE; r++) {
            if (!Array.isArray(data.grid[r]) || data.grid[r].length !== BOARD_SIZE) return false;
            for (let c = 0; c < BOARD_SIZE; c++) {
              const v = data.grid[r][c];
              this.board.grid[r][c] = (typeof v === 'number' && v >= 0 && v < BLOCK_PALETTE.length) ? v : null;
            }
          }
          if (!Array.isArray(data.tray) || data.tray.length !== 3) return false;
          this.tray = data.tray.map(p => p && Array.isArray(p.matrix) ? {
            matrix: p.matrix,
            colorId: clamp(p.colorId | 0, 0, BLOCK_PALETTE.length - 1),
            spawnAnim: 1,
            isComboReward: Boolean(p.isComboReward)
          } : null);
          if (this.tray.every(p => p === null)) {
            this.tray = generateTray(this.board, this.combo, this.score, this.movesPlayed);
          }
          this.score = data.score | 0;
          this.movesPlayed = data.movesPlayed | 0;
          this.combo = data.combo | 0;
          this.fuseMoves = data.fuseMoves | 0;
          this.feverMoves = data.feverMoves | 0;
          this.linesSinceShift = data.linesSinceShift | 0;
          if (Array.isArray(data.worldOrder) && data.worldOrder.length === WORLDS.length) {
            this.worldOrder = data.worldOrder.map(i => clamp(i | 0, 0, WORLDS.length - 1));
            this.worldStep = clamp(data.worldStep | 0, 0, WORLDS.length - 1);
            this.worldIdx = this.worldOrder[this.worldStep];
          } else {
            this.worldOrder = buildShuffledWorldOrder(-1);
            this.worldIdx = clamp(data.worldIdx | 0, 0, WORLDS.length - 1);
            const foundPos = this.worldOrder.indexOf(this.worldIdx);
            this.worldStep = foundPos >= 0 ? foundPos : 0;
          }
          this.prevWorldIdx = this.worldIdx;
          this.gameOver = false;
          return true;
        } catch (e) {
          return false;
        }
      }

      syncHomeScreenUI(hasSaved) {
        this.elHomeBest.textContent = String(this.bestScore);
        this.btnContinuePlay.classList.toggle('show', Boolean(hasSaved));
      }

      openHomeScreen() {
        this.isHomeOpen = true;
        document.body.classList.remove('fever-mode');
        this.modal.classList.remove('open');
        this.syncHomeScreenUI(this.hasValidSavedRun());
        this.homeScreen.classList.remove('hidden');
      }

      enterGameFromHome(resumeSaved) {
        this.isHomeOpen = false;
        this.homeScreen.classList.add('hidden');
        this.resize();
        this.audio.playStartGame();

        if (resumeSaved && this.loadRunState()) {
          this.applyWorldCSS(this.worldIdx);
          this.updateHUD();
        } else {
          this.startNewGame(true);
        }
      }

      bindUI() {
        const syncAllSoundIcons = () => {
          document.querySelectorAll('.snd-on').forEach(el => {
            el.style.display = this.audio.enabled ? 'block' : 'none';
          });
          document.querySelectorAll('.snd-off').forEach(el => {
            el.style.display = this.audio.enabled ? 'none' : 'block';
          });
        };
        syncAllSoundIcons();

        document.getElementById('btnSound').addEventListener('click', () => {
          this.audio.toggle();
          syncAllSoundIcons();
        });

        document.getElementById('btnHomeSound').addEventListener('click', () => {
          this.audio.toggle();
          syncAllSoundIcons();
        });

        document.getElementById('btnStartPlay').addEventListener('click', () => {
          this.enterGameFromHome(false);
        });

        document.getElementById('btnContinuePlay').addEventListener('click', () => {
          this.enterGameFromHome(true);
        });

        document.getElementById('btnHome').addEventListener('click', () => {
          this.audio.playPickup();
          this.openHomeScreen();
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
          this.audio.unlock();
          this.audio.playPickup();
          this.startNewGame(true);
        });

        document.getElementById('btnPlayAgain').addEventListener('click', () => {
          this.audio.unlock();
          this.audio.playStartGame();
          this.startNewGame(true);
        });

        document.getElementById('mascotCanvas').parentElement.addEventListener('click', () => {
          this.audio.unlock();
          this.audio.playPickup();
          this.idleSeconds = 0;
          this.mascot.poke();
        });

        document.getElementById('homeMascotCanvas').parentElement.addEventListener('click', () => {
          this.audio.unlock();
          this.audio.playPickup();
          this.homeMascot.poke();
        });
      }

      applyWorldCSS(idx) {
        const w = WORLDS[idx];
        const root = document.documentElement.style;
        root.setProperty('--bg-page', w.pageBg);
        root.setProperty('--bg-surface', w.surface);
        root.setProperty('--bg-surface-2', w.surface2);
        root.setProperty('--border-ink', w.border);
        root.setProperty('--text-primary', w.text);
        root.setProperty('--text-muted', w.muted);
        root.setProperty('--accent', w.accent);
        root.setProperty('--accent-lip', w.accentLip);
        root.setProperty('--key-bg', w.keyBg);
        root.setProperty('--key-lip', w.keyLip);
        root.setProperty('--key-text', w.keyText);
        root.setProperty('--fuse-off', w.fuseOff);
        this.elWorldName.textContent = w.name;
        this.elWorldDot.style.background = w.accent;
        this.mascot.setWorldColor(w.oledColor);
        this.homeMascot.setWorldColor(w.oledColor);

        const metaTheme = document.getElementById('metaThemeColor');
        if (metaTheme) metaTheme.setAttribute('content', w.pageBg);
      }

      resize() {
        const rect = this.stageWrap.getBoundingClientRect();
        this.w = Math.max(280, Math.floor(rect.width));
        this.h = Math.max(360, Math.floor(rect.height));
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.canvas.width = Math.round(this.w * this.dpr);
        this.canvas.height = Math.round(this.h * this.dpr);

        const minTray = Math.max(106, Math.min(148, this.h * 0.24));
        const maxBoardH = this.h - minTray - 14;
        const maxBoardW = this.w - 4;
        this.boardPx = Math.floor(Math.min(maxBoardW, maxBoardH));
        this.padPx = Math.max(6, Math.round(this.boardPx * 0.025));
        this.gapPx = Math.max(3, Math.round(this.boardPx * 0.011));
        this.cellPx = (this.boardPx - this.padPx * 2 - this.gapPx * (BOARD_SIZE - 1)) / BOARD_SIZE;

        const usedH = this.boardPx + 14 + minTray;
        const topOffset = Math.max(0, Math.floor((this.h - usedH) * 0.42));
        this.boardX = Math.floor((this.w - this.boardPx) * 0.5);
        this.boardY = topOffset;
        this.trayY = this.boardY + this.boardPx + 14;
        this.trayH = Math.max(96, this.h - this.trayY - 2);

        const slotW = this.boardPx / 3;
        this.slotCenters = [
          this.boardX + slotW * 0.5,
          this.boardX + slotW * 1.5,
          this.boardX + slotW * 2.5
        ];

        this.sprites.rebuild(this.cellPx, this.dpr, this.boardPx, this.padPx, this.gapPx);
      }

      startNewGame(clearSaved) {
        this.board.reset();
        this.score = 0;
        this.movesPlayed = 0;
        this.beatRecordThisRun = false;
        this.combo = 0;
        this.fuseMoves = 0;
        this.feverMoves = 0;
        document.body.classList.remove('fever-mode');
        this.linesSinceShift = 0;
        this.worldOrder = buildShuffledWorldOrder(this.hasPlayedInSession ? this.worldIdx : -1);
        this.worldStep = 0;
        this.worldIdx = this.worldOrder[0];
        this.prevWorldIdx = this.worldIdx;
        this.waveActive = false;
        this.gameOver = false;
        this.gameOverAnim = 0;
        this.dominoQueue.length = 0;
        for (let r = 0; r < BOARD_SIZE; r++) this.cellPop[r].fill(0);

        this.particles.forEach(p => p.active = false);
        this.lasers.forEach(l => l.active = false);
        this.flashes.forEach(f => f.active = false);
        this.shockwaves.forEach(s => s.active = false);
        this.popups.forEach(p => p.active = false);
        this.banners.forEach(b => b.active = false);
        this.shatterPool.forEach(s => s.active = false);
        this.cellRingPool.forEach(r => r.active = false);
        this.cutterPool.forEach(c => c.active = false);
        this.confettiPool.forEach(c => c.active = false);
        this.bloomPool.forEach(b => b.active = false);
        this.rayPool.forEach(r => r.active = false);
        this.boardZoom = 0;
        this.screenFlash = 0;

        // Em ~35% das runs, inicia um arranjo tático de abertura usando apenas peças clássicas de SHAPES;
        // nas demais ~65% das runs, inicia o tabuleiro clássico 100% limpo com dificuldade progressiva.
        const useSeededComboBoard = Math.random() < 0.35;
        this.hasPlayedInSession = true;

        if (useSeededComboBoard) {
          this.tray = seedComboOpeningRun(this.board);
          for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
              if (this.board.grid[r][c] !== null) {
                this.cellPop[r][c] = 0.75;
              }
            }
          }
        } else {
          this.tray = generateTray(this.board, 0, 0, 0);
        }

        this.modal.classList.remove('open');
        this.applyWorldCSS(this.worldIdx);
        this.idleSeconds = 0;
        this.failedDrops = 0;
        this.mascot.setState('hyped', 1.15);
        this.updateHUD();
        if (clearSaved) this.saveRunState();
      }

      getScoreMultiplier() {
        if (this.feverMoves > 0) return 10;
        if (this.combo >= 4) return 5;
        if (this.combo === 3) return 3;
        if (this.combo === 2) return 2;
        return 1;
      }

      updateHUD(bumpScore = false) {
        this.elScore.textContent = String(this.score);
        this.elBest.textContent = String(this.bestScore);
        this.elHomeBest.textContent = String(this.bestScore);
        if (bumpScore) {
          this.elScore.classList.add('bump');
          setTimeout(() => this.elScore.classList.remove('bump'), 150);
        }

        const isFever = this.feverMoves > 0;
        document.body.classList.toggle('fever-mode', isFever && !this.isHomeOpen && !this.gameOver);

        if (isFever) {
          this.elWorldName.textContent = `FEVER x10 • ${this.feverMoves}`;
          this.elComboTag.textContent = 'x10';
          for (let i = 0; i < 3; i++) {
            const el = this.fuseEls[i];
            el.classList.remove('active', 'hot', 'warn');
            el.classList.add('fever');
          }
        } else {
          this.elWorldName.textContent = WORLDS[this.worldIdx].name;
          const mult = this.getScoreMultiplier();
          this.elComboTag.textContent = `x${mult}`;
          for (let i = 0; i < 3; i++) {
            const el = this.fuseEls[i];
            el.classList.remove('active', 'hot', 'warn', 'fever');
            if (i < this.fuseMoves) {
              if (this.fuseMoves === 1 && this.combo >= 2) el.classList.add('warn');
              else if (this.combo >= 3) el.classList.add('hot');
              else el.classList.add('active');
            }
          }
        }
      }

      /* -----------------------------------------------------------------------
         INPUT UNIFICADO (MOUSE + TOUCH COM OFFSET VERTICAL E BLOQUEIO iOS)
         ----------------------------------------------------------------------- */
      bindPointerEvents() {
        this.canvas.addEventListener('touchmove', (e) => {
          if (this.drag.active) e.preventDefault();
        }, { passive: false });

        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        window.addEventListener('pointermove', (e) => this.onPointerMove(e));
        window.addEventListener('pointerup', (e) => this.onPointerUp(e));
        window.addEventListener('pointercancel', (e) => this.onPointerUp(e));
      }

      getCanvasCoords(e) {
        const rect = this.canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      onPointerDown(e) {
        if (this.isHomeOpen || this.gameOver || this.drag.active) return;
        this.audio.unlock();
        const pt = this.getCanvasCoords(e);
        if (pt.y < this.trayY - 12) return;

        let bestIdx = -1;
        let bestDist = Infinity;
        for (let i = 0; i < 3; i++) {
          if (!this.tray[i]) continue;
          const dx = Math.abs(pt.x - this.slotCenters[i]);
          if (dx < bestDist && dx < this.boardPx * 0.24) {
            bestDist = dx;
            bestIdx = i;
          }
        }
        if (bestIdx === -1) return;

        this.drag.active = true;
        this.drag.pointerId = e.pointerId;
        this.drag.trayIndex = bestIdx;
        this.drag.piece = this.tray[bestIdx];
        this.drag.isTouch = e.pointerType === 'touch' || e.pointerType === 'pen';
        this.drag.x = pt.x;
        this.drag.y = pt.y;
        this.drag.lastHoverKey = -1;

        this.audio.playPickup();
        this.mascot.setState('tracking', 0);
        this.updateDragSnap();
      }

      onPointerMove(e) {
        if (!this.drag.active || e.pointerId !== this.drag.pointerId) return;
        const pt = this.getCanvasCoords(e);
        this.drag.x = pt.x;
        this.drag.y = pt.y;

        const nx = (pt.x / this.w) * 2 - 1;
        const ny = (pt.y / this.h) * 2 - 1;
        this.mascot.setLook(nx, ny);

        this.updateDragSnap();
      }

      updateDragSnap() {
        const piece = this.drag.piece;
        if (!piece) return;

        const liftY = this.drag.isTouch ? Math.max(72, this.cellPx * 1.95) : Math.max(26, this.cellPx * 0.65);
        const cx = this.drag.x;
        const cy = this.drag.y - liftY;

        const step = this.cellPx + this.gapPx;
        const rows = piece.matrix.length;
        const cols = piece.matrix[0].length;
        const pw = cols * this.cellPx + (cols - 1) * this.gapPx;
        const ph = rows * this.cellPx + (rows - 1) * this.gapPx;

        const originX = cx - pw * 0.5;
        const originY = cy - ph * 0.5;

        const col = Math.round((originX - (this.boardX + this.padPx)) / step);
        const row = Math.round((originY - (this.boardY + this.padPx)) / step);

        if (this.board.canPlace(piece.matrix, row, col)) {
          this.drag.snapR = row;
          this.drag.snapC = col;
          this.drag.canDrop = true;
          const pred = this.board.predictClears(piece.matrix, row, col);
          this.drag.predictedRows = pred.rows;
          this.drag.predictedCols = pred.cols;

          const hoverKey = row * 16 + col;
          if (hoverKey !== this.drag.lastHoverKey) {
            this.drag.lastHoverKey = hoverKey;
            this.audio.playHoverTick();
          }

          const predCount = pred.rows.length + pred.cols.length;
          if (predCount >= 2) {
            this.mascot.setState('aimMulti', 0);
          } else if (predCount === 1) {
            this.mascot.setState('aimClear', 0);
          } else {
            this.mascot.setState('tracking', 0);
          }
        } else {
          this.drag.snapR = -1;
          this.drag.snapC = -1;
          this.drag.canDrop = false;
          this.drag.predictedRows = [];
          this.drag.predictedCols = [];
          this.drag.lastHoverKey = -1;
          this.mascot.setState('curious', 0);
        }
      }

      onPointerUp(e) {
        if (!this.drag.active || e.pointerId !== this.drag.pointerId) return;

        const { canDrop, snapR, snapC, piece, trayIndex } = this.drag;
        this.drag.active = false;
        this.drag.pointerId = null;
        this.drag.piece = null;
        this.drag.predictedRows = [];
        this.drag.predictedCols = [];
        this.mascot.setLook(0, 0);

        if (canDrop && piece) {
          this.failedDrops = 0;
          this.idleSeconds = 0;
          this.onPiecePlaced(piece, trayIndex, snapR, snapC);
        } else {
          this.failedDrops++;
          if (this.failedDrops >= 2) {
            this.mascot.setState('dizzy', 0.9);
            this.failedDrops = 0;
          } else {
            this.mascot.setState(this.getMoodFallback(), 0);
          }
        }
      }

      getMoodFallback() {
        if (this.gameOver) return 'gameOver';
        if (this.feverMoves > 0) return 'fever';
        const fill = this.board.countFillRatio();
        if (fill >= 0.72) return 'danger';
        if (this.fuseMoves === 1 && this.combo >= 2) return 'fuseWarning';
        if (this.idleSeconds >= 9) return 'sleepy';
        if (fill >= 0.50) return 'focused';
        return 'idle';
      }

      /* -----------------------------------------------------------------------
         LÓGICA DE ENCAIXE, PONTUAÇÃO, QUALIDADE, COMBO E RECOMPENSA DE PEÇAS
         ----------------------------------------------------------------------- */
      onPiecePlaced(piece, trayIndex, sr, sc) {
        const preFill = this.board.countFillRatio();
        const snug = this.board.computeSnugScore(piece.matrix, sr, sc);
        const res = this.board.place(piece, sr, sc);
        if (!res) return;

        this.tray[trayIndex] = null;
        this.movesPlayed++;

        for (const cell of res.placedCells) {
          this.cellPop[cell.r][cell.c] = 1;
        }

        const pRows = piece.matrix.length;
        const pCols = piece.matrix[0].length;
        const centerR = sr + (pRows - 1) * 0.5;
        const centerC = sc + (pCols - 1) * 0.5;
        const centerPt = this.cellCenter(centerR, centerC);

        const totalLines = res.clearedRows.length + res.clearedCols.length;
        let rawPoints = res.placedCells.length * 10;
        let feverJustStarted = false;

        this.audio.playPlace(res.placedCells.length);

        let qualityBadge = '';
        let qualityColor = WORLDS[this.worldIdx].accent;
        let qualityTier = '';

        if (totalLines > 0) {
          this.combo = this.fuseMoves > 0 ? this.combo + 1 : 1;
          this.fuseMoves = 3;
          this.linesSinceShift += totalLines;

          // Gatilho do MODO FEVER x10: 5 combos consecutivos (ou 4+ com limpeza múltipla)
          if (this.feverMoves === 0 && (this.combo >= 5 || (this.combo >= 4 && totalLines >= 2))) {
            this.feverMoves = 6;
            feverJustStarted = true;
          } else if (this.feverMoves > 0) {
            // Quebrar linha durante o Fever mantém o ritmo vivo (+1 jogada até o teto de 8)
            this.feverMoves = Math.min(8, this.feverMoves);
          }

          const lineBase = totalLines * totalLines * 100;
          const comboBonus = this.combo > 1 ? this.combo * 60 : 0;
          const allClearBonus = res.isAllClear ? 1000 : 0;
          rawPoints += lineBase + comboBonus + allClearBonus;

          if (res.isAllClear) {
            qualityBadge = 'TABULEIRO ZERADO!';
            qualityColor = '#F59E0B';
            qualityTier = 'epic';
          } else if (totalLines >= 4 || this.combo >= 6) {
            qualityBadge = 'IMPECÁVEL!';
            qualityColor = '#F59E0B';
            qualityTier = 'epic';
          } else if (totalLines === 3 || this.combo >= 4) {
            qualityBadge = 'GENIAL!';
            qualityColor = '#EC4899';
            qualityTier = 'epic';
          } else if (totalLines === 2 && this.combo >= 2) {
            qualityBadge = 'BRILHANTE!';
            qualityColor = '#0EA5E9';
            qualityTier = 'great';
          } else if (totalLines === 2) {
            qualityBadge = 'EXCELENTE!';
            qualityColor = '#10B981';
            qualityTier = 'great';
          } else if (this.combo >= 2) {
            qualityBadge = 'ÓTIMA JOGADA!';
            qualityColor = '#FF551A';
            qualityTier = 'good';
          } else {
            qualityBadge = 'BOA JOGADA!';
            qualityColor = '#10B981';
            qualityTier = 'good';
          }

          this.audio.playStreakSignature(this.combo, totalLines);
          this.audio.playQualityStimulus(qualityTier);

          if (totalLines >= 2 || this.combo >= 3) {
            this.hitstop = 0.032;
            this.shakeTime = 0.24;
            this.shakeMag = Math.min(11, 4 + totalLines * 1.8 + this.combo * 0.9);
          } else {
            this.shakeTime = 0.12;
            this.shakeMag = 2.6;
          }

          const isFeverNow = this.feverMoves > 0;
          const accent = isFeverNow
            ? FEVER_RAINBOW_COLORS[Math.floor(Math.random() * FEVER_RAINBOW_COLORS.length)]
            : BLOCK_PALETTE[piece.colorId].glow;

          this.boardRimFlash = Math.min(1, 0.85 + totalLines * 0.18 + this.combo * 0.08);
          this.boardRimColor = isFeverNow ? '#FFFFFF' : ((totalLines >= 2 || this.combo >= 3) ? '#FDE047' : accent);
          this.boardZoom = (totalLines >= 2 || isFeverNow) ? 0.036 : 0.022;
          this.screenFlash = Math.min(0.32, 0.12 + totalLines * 0.06 + (isFeverNow ? 0.1 : 0));
          this.screenFlashColor = isFeverNow ? FEVER_RAINBOW_COLORS[Math.floor(Math.random() * FEVER_RAINBOW_COLORS.length)] : accent;

          // Explosão de brilho radial + raios prismáticos no ponto da jogada
          this.spawnBloom(centerPt.x, centerPt.y, piece.colorId, 130 + totalLines * 36 + this.combo * 14, isFeverNow);
          this.spawnRayBurst(centerPt.x, centerPt.y, accent, 115 + totalLines * 28, 6 + Math.min(6, totalLines * 2 + this.combo));
          this.spawnColorExplosion(centerPt.x, centerPt.y, piece.colorId, 14 + totalLines * 8, isFeverNow);

          for (const r of res.clearedRows) {
            const rowCol = isFeverNow ? FEVER_RAINBOW_COLORS[r % FEVER_RAINBOW_COLORS.length] : accent;
            this.spawnLaser(true, r, rowCol);
            this.spawnFlash(true, r, rowCol);
            this.spawnCutter(true, r, rowCol);
            this.spawnLineStreaks(true, r, rowCol, 18 + totalLines * 5);
            const midPt = this.cellCenter(r, 3.5);
            this.spawnBloom(midPt.x, midPt.y, (piece.colorId + r) % BLOCK_PALETTE.length, 105 + totalLines * 18, isFeverNow);
          }
          for (const c of res.clearedCols) {
            const colCol = isFeverNow ? FEVER_RAINBOW_COLORS[(c + 3) % FEVER_RAINBOW_COLORS.length] : accent;
            this.spawnLaser(false, c, colCol);
            this.spawnFlash(false, c, colCol);
            this.spawnCutter(false, c, colCol);
            this.spawnLineStreaks(false, c, colCol, 18 + totalLines * 5);
            const midPt = this.cellCenter(3.5, c);
            this.spawnBloom(midPt.x, midPt.y, (piece.colorId + c + 3) % BLOCK_PALETTE.length, 105 + totalLines * 18, isFeverNow);
          }

          // Confetes coloridos sempre que quebrar linha (mais intenso em multi-linhas / combos / FEVER)
          this.spawnConfetti(isFeverNow ? 48 : (12 + totalLines * 10 + this.combo * 4), isFeverNow || totalLines >= 2);

          if (feverJustStarted) {
            this.audio.playFeverStart();
            this.spawnBanner('MODO FEVER x10!', '#FDE047');
            this.spawnConfetti(48, true);
            this.spawnShockwave(centerPt.x, centerPt.y, '#FF2D55', this.boardPx * 0.95, 0);
            this.spawnShockwave(centerPt.x, centerPt.y, '#00C7BE', this.boardPx * 1.1, 0.08);
          } else if (isFeverNow) {
            this.audio.playFeverClear();
          }

          // Explosão extra em cada ponto de cruzamento linha × coluna
          for (const r of res.clearedRows) {
            for (const c of res.clearedCols) {
              const xPt = this.cellCenter(r, c);
              this.spawnShockwave(xPt.x, xPt.y, '#FFFFFF', 135, 0);
              this.spawnShockwave(xPt.x, xPt.y, accent, 205, 0.065);
              this.spawnBloom(xPt.x, xPt.y, piece.colorId, 155, isFeverNow);
              this.spawnRayBurst(xPt.x, xPt.y, '#FFFFFF', 150, 10);
              this.spawnColorExplosion(xPt.x, xPt.y, piece.colorId, 18, true);
            }
          }

          res.clearedCells.sort((a, b) => {
            const da = Math.abs(a.r - centerR) + Math.abs(a.c - centerC);
            const db = Math.abs(b.r - centerR) + Math.abs(b.c - centerC);
            return da - db;
          });

          res.clearedCells.forEach((cell, idx) => {
            this.dominoQueue.push({
              r: cell.r,
              c: cell.c,
              colorId: cell.colorId,
              delay: idx * 0.016,
              total: 0.14,
              worldIdx: this.worldIdx,
              pipped: false,
              idx
            });
          });

          if (totalLines >= 2 || this.combo >= 2) {
            this.spawnShockwave(centerPt.x, centerPt.y, accent, 150 + this.combo * 24, 0);
            this.spawnShockwave(centerPt.x, centerPt.y, '#FFFFFF', 110 + this.combo * 16, 0.065);
          } else {
            this.spawnShockwave(centerPt.x, centerPt.y, accent, 115, 0);
          }
          if (this.combo >= 2) {
            const label = this.combo >= 5 ? `LENDÁRIO x${this.combo}!`
              : (this.combo === 4 ? `IMPARÁVEL x4!`
              : (this.combo === 3 ? `INCRÍVEL x3!` : `COMBO x2!`));
            this.spawnBanner(label, this.combo >= 4 ? '#FDE047' : accent);
          }

          if (this.feverMoves > 0) this.mascot.setState('fever', 1.8);
          else if (res.isAllClear) this.mascot.setState('allClear', 1.7);
          else if (this.combo >= 5) this.mascot.setState('fire', 1.7);
          else if (this.combo === 4) this.mascot.setState('combo4Plus', 1.55);
          else if (totalLines >= 3) this.mascot.setState('love', 1.45);
          else if (this.combo === 3) this.mascot.setState('combo3', 1.35);
          else if (this.combo === 2) this.mascot.setState('combo2', 1.2);
          else if (totalLines === 2) this.mascot.setState('proud', 1.1);
          else this.mascot.setState('hyped', 0.85);

          const shouldShift = totalLines >= 2 || (this.combo >= 2 && this.combo % 2 === 0) || this.linesSinceShift >= 4;
          if (shouldShift) {
            this.linesSinceShift = 0;
            this.triggerWorldShift(centerR, centerC);
          }

        } else {
          if (this.feverMoves > 0) {
            this.feverMoves = Math.max(0, this.feverMoves - 1);
          }
          if (this.fuseMoves > 0) {
            this.fuseMoves--;
            if (this.fuseMoves === 1 && this.combo >= 2) {
              this.audio.playFuseWarn();
              this.mascot.setState('fuseWarning', 0.9);
            } else if (this.fuseMoves === 0) {
              if (this.combo >= 3) {
                this.audio.playStreakBroken();
                this.mascot.setState('streakBroken', 0.95);
              } else {
                this.mascot.setState('place', 0.45);
              }
              this.combo = 0;
            } else {
              this.mascot.setState('place', 0.45);
            }
          } else {
            this.mascot.setState('place', 0.45);
          }

          if (res.placedCells.length >= 4 && (snug >= 0.55 || preFill >= 0.70)) {
            qualityBadge = 'ENCAIXE LIMPO!';
            qualityColor = '#0EA5E9';
            this.audio.playQualityStimulus('clean');
            this.mascot.setState('wink', 0.9);
          } else if (res.placedCells.length >= 5) {
            this.mascot.setState('proud', 0.75);
          }
        }

        const activeMult = this.getScoreMultiplier();
        const pointsEarned = Math.round(rawPoints * activeMult);
        if (this.feverMoves > 0) {
          qualityBadge = qualityBadge ? `FEVER x10 • ${qualityBadge}` : 'FEVER x10!';
          qualityColor = '#FF2D55';
        } else if (activeMult > 1 && totalLines > 0) {
          qualityBadge = `${qualityBadge} x${activeMult}`;
        }

        this.score += pointsEarned;
        if (this.score > this.bestScore) {
          this.bestScore = this.score;
          this.saveBestScore();
          if (!this.beatRecordThisRun && this.score >= 200) {
            this.beatRecordThisRun = true;
            this.audio.playRecordFanfare();
            this.mascot.setState('newRecord', 1.5);
            this.spawnBanner('NOVO RECORDE!', '#FDE047');
          }
        }

        this.spawnScorePopup(
          centerPt.x,
          centerPt.y - 8,
          `+${pointsEarned}`,
          qualityBadge,
          qualityColor,
          totalLines >= 2 || this.combo >= 2 || res.isAllClear
        );

        // Reabastece bandeja com peças de recompensa encadeadas se houver combo ativo!
        if (this.tray.every(p => p === null)) {
          this.tray = generateTray(this.board, this.combo, this.score, this.movesPlayed);
          if (this.combo >= 1) {
            // Estímulo visual sutil na bandeja indicando peças de combo recebidas
            const trayCenterY = this.trayY + this.trayH * 0.5;
            for (let i = 0; i < 3; i++) {
              if (this.tray[i] && this.tray[i].isComboReward) {
                this.spawnBurst(this.slotCenters[i], trayCenterY, this.tray[i].colorId, 5);
              }
            }
          }
        }

        this.updateHUD(true);

        if (!this.board.hasAnyValidMove(this.tray)) {
          this.triggerGameOver();
        }

        this.saveRunState();
      }

      triggerWorldShift(originR, originC) {
        this.prevWorldIdx = this.worldIdx;
        this.worldStep++;
        if (this.worldStep >= this.worldOrder.length) {
          this.worldOrder = buildShuffledWorldOrder(this.prevWorldIdx);
          this.worldStep = 0;
        }
        this.worldIdx = this.worldOrder[this.worldStep];
        this.waveActive = true;
        this.waveTime = 0;
        this.waveOriginR = originR;
        this.waveOriginC = originC;

        this.applyWorldCSS(this.worldIdx);
        this.audio.playWorldShift();
        this.mascot.setState('worldShift', 1.15);

        const pt = this.cellCenter(originR, originC);
        this.spawnShockwave(pt.x, pt.y, WORLDS[this.worldIdx].accent, this.boardPx * 0.95);
        this.spawnBanner(WORLDS[this.worldIdx].name, WORLDS[this.worldIdx].accent);
      }

      triggerGameOver() {
        this.gameOver = true;
        this.feverMoves = 0;
        document.body.classList.remove('fever-mode');
        this.gameOverAnim = 0;
        this.audio.playGameOver();
        this.mascot.setState('gameOver', 0);

        setTimeout(() => {
          if (!this.gameOver) return;
          this.elGoScore.textContent = String(this.score);
          this.elGoBest.textContent = String(this.bestScore);
          this.elGoNewRec.classList.toggle('show', this.beatRecordThisRun);
          this.modal.classList.add('open');
        }, 720);
      }

      /* -----------------------------------------------------------------------
         SPAWNERS EM OBJECT POOL
         ----------------------------------------------------------------------- */
      cellCenter(r, c) {
        const step = this.cellPx + this.gapPx;
        return {
          x: this.boardX + this.padPx + c * step + this.cellPx * 0.5,
          y: this.boardY + this.padPx + r * step + this.cellPx * 0.5
        };
      }

      spawnBurst(x, y, colorId, count = 9) {
        const pal = BLOCK_PALETTE[colorId] || BLOCK_PALETTE[0];
        const altPal = BLOCK_PALETTE[(colorId + 3) % BLOCK_PALETTE.length];
        let spawned = 0;
        for (let i = 0; i < this.particles.length && spawned < count; i++) {
          const p = this.particles[i];
          if (p.active) continue;
          const ang = Math.random() * Math.PI * 2;
          const spd = 95 + Math.random() * 235;
          p.active = true;
          p.x = x;
          p.y = y;
          p.vx = Math.cos(ang) * spd;
          p.vy = Math.sin(ang) * spd - 55;
          p.size = 5 + Math.random() * 6;
          p.life = 0;
          p.maxLife = 0.4 + Math.random() * 0.36;
          const roll = Math.random();
          p.color = roll < 0.25 ? '#FFFFFF' : (roll < 0.65 ? pal.light : (roll < 0.85 ? pal.base : altPal.light));
          p.kind = roll < 0.52 ? 1 : 0;
          p.rot = Math.random() * Math.PI;
          p.vrot = (Math.random() - 0.5) * 12;
          p.starIdx = roll < 0.22 ? 0 : (roll < 0.42 ? 1 : (colorId + 2) % this.sprites.starSprites.length);
          p.gravity = 400;
          spawned++;
        }
      }

      spawnColorExplosion(x, y, baseColorId, count = 16, rainbow = false) {
        let spawned = 0;
        for (let i = 0; i < this.particles.length && spawned < count; i++) {
          const p = this.particles[i];
          if (p.active) continue;
          const ang = (Math.PI * 2 * spawned) / Math.max(1, count) + (Math.random() - 0.5) * 0.35;
          const spd = 130 + Math.random() * 270;
          const cIdx = rainbow
            ? Math.floor(Math.random() * BLOCK_PALETTE.length)
            : (baseColorId + Math.floor(Math.random() * 4) * 3) % BLOCK_PALETTE.length;
          const pal = BLOCK_PALETTE[cIdx];
          p.active = true;
          p.x = x;
          p.y = y;
          p.vx = Math.cos(ang) * spd;
          p.vy = Math.sin(ang) * spd - 40;
          p.size = 6 + Math.random() * 7;
          p.life = 0;
          p.maxLife = 0.42 + Math.random() * 0.38;
          p.color = Math.random() < 0.2 ? '#FFFFFF' : pal.light;
          p.kind = Math.random() < 0.65 ? 1 : 2;
          p.rot = p.kind === 2 ? Math.atan2(p.vy, p.vx) : Math.random() * Math.PI;
          p.vrot = p.kind === 2 ? 0 : (Math.random() - 0.5) * 12;
          p.starIdx = (cIdx + 2) % this.sprites.starSprites.length;
          p.gravity = p.kind === 2 ? 0 : 320;
          spawned++;
        }
      }

      spawnBloom(x, y, colorId, maxR = 130, isFever = false) {
        for (const b of this.bloomPool) {
          if (!b.active) {
            b.active = true;
            b.x = x;
            b.y = y;
            b.maxR = maxR;
            b.colorId = colorId % BLOCK_PALETTE.length;
            b.isFever = isFever;
            b.life = 0;
            b.maxLife = 0.42;
            return;
          }
        }
      }

      spawnRayBurst(x, y, color, maxR = 130, rays = 8) {
        for (const r of this.rayPool) {
          if (!r.active) {
            r.active = true;
            r.x = x;
            r.y = y;
            r.maxR = maxR;
            r.rays = rays;
            r.rot = Math.random() * Math.PI;
            r.vrot = (Math.random() < 0.5 ? 1 : -1) * (1.8 + Math.random() * 1.4);
            r.color = color;
            r.color2 = '#FDE047';
            r.life = 0;
            r.maxLife = 0.36;
            return;
          }
        }
      }

      // Faíscas direcionais (streaks) que disparam perpendicularmente à linha/coluna quebrada
      spawnLineStreaks(isRow, index, color, count = 14) {
        const step = this.cellPx + this.gapPx;
        let spawned = 0;
        for (let i = 0; i < this.particles.length && spawned < count; i++) {
          const p = this.particles[i];
          if (p.active) continue;
          const along = Math.random() * (this.boardPx - this.padPx * 2);
          const dir = Math.random() < 0.5 ? -1 : 1;
          const spd = 160 + Math.random() * 240;
          p.active = true;
          if (isRow) {
            p.x = this.boardX + this.padPx + along;
            p.y = this.boardY + this.padPx + index * step + this.cellPx * 0.5;
            p.vx = (Math.random() - 0.5) * 70;
            p.vy = dir * spd;
          } else {
            p.x = this.boardX + this.padPx + index * step + this.cellPx * 0.5;
            p.y = this.boardY + this.padPx + along;
            p.vx = dir * spd;
            p.vy = (Math.random() - 0.5) * 70;
          }
          p.size = 10 + Math.random() * 10;
          p.life = 0;
          p.maxLife = 0.24 + Math.random() * 0.18;
          p.color = Math.random() < 0.35 ? '#FFFFFF' : color;
          p.kind = 2; // Streak luminoso
          p.rot = Math.atan2(p.vy, p.vx);
          p.vrot = 0;
          p.gravity = 0;
          spawned++;
        }
      }

      // Micro-faísca de antecipação ao longo da linha/coluna que PODE ser quebrada
      spawnPreviewSpark(isRow, index, color) {
        const step = this.cellPx + this.gapPx;
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          if (p.active) continue;
          const along = Math.random() * (this.boardPx - this.padPx * 2);
          p.active = true;
          if (isRow) {
            p.x = this.boardX + this.padPx + along;
            p.y = this.boardY + this.padPx + index * step + (Math.random() * this.cellPx);
            p.vx = (Math.random() - 0.5) * 28;
            p.vy = -28 - Math.random() * 34;
          } else {
            p.x = this.boardX + this.padPx + index * step + (Math.random() * this.cellPx);
            p.y = this.boardY + this.padPx + along;
            p.vx = (Math.random() - 0.5) * 38;
            p.vy = -22 - Math.random() * 28;
          }
          p.size = 3.2 + Math.random() * 2.5;
          p.life = 0;
          p.maxLife = 0.26 + Math.random() * 0.16;
          p.color = Math.random() < 0.5 ? '#FFFFFF' : color;
          p.kind = 1;
          p.rot = Math.random() * Math.PI;
          p.vrot = 6;
          p.starIdx = Math.random() < 0.5 ? 0 : 1;
          p.gravity = 0;
          return;
        }
      }

      spawnShatter(x, y, colorId, isFever = false) {
        const pal = BLOCK_PALETTE[colorId] || BLOCK_PALETTE[0];
        let spawned = 0;
        for (let i = 0; i < this.shatterPool.length && spawned < 2; i++) {
          const sh = this.shatterPool[i];
          if (sh.active) continue;
          const ang = Math.random() * Math.PI * 2;
          const spd = 95 + Math.random() * 195;
          sh.active = true;
          sh.x = x + (Math.random() - 0.5) * this.cellPx * 0.4;
          sh.y = y + (Math.random() - 0.5) * this.cellPx * 0.4;
          sh.vx = Math.cos(ang) * spd;
          sh.vy = Math.sin(ang) * spd - 90;
          sh.w = this.cellPx * (0.28 + Math.random() * 0.18);
          sh.h = this.cellPx * (0.22 + Math.random() * 0.18);
          sh.rot = Math.random() * Math.PI;
          sh.vrot = (Math.random() - 0.5) * 16;
          sh.color = isFever ? FEVER_RAINBOW_COLORS[Math.floor(Math.random() * FEVER_RAINBOW_COLORS.length)] : pal.base;
          sh.light = isFever ? '#FFFFFF' : pal.light;
          sh.life = 0;
          sh.maxLife = 0.42 + Math.random() * 0.24;
          spawned++;
        }
      }

      spawnCellRing(x, y, color) {
        for (const r of this.cellRingPool) {
          if (!r.active) {
            r.active = true;
            r.x = x;
            r.y = y;
            r.maxR = this.cellPx * 0.92;
            r.color = color;
            r.life = 0;
            r.maxLife = 0.28;
            return;
          }
        }
      }

      spawnCutter(isRow, index, color) {
        for (const c of this.cutterPool) {
          if (!c.active) {
            c.active = true;
            c.isRow = isRow;
            c.index = index;
            c.color = color;
            c.life = 0;
            c.maxLife = 0.22;
            c.dir = Math.random() < 0.5 ? 1 : -1;
            return;
          }
        }
      }

      spawnConfetti(count = 20, rainbow = false) {
        let spawned = 0;
        for (let i = 0; i < this.confettiPool.length && spawned < count; i++) {
          const cf = this.confettiPool[i];
          if (cf.active) continue;
          cf.active = true;
          cf.x = this.boardX + Math.random() * this.boardPx;
          cf.y = this.boardY - 12 - Math.random() * 35;
          cf.vx = (Math.random() - 0.5) * 130;
          cf.vy = 95 + Math.random() * 175;
          cf.size = 6 + Math.random() * 5;
          cf.color = rainbow
            ? FEVER_RAINBOW_COLORS[Math.floor(Math.random() * FEVER_RAINBOW_COLORS.length)]
            : BLOCK_PALETTE[Math.floor(Math.random() * BLOCK_PALETTE.length)].light;
          cf.phase = Math.random() * Math.PI * 2;
          cf.vphase = 8 + Math.random() * 10;
          cf.rot = Math.random() * Math.PI;
          cf.vrot = (Math.random() - 0.5) * 7;
          cf.life = 0;
          cf.maxLife = 0.95 + Math.random() * 0.55;
          spawned++;
        }
      }

      spawnLaser(isRow, index, color) {
        for (const l of this.lasers) {
          if (!l.active) {
            l.active = true;
            l.isRow = isRow;
            l.index = index;
            l.color = color;
            l.life = 0;
            l.maxLife = 0.34;
            return;
          }
        }
      }

      spawnFlash(isRow, index, color) {
        for (const f of this.flashes) {
          if (!f.active) {
            f.active = true;
            f.isRow = isRow;
            f.index = index;
            f.color = color;
            f.life = 0;
            f.maxLife = 0.28;
            return;
          }
        }
      }

      spawnShockwave(x, y, color, maxR, delay = 0) {
        for (const s of this.shockwaves) {
          if (!s.active) {
            s.active = true;
            s.x = x;
            s.y = y;
            s.maxR = maxR;
            s.color = color;
            s.life = 0;
            s.maxLife = 0.46;
            s.delay = delay;
            return;
          }
        }
      }

      spawnScorePopup(x, y, text, badge, badgeColor, isGold) {
        for (const p of this.popups) {
          if (!p.active) {
            p.active = true;
            p.x = x;
            p.y = y;
            p.text = text;
            p.badge = badge || '';
            p.badgeColor = badgeColor || '#FF551A';
            p.isGold = isGold;
            p.life = 0;
            p.maxLife = badge ? 1.18 : 0.92;
            return;
          }
        }
      }

      spawnBanner(text, accentColor) {
        const c = makeOffscreen(360, 74);
        const ctx = c.getContext('2d');
        ctx.font = '800 28px "Space Grotesk", system-ui, sans-serif';
        const tw = ctx.measureText(text).width;
        const pillW = Math.min(344, tw + 44);
        const pillH = 48;
        const px = (360 - pillW) * 0.5;
        const py = (74 - pillH) * 0.5;

        roundRectPath(ctx, px, py, pillW, pillH, 24);
        ctx.fillStyle = 'rgba(13, 17, 23, 0.95)';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = accentColor;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(text, 180, 38);
