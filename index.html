        this.waveOriginC = 3.5;

        // Animações de célula (squash/pop + dominó)
        this.cellPop = Array.from({ length: BOARD_SIZE }, () => Float32Array.from({ length: BOARD_SIZE }, () => 0));
        this.dominoQueue = []; // { r, c, colorId, delay, total, worldIdx }

        // Shake & hitstop
        this.shakeTime = 0;
        this.shakeMag = 0;
        this.hitstop = 0;
        this.time = 0;

        // Drag state
        this.drag = {
          active: false,
          pointerId: null,
          trayIndex: -1,
          piece: null,
          x: 0,
          y: 0,
          isTouch: false,
          snapR: -1,
          snapC: -1,
          canDrop: false,
          predictedRows: [],
          predictedCols: [],
          lastHoverKey: -1
        };

        // Layout calculado no resize
        this.w = 360;
        this.h = 560;
        this.dpr = 1;
        this.boardX = 0;
        this.boardY = 0;
        this.boardPx = 320;
        this.padPx = 8;
        this.gapPx = 4;
        this.cellPx = 36;
        this.trayY = 380;
        this.trayH = 120;
        this.slotCenters = [0, 0, 0];

        // Object Pools estritos (zero GC durante combos)
        this.particles = Array.from({ length: 140 }, () => ({
          active: false, x: 0, y: 0, vx: 0, vy: 0, size: 6,
          life: 0, maxLife: 1, color: '#fff', kind: 0, rot: 0, vrot: 0, starIdx: 0
        }));
        this.lasers = Array.from({ length: 16 }, () => ({
          active: false, isRow: true, index: 0, color: '#fff', life: 0, maxLife: 0.34
        }));
        this.flashes = Array.from({ length: 16 }, () => ({
          active: false, isRow: true, index: 0, color: '#fff', life: 0, maxLife: 0.28
        }));
        this.shockwaves = Array.from({ length: 6 }, () => ({
          active: false, x: 0, y: 0, maxR: 180, color: '#fff', life: 0, maxLife: 0.45
        }));
        this.popups = Array.from({ length: 14 }, () => ({
          active: false, x: 0, y: 0, text: '', badge: '', badgeColor: '#FF551A',
          isGold: false, life: 0, maxLife: 1.05
        }));
        this.banners = Array.from({ length: 4 }, () => ({
          active: false, life: 0, maxLife: 1.15, sprite: null, sw: 0, sh: 0
        }));
        this.ambient = Array.from({ length: 22 }, () => ({
          x: Math.random(), y: Math.random(), r: 1.5 + Math.random() * 2.5,
          vy: 0.012 + Math.random() * 0.025, phase: Math.random() * Math.PI * 2
        }));

        this.bindUI();
        this.bindPointerEvents();
        this.resize();
        window.addEventListener('resize', () => this.resize());

        if (!this.loadRunState()) {
          this.startNewGame(false);
        } else {
          this.applyWorldCSS(this.worldIdx);
          this.updateHUD();
        }

        this.lastTs = performance.now();
        requestAnimationFrame((ts) => this.loop(ts));
      }

      loadBestScore() {
        try {
          return parseInt(localStorage.getItem(STORAGE_BEST_KEY) || '0', 10) || 0;
        } catch (e) { return 0; }
      }

      saveBestScore() {
        try { localStorage.setItem(STORAGE_BEST_KEY, String(this.bestScore)); } catch (e) {}
      }

      saveRunState() {
        try {
          const payload = {
            grid: this.board.grid,
            tray: this.tray.map(p => p ? { matrix: p.matrix, colorId: p.colorId } : null),
            score: this.score,
            combo: this.combo,
            fuseMoves: this.fuseMoves,
            linesSinceShift: this.linesSinceShift,
            worldIdx: this.worldIdx,
            gameOver: this.gameOver
          };
          localStorage.setItem(STORAGE_RUN_KEY, JSON.stringify(payload));
        } catch (e) {}
      }

      loadRunState() {
        try {
          const raw = localStorage.getItem(STORAGE_RUN_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data || !Array.isArray(data.grid) || data.grid.length !== BOARD_SIZE || data.gameOver) return false;
          for (let r = 0; r < BOARD_SIZE; r++) {
            if (!Array.isArray(data.grid[r]) || data.grid[r].length !== BOARD_SIZE) return false;
            for (let c = 0; c < BOARD_SIZE; c++) {
              const v = data.grid[r][c];
              this.board.grid[r][c] = (typeof v === 'number' && v >= 0 && v < BLOCK_PALETTE.length) ? v : null;
            }
          }
          if (!Array.isArray(data.tray) || data.tray.length !== 3) return false;
          this.tray = data.tray.map(p => p && Array.isArray(p.matrix) ? {
            matrix: p.matrix,
            colorId: clamp(p.colorId | 0, 0, BLOCK_PALETTE.length - 1),
            spawnAnim: 1
          } : null);
          if (this.tray.every(p => p === null)) {
            this.tray = generateFairTray(this.board);
          }
          this.score = data.score | 0;
          this.combo = data.combo | 0;
          this.fuseMoves = data.fuseMoves | 0;
          this.linesSinceShift = data.linesSinceShift | 0;
          this.worldIdx = clamp(data.worldIdx | 0, 0, WORLDS.length - 1);
          this.prevWorldIdx = this.worldIdx;
          this.gameOver = false;
          return true;
        } catch (e) {
          return false;
        }
      }

      bindUI() {
        const btnSound = document.getElementById('btnSound');
        const iconOn = document.getElementById('soundIconOn');
        const iconOff = document.getElementById('soundIconOff');
        const syncSoundIcons = () => {
          iconOn.style.display = this.audio.enabled ? 'block' : 'none';
          iconOff.style.display = this.audio.enabled ? 'none' : 'block';
        };
        syncSoundIcons();

        btnSound.addEventListener('click', () => {
          this.audio.toggle();
          syncSoundIcons();
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
          this.audio.unlock();
          this.audio.playPickup();
          this.startNewGame(true);
        });

        document.getElementById('btnPlayAgain').addEventListener('click', () => {
          this.audio.unlock();
          this.audio.playPickup();
          this.startNewGame(true);
        });
      }

      applyWorldCSS(idx) {
        const w = WORLDS[idx];
        const root = document.documentElement.style;
        root.setProperty('--bg-page', w.pageBg);
        root.setProperty('--bg-surface', w.surface);
        root.setProperty('--bg-surface-2', w.surface2);
        root.setProperty('--border-ink', w.border);
        root.setProperty('--text-primary', w.text);
        root.setProperty('--text-muted', w.muted);
        root.setProperty('--accent', w.accent);
        root.setProperty('--accent-lip', w.accentLip);
        root.setProperty('--key-bg', w.keyBg);
        root.setProperty('--key-lip', w.keyLip);
        root.setProperty('--key-text', w.keyText);
        root.setProperty('--fuse-off', w.fuseOff);
        this.elWorldName.textContent = w.name;
        this.elWorldDot.style.background = w.accent;
        this.mascot.setWorldColor(w.oledColor);

        const metaTheme = document.getElementById('metaThemeColor');
        if (metaTheme) metaTheme.setAttribute('content', w.pageBg);
      }

      resize() {
        const rect = this.stageWrap.getBoundingClientRect();
        this.w = Math.max(280, Math.floor(rect.width));
        this.h = Math.max(360, Math.floor(rect.height));
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.canvas.width = Math.round(this.w * this.dpr);
        this.canvas.height = Math.round(this.h * this.dpr);

        // Calcula proporções ideais entre tabuleiro 8x8 e bandeja inferior
        const minTray = Math.max(106, Math.min(148, this.h * 0.24));
        const maxBoardH = this.h - minTray - 14;
        const maxBoardW = this.w - 4;
        this.boardPx = Math.floor(Math.min(maxBoardW, maxBoardH));
        this.padPx = Math.max(6, Math.round(this.boardPx * 0.025));
        this.gapPx = Math.max(3, Math.round(this.boardPx * 0.011));
        this.cellPx = (this.boardPx - this.padPx * 2 - this.gapPx * (BOARD_SIZE - 1)) / BOARD_SIZE;

        const usedH = this.boardPx + 14 + minTray;
        const topOffset = Math.max(0, Math.floor((this.h - usedH) * 0.42));
        this.boardX = Math.floor((this.w - this.boardPx) * 0.5);
        this.boardY = topOffset;
        this.trayY = this.boardY + this.boardPx + 14;
        this.trayH = Math.max(96, this.h - this.trayY - 2);

        const slotW = this.boardPx / 3;
        this.slotCenters = [
          this.boardX + slotW * 0.5,
          this.boardX + slotW * 1.5,
          this.boardX + slotW * 2.5
        ];

        this.sprites.rebuild(this.cellPx, this.dpr, this.boardPx, this.padPx, this.gapPx);
      }

      startNewGame(clearSaved) {
        this.board.reset();
        this.score = 0;
        this.beatRecordThisRun = false;
        this.combo = 0;
        this.fuseMoves = 0;
        this.linesSinceShift = 0;
        this.worldIdx = 0;
        this.prevWorldIdx = 0;
        this.waveActive = false;
        this.gameOver = false;
        this.gameOverAnim = 0;
        this.dominoQueue.length = 0;
        for (let r = 0; r < BOARD_SIZE; r++) this.cellPop[r].fill(0);

        this.particles.forEach(p => p.active = false);
        this.lasers.forEach(l => l.active = false);
        this.flashes.forEach(f => f.active = false);
        this.shockwaves.forEach(s => s.active = false);
        this.popups.forEach(p => p.active = false);
        this.banners.forEach(b => b.active = false);

        this.tray = generateFairTray(this.board);
        this.modal.classList.remove('open');
        this.applyWorldCSS(0);
        this.mascot.setState('idle', 0);
        this.updateHUD();
        if (clearSaved) this.saveRunState();
      }

      updateHUD(bumpScore = false) {
        this.elScore.textContent = String(this.score);
        this.elBest.textContent = String(this.bestScore);
        if (bumpScore) {
          this.elScore.classList.add('bump');
          setTimeout(() => this.elScore.classList.remove('bump'), 150);
        }

        const displayCombo = Math.max(1, this.combo);
        this.elComboTag.textContent = `x${displayCombo}`;
        for (let i = 0; i < 3; i++) {
          const el = this.fuseEls[i];
          el.classList.remove('active', 'hot', 'warn');
          if (i < this.fuseMoves) {
            if (this.fuseMoves === 1 && this.combo >= 2) el.classList.add('warn');
            else if (this.combo >= 3) el.classList.add('hot');
            else el.classList.add('active');
          }
        }
      }

      /* -----------------------------------------------------------------------
         INPUT UNIFICADO (MOUSE + TOUCH COM OFFSET VERTICAL E BLOQUEIO iOS)
         ----------------------------------------------------------------------- */
      bindPointerEvents() {
        // Previne pull-to-refresh no Safari iOS durante toque no canvas
        this.canvas.addEventListener('touchmove', (e) => {
          if (this.drag.active) e.preventDefault();
        }, { passive: false });

        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        window.addEventListener('pointermove', (e) => this.onPointerMove(e));
        window.addEventListener('pointerup', (e) => this.onPointerUp(e));
        window.addEventListener('pointercancel', (e) => this.onPointerUp(e));
      }

      getCanvasCoords(e) {
        const rect = this.canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      onPointerDown(e) {
        if (this.gameOver || this.drag.active) return;
        this.audio.unlock();
        const pt = this.getCanvasCoords(e);
        if (pt.y < this.trayY - 12) return;

        // Encontra o slot mais próximo
        let bestIdx = -1;
        let bestDist = Infinity;
        for (let i = 0; i < 3; i++) {
          if (!this.tray[i]) continue;
          const dx = Math.abs(pt.x - this.slotCenters[i]);
          if (dx < bestDist && dx < this.boardPx * 0.24) {
            bestDist = dx;
            bestIdx = i;
          }
        }
        if (bestIdx === -1) return;

        this.drag.active = true;
        this.drag.pointerId = e.pointerId;
        this.drag.trayIndex = bestIdx;
        this.drag.piece = this.tray[bestIdx];
        this.drag.isTouch = e.pointerType === 'touch' || e.pointerType === 'pen';
        this.drag.x = pt.x;
        this.drag.y = pt.y;
        this.drag.lastHoverKey = -1;

        this.audio.playPickup();
        this.mascot.setState('tracking', 0);
        this.updateDragSnap();
      }

      onPointerMove(e) {
        if (!this.drag.active || e.pointerId !== this.drag.pointerId) return;
        const pt = this.getCanvasCoords(e);
        this.drag.x = pt.x;
        this.drag.y = pt.y;

        // Olhar do mascote segue a peça
        const nx = (pt.x / this.w) * 2 - 1;
        const ny = (pt.y / this.h) * 2 - 1;
        this.mascot.setLook(nx, ny);

        this.updateDragSnap();
      }

      updateDragSnap() {
        const piece = this.drag.piece;
        if (!piece) return;

        const liftY = this.drag.isTouch ? Math.max(72, this.cellPx * 1.95) : Math.max(26, this.cellPx * 0.65);
        const cx = this.drag.x;
        const cy = this.drag.y - liftY;

        const step = this.cellPx + this.gapPx;
        const rows = piece.matrix.length;
        const cols = piece.matrix[0].length;
        const pw = cols * this.cellPx + (cols - 1) * this.gapPx;
        const ph = rows * this.cellPx + (rows - 1) * this.gapPx;

        const originX = cx - pw * 0.5;
        const originY = cy - ph * 0.5;

        const col = Math.round((originX - (this.boardX + this.padPx)) / step);
        const row = Math.round((originY - (this.boardY + this.padPx)) / step);

        if (this.board.canPlace(piece.matrix, row, col)) {
          this.drag.snapR = row;
          this.drag.snapC = col;
          this.drag.canDrop = true;
          const pred = this.board.predictClears(piece.matrix, row, col);
          this.drag.predictedRows = pred.rows;
          this.drag.predictedCols = pred.cols;

          const hoverKey = row * 16 + col;
          if (hoverKey !== this.drag.lastHoverKey) {
            this.drag.lastHoverKey = hoverKey;
            this.audio.playHoverTick();
          }

          if (pred.rows.length + pred.cols.length > 0) {
            this.mascot.setState('aimClear', 0);
          } else {
            this.mascot.setState('tracking', 0);
          }
        } else {
          this.drag.snapR = -1;
          this.drag.snapC = -1;
          this.drag.canDrop = false;
          this.drag.predictedRows = [];
          this.drag.predictedCols = [];
          this.drag.lastHoverKey = -1;
          this.mascot.setState('tracking', 0);
        }
      }

      onPointerUp(e) {
        if (!this.drag.active || e.pointerId !== this.drag.pointerId) return;

        const { canDrop, snapR, snapC, piece, trayIndex } = this.drag;
        this.drag.active = false;
        this.drag.pointerId = null;
        this.drag.piece = null;
        this.drag.predictedRows = [];
        this.drag.predictedCols = [];
        this.mascot.setLook(0, 0);

        if (canDrop && piece) {
          this.onPiecePlaced(piece, trayIndex, snapR, snapC);
        } else {
          this.mascot.setState(this.getMoodFallback(), 0);
        }
      }

      getMoodFallback() {
        if (this.gameOver) return 'gameOver';
        if (this.board.countFillRatio() >= 0.72) return 'danger';
        if (this.fuseMoves === 1 && this.combo >= 2) return 'fuseWarning';
        return 'idle';
      }

      /* -----------------------------------------------------------------------
         LÓGICA DE ENCAIXE, PONTUAÇÃO, QUALIDADE, COMBO E TROCA DE MUNDO
         ----------------------------------------------------------------------- */
      onPiecePlaced(piece, trayIndex, sr, sc) {
        const preFill = this.board.countFillRatio();
        const snug = this.board.computeSnugScore(piece.matrix, sr, sc);
        const res = this.board.place(piece, sr, sc);
        if (!res) return;

        this.tray[trayIndex] = null;

        // Pop de squash & stretch nos blocos recém colocados
        for (const cell of res.placedCells) {
          this.cellPop[cell.r][cell.c] = 1;
        }

        // Centro visual da jogada para popups e ondas
        const pRows = piece.matrix.length;
        const pCols = piece.matrix[0].length;
        const centerR = sr + (pRows - 1) * 0.5;
        const centerC = sc + (pCols - 1) * 0.5;
        const centerPt = this.cellCenter(centerR, centerC);

        const totalLines = res.clearedRows.length + res.clearedCols.length;
        let pointsEarned = res.placedCells.length * 10;

        this.audio.playPlace(res.placedCells.length);

        let qualityBadge = '';
        let qualityColor = WORLDS[this.worldIdx].accent;
        let qualityTier = '';

        if (totalLines > 0) {
          this.combo = this.fuseMoves > 0 ? this.combo + 1 : 1;
          this.fuseMoves = 3;
          this.linesSinceShift += totalLines;

          const lineBase = totalLines * totalLines * 100;
          const comboBonus = this.combo > 1 ? this.combo * 60 : 0;
          const allClearBonus = res.isAllClear ? 1000 : 0;
          pointsEarned += lineBase + comboBonus + allClearBonus;

          // Avaliação de qualidade da jogada
          if (res.isAllClear) {
            qualityBadge = 'TABULEIRO ZERADO!';
            qualityColor = '#F59E0B';
            qualityTier = 'epic';
          } else if (totalLines >= 4 || this.combo >= 6) {
            qualityBadge = 'IMPECÁVEL!';
            qualityColor = '#F59E0B';
            qualityTier = 'epic';
          } else if (totalLines === 3 || this.combo >= 4) {
            qualityBadge = 'GENIAL!';
            qualityColor = '#EC4899';
            qualityTier = 'epic';
          } else if (totalLines === 2 && this.combo >= 2) {
            qualityBadge = 'BRILHANTE!';
            qualityColor = '#0EA5E9';
            qualityTier = 'great';
          } else if (totalLines === 2) {
            qualityBadge = 'EXCELENTE!';
            qualityColor = '#10B981';
            qualityTier = 'great';
          } else if (this.combo >= 2) {
            qualityBadge = 'ÓTIMA JOGADA!';
            qualityColor = '#FF551A';
            qualityTier = 'good';
          } else {
            qualityBadge = 'BOA JOGADA!';
            qualityColor = '#10B981';
            qualityTier = 'good';
          }

          this.audio.playStreakSignature(this.combo, totalLines);
          this.audio.playQualityStimulus(qualityTier);

          // Micro Hitstop + Screen Shake
          if (totalLines >= 2 || this.combo >= 3) {
            this.hitstop = 0.032;
            this.shakeTime = 0.24;
            this.shakeMag = Math.min(11, 4 + totalLines * 1.8 + this.combo * 0.9);
          } else {
            this.shakeTime = 0.12;
            this.shakeMag = 2.6;
          }

          // Feixes de laser, flashes e fila dominó
          const accent = BLOCK_PALETTE[piece.colorId].glow;
          for (const r of res.clearedRows) {
            this.spawnLaser(true, r, accent);
            this.spawnFlash(true, r, accent);
          }
          for (const c of res.clearedCols) {
            this.spawnLaser(false, c, accent);
            this.spawnFlash(false, c, accent);
          }

          // Ordena células para cascata dominó saindo do ponto da jogada
          res.clearedCells.sort((a, b) => {
            const da = Math.abs(a.r - centerR) + Math.abs(a.c - centerC);
            const db = Math.abs(b.r - centerR) + Math.abs(b.c - centerC);
            return da - db;
          });

          res.clearedCells.forEach((cell, idx) => {
            this.dominoQueue.push({
              r: cell.r,
              c: cell.c,
              colorId: cell.colorId,
              delay: idx * 0.016,
              total: 0.14,
              worldIdx: this.worldIdx,
              pipped: false,
              idx
            });
          });

          // Ondas de choque e partículas de combo
          if (totalLines >= 2 || this.combo >= 2) {
            this.spawnShockwave(centerPt.x, centerPt.y, accent, 140 + this.combo * 22);
          }
          if (this.combo >= 2) {
            const label = this.combo >= 5 ? `LENDÁRIO x${this.combo}!`
              : (this.combo === 4 ? `IMPARÁVEL x4!`
              : (this.combo === 3 ? `INCRÍVEL x3!` : `COMBO x2!`));
            this.spawnBanner(label, this.combo >= 4 ? '#FDE047' : accent);
          }

          // Mascote reage ao nível do combo
          if (res.isAllClear) this.mascot.setState('allClear', 1.6);
          else if (this.combo >= 4) this.mascot.setState('combo4Plus', 1.5);
          else if (this.combo === 3) this.mascot.setState('combo3', 1.3);
          else if (this.combo === 2) this.mascot.setState('combo2', 1.15);
          else this.mascot.setState('place', 0.65);

          // Troca automática de cenário (2+ linhas simultâneas, combo 2/4/6+ ou 4 linhas acumuladas)
          const shouldShift = totalLines >= 2 || (this.combo >= 2 && this.combo % 2 === 0) || this.linesSinceShift >= 4;
          if (shouldShift) {
            this.linesSinceShift = 0;
            this.triggerWorldShift(centerR, centerC);
          }

        } else {
          // Sem limpeza de linha: decrementa fusível
          if (this.fuseMoves > 0) {
            this.fuseMoves--;
            if (this.fuseMoves === 1 && this.combo >= 2) {
              this.audio.playFuseWarn();
              this.mascot.setState('fuseWarning', 0.9);
            } else if (this.fuseMoves === 0) {
              if (this.combo >= 3) {
                this.audio.playStreakBroken();
                this.mascot.setState('streakBroken', 0.95);
              } else {
                this.mascot.setState('place', 0.45);
              }
              this.combo = 0;
            } else {
              this.mascot.setState('place', 0.45);
            }
          } else {
            this.mascot.setState('place', 0.45);
          }

          // Encaixe limpo (peça 4+ blocos encaixada rente a bordas/blocos ou sob pressão >= 70%)
          if (res.placedCells.length >= 4 && (snug >= 0.55 || preFill >= 0.70)) {
            qualityBadge = 'ENCAIXE LIMPO!';
            qualityColor = '#0EA5E9';
            this.audio.playQualityStimulus('clean');
          }
        }

        // Atualiza pontuação e recorde
        this.score += pointsEarned;
        if (this.score > this.bestScore) {
          this.bestScore = this.score;
          this.saveBestScore();
          if (!this.beatRecordThisRun && this.score >= 200) {
            this.beatRecordThisRun = true;
            this.audio.playRecordFanfare();
            this.mascot.setState('newRecord', 1.5);
            this.spawnBanner('NOVO RECORDE!', '#FDE047');
          }
        }

        // Popup de pontuação em alto contraste WCAG AAA + badge de qualidade acima
        this.spawnScorePopup(
          centerPt.x,
          centerPt.y - 8,
          `+${pointsEarned}`,
          qualityBadge,
          qualityColor,
          totalLines >= 2 || this.combo >= 2 || res.isAllClear
        );

        // Reabastece bandeja se vazia
        if (this.tray.every(p => p === null)) {
          this.tray = generateFairTray(this.board);
        }

        this.updateHUD(true);

        // Verifica Game Over
        if (!this.board.hasAnyValidMove(this.tray)) {
          this.triggerGameOver();
        }

        this.saveRunState();
      }

      triggerWorldShift(originR, originC) {
        this.prevWorldIdx = this.worldIdx;
        this.worldIdx = (this.worldIdx + 1) % WORLDS.length;
        this.waveActive = true;
        this.waveTime = 0;
        this.waveOriginR = originR;
        this.waveOriginC = originC;

        this.applyWorldCSS(this.worldIdx);
        this.audio.playWorldShift();
        this.mascot.setState('worldShift', 1.15);

        const pt = this.cellCenter(originR, originC);
        this.spawnShockwave(pt.x, pt.y, WORLDS[this.worldIdx].accent, this.boardPx * 0.95);
        this.spawnBanner(WORLDS[this.worldIdx].name, WORLDS[this.worldIdx].accent);
      }

      triggerGameOver() {
        this.gameOver = true;
        this.gameOverAnim = 0;
        this.audio.playGameOver();
        this.mascot.setState('gameOver', 0);

        setTimeout(() => {
          if (!this.gameOver) return;
          this.elGoScore.textContent = String(this.score);
          this.elGoBest.textContent = String(this.bestScore);
          this.elGoNewRec.classList.toggle('show', this.beatRecordThisRun);
          this.modal.classList.add('open');
        }, 720);
      }

      /* -----------------------------------------------------------------------
         SPAWNERS EM OBJECT POOL (ZERO ALOCAÇÃO DE MEMÓRIA)
         ----------------------------------------------------------------------- */
      cellCenter(r, c) {
        const step = this.cellPx + this.gapPx;
        return {
          x: this.boardX + this.padPx + c * step + this.cellPx * 0.5,
          y: this.boardY + this.padPx + r * step + this.cellPx * 0.5
        };
      }

      spawnBurst(x, y, colorId, count = 7) {
        const pal = BLOCK_PALETTE[colorId] || BLOCK_PALETTE[0];
        let spawned = 0;
        for (let i = 0; i < this.particles.length && spawned < count; i++) {
          const p = this.particles[i];
          if (p.active) continue;
          const ang = Math.random() * Math.PI * 2;
          const spd = 70 + Math.random() * 190;
          p.active = true;
          p.x = x;
          p.y = y;
          p.vx = Math.cos(ang) * spd;
          p.vy = Math.sin(ang) * spd - 45;
          p.size = 4.5 + Math.random() * 5.5;
          p.life = 0;
          p.maxLife = 0.36 + Math.random() * 0.34;
          p.color = Math.random() < 0.45 ? pal.light : pal.base;
          p.kind = Math.random() < 0.35 ? 1 : 0; // 1 = estrela, 0 = fragmento
          p.rot = Math.random() * Math.PI;
          p.vrot = (Math.random() - 0.5) * 10;
          p.starIdx = (colorId + 2) % this.sprites.starSprites.length;
          spawned++;
        }
      }

      spawnLaser(isRow, index, color) {
        for (const l of this.lasers) {
          if (!l.active) {
            l.active = true;
            l.isRow = isRow;
            l.index = index;
            l.color = color;
            l.life = 0;
            l.maxLife = 0.34;
            return;
          }
        }
      }

      spawnFlash(isRow, index, color) {
        for (const f of this.flashes) {
          if (!f.active) {
            f.active = true;
            f.isRow = isRow;
            f.index = index;
            f.color = color;
            f.life = 0;
            f.maxLife = 0.28;
            return;
          }
        }
      }

      spawnShockwave(x, y, color, maxR) {
        for (const s of this.shockwaves) {
          if (!s.active) {
            s.active = true;
            s.x = x;
            s.y = y;
            s.maxR = maxR;
            s.color = color;
            s.life = 0;
            s.maxLife = 0.46;
            return;
          }
        }
      }

      spawnScorePopup(x, y, text, badge, badgeColor, isGold) {
        for (const p of this.popups) {
          if (!p.active) {
            p.active = true;
            p.x = x;
            p.y = y;
            p.text = text;
            p.badge = badge || '';
            p.badgeColor = badgeColor || '#FF551A';
            p.isGold = isGold;
            p.life = 0;
            p.maxLife = badge ? 1.18 : 0.92;
            return;
          }
        }
      }

      spawnBanner(text, accentColor) {
        // Pré-renderiza o banner em offscreen canvas uma única vez no spawn
        const c = makeOffscreen(360, 74);
        const ctx = c.getContext('2d');
        ctx.font = '800 28px "Space Grotesk", system-ui, sans-serif';
        const tw = ctx.measureText(text).width;
        const pillW = Math.min(344, tw + 44);
        const pillH = 48;
        const px = (360 - pillW) * 0.5;
        const py = (74 - pillH) * 0.5;

        roundRectPath(ctx, px, py, pillW, pillH, 24);
        ctx.fillStyle = 'rgba(13, 17, 23, 0.95)';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = accentColor;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(text, 180, 38);

        for (const b of this.banners) {
          if (!b.active) {
            b.active = true;
            b.life = 0;
            b.maxLife = 1.05;
            b.sprite = c;
            b.sw = 360;
            b.sh = 74;
            return;
          }
        }
      }

      /* -----------------------------------------------------------------------
         LOOP PRINCIPAL (60/120 FPS)
         ----------------------------------------------------------------------- */
      loop(ts) {
        const rawDt = (ts - this.lastTs) / 1000;
        this.lastTs = ts;
        const dt = Math.min(0.05, Math.max(0.001, rawDt));

        this.update(dt);
        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      update(dt) {
        this.time += dt;
        this.mascot.update(dt, this.getMoodFallback());

        if (this.hitstop > 0) {
          this.hitstop = Math.max(0, this.hitstop - dt);
          return;
        }

        if (this.shakeTime > 0) {
          this.shakeTime = Math.max(0, this.shakeTime - dt);
        }

        if (this.gameOver && this.gameOverAnim < 1) {
          this.gameOverAnim = Math.min(1, this.gameOverAnim + dt * 1.4);
        }

        // Animação de entrada das peças da bandeja
        for (const p of this.tray) {
          if (p && p.spawnAnim < 1) {
            p.spawnAnim = Math.min(1, p.spawnAnim + dt * 4.2);
          }
        }

        // Pop de encaixe nas células
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (this.cellPop[r][c] > 0) {
              this.cellPop[r][c] = Math.max(0, this.cellPop[r][c] - dt * 7.2);
            }
          }
        }

        // Onda radial de re-texturização
        if (this.waveActive) {
          this.waveTime += dt;
          if (this.waveTime >= 0.72) this.waveActive = false;
        }

        // Fila dominó de células explodindo
        for (let i = this.dominoQueue.length - 1; i >= 0; i--) {
          const d = this.dominoQueue[i];
          d.delay -= dt;
          if (d.delay <= 0) {
            if (!d.pipped) {
              d.pipped = true;
              const pt = this.cellCenter(d.r, d.c);
              this.spawnBurst(pt.x, pt.y, d.colorId, 6);
              if (d.idx % 2 === 0) this.audio.playDominoPip(d.idx, this.combo);
            }
            d.total -= dt;
            if (d.total <= 0) {
              this.dominoQueue.splice(i, 1);
            }
          }
        }

        // Partículas em pool
        for (const p of this.particles) {
          if (!p.active) continue;
          p.life += dt;
          if (p.life >= p.maxLife) { p.active = false; continue; }
          p.vy += 420 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vrot * dt;
        }

        for (const l of this.lasers) {
          if (!l.active) continue;
          l.life += dt;
          if (l.life >= l.maxLife) l.active = false;
        }

        for (const f of this.flashes) {
          if (!f.active) continue;
          f.life += dt;
          if (f.life >= f.maxLife) f.active = false;
        }

        for (const s of this.shockwaves) {
          if (!s.active) continue;
          s.life += dt;
          if (s.life >= s.maxLife) s.active = false;
        }

        for (const p of this.popups) {
          if (!p.active) continue;
          p.life += dt;
          if (p.life >= p.maxLife) p.active = false;
        }

        for (const b of this.banners) {
          if (!b.active) continue;
          b.life += dt;
          if (b.life >= b.maxLife) b.active = false;
        }

        // Ambiente de fundo sutil
        for (const a of this.ambient) {
          a.y -= a.vy * dt;
          if (a.y < -0.04) {
            a.y = 1.04;
            a.x = Math.random();
          }
        }
      }

      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);
        ctx.clearRect(0, 0, this.w, this.h);

        // Partículas ambientais sutis
        const world = WORLDS[this.worldIdx];
        ctx.fillStyle = world.ambientColor;
        for (const a of this.ambient) {
          ctx.globalAlpha = 0.14 + Math.sin(this.time * 1.8 + a.phase) * 0.06;
          ctx.beginPath();
          ctx.arc(a.x * this.w, a.y * this.h, a.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Screen shake aplicado ao tabuleiro
        let sx = 0, sy = 0;
        if (this.shakeTime > 0) {
          const factor = this.shakeTime * 4;
          sx = (Math.random() - 0.5) * this.shakeMag * Math.min(1, factor);
          sy = (Math.random() - 0.5) * this.shakeMag * Math.min(1, factor);
        }

        ctx.save();
        ctx.translate(sx, sy);

        // 1. Tabuleiro estático cacheado
        const boardSprite = this.sprites.boardCanvases[this.worldIdx];
        if (boardSprite) {
          ctx.drawImage(boardSprite, this.boardX, this.boardY, this.boardPx, this.boardPx);
        }

        // Borda energizada em combos 2x+ (additive sem shadowBlur)
        if (this.combo >= 2 && !this.gameOver) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = world.accent;
          ctx.globalAlpha = 0.35 + Math.sin(this.time * 7) * 0.2;
          ctx.lineWidth = 3;
          roundRectPath(ctx, this.boardX - 1.5, this.boardY - 1.5, this.boardPx + 3, this.boardPx + 3, 17);
          ctx.stroke();
          ctx.restore();
        }

        // 2. Destaque preditivo de linhas/colunas que serão limpas
        const step = this.cellPx + this.gapPx;
        if (this.drag.active && this.drag.canDrop) {
          const predColor = BLOCK_PALETTE[this.drag.piece.colorId].glow;
          ctx.save();
          ctx.fillStyle = predColor;
          ctx.globalAlpha = 0.2 + Math.sin(this.time * 12) * 0.07;
          for (const r of this.drag.predictedRows) {
            const ry = this.boardY + this.padPx + r * step;
            roundRectPath(ctx, this.boardX + this.padPx, ry, this.boardPx - this.padPx * 2, this.cellPx, 8);
            ctx.fill();
          }
          for (const c of this.drag.predictedCols) {
            const cx = this.boardX + this.padPx + c * step;
            roundRectPath(ctx, cx, this.boardY + this.padPx, this.cellPx, this.boardPx - this.padPx * 2, 8);
            ctx.fill();
          }
          ctx.restore();
        }

        // 3. Blocos fixados no tabuleiro
        const waveRad = this.waveTime * 19;
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const colorId = this.board.grid[r][c];
            if (colorId === null) continue;

            const x = this.boardX + this.padPx + c * step;
            const y = this.boardY + this.padPx + r * step;

            let useWorld = this.worldIdx;
            let wavePop = 0;
            if (this.waveActive) {
              const dist = Math.hypot(r - this.waveOriginR, c - this.waveOriginC);
              if (dist > waveRad) {
                useWorld = this.prevWorldIdx;
              } else if (waveRad - dist < 1.8) {
                wavePop = Math.sin(((waveRad - dist) / 1.8) * Math.PI) * 0.14;
              }
            }

            const pop = this.cellPop[r][c];
            const squash = pop > 0 ? Math.sin(pop * Math.PI) * 0.14 : 0;
            const scaleX = 1 + squash + wavePop;
            const scaleY = 1 - squash * 0.65 + wavePop;

            const deadPhase = this.gameOver && ((r + c) / 14 <= this.gameOverAnim);
            const sprite = deadPhase
              ? this.sprites.deadBlocks[useWorld]
              : this.sprites.blocks[useWorld][colorId];

            // Aura aditiva sutil em Combo 3x+
            if (this.combo >= 3 && !deadPhase) {
              const glow = this.sprites.glows[colorId];
              if (glow) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.22;
                const gSize = this.cellPx * 1.55;
                ctx.drawImage(glow, x + (this.cellPx - gSize) * 0.5, y + (this.cellPx - gSize) * 0.5, gSize, gSize);
                ctx.restore();
              }
            }

            if (scaleX !== 1 || scaleY !== 1) {
              const dw = this.cellPx * scaleX;
              const dh = this.cellPx * scaleY;
              ctx.drawImage(sprite, x + (this.cellPx - dw) * 0.5, y + (this.cellPx - dh) * 0.5, dw, dh);
            } else {
              ctx.drawImage(sprite, x, y, this.cellPx, this.cellPx);
            }
          }
        }

        // 4. Células saindo na cascata dominó
        for (const d of this.dominoQueue) {
          const x = this.boardX + this.padPx + d.c * step;
          const y = this.boardY + this.padPx + d.r * step;
          const sprite = this.sprites.blocks[d.worldIdx][d.colorId];
          if (d.delay > 0) {
            ctx.drawImage(sprite, x, y, this.cellPx, this.cellPx);
          } else {
            const p = clamp(d.total / 0.14, 0, 1);
            const sz = this.cellPx * (0.25 + p * 0.9);
            ctx.save();
            ctx.globalAlpha = p;
            ctx.drawImage(sprite, x + (this.cellPx - sz) * 0.5, y + (this.cellPx - sz) * 0.5, sz, sz);
            ctx.restore();
          }
        }

        // 5. Ghost Preview de encaixe
        if (this.drag.active && this.drag.canDrop && this.drag.piece) {
          const piece = this.drag.piece;
          const sprite = this.sprites.blocks[this.worldIdx][piece.colorId];
          ctx.save();
          ctx.globalAlpha = 0.38;
          for (let r = 0; r < piece.matrix.length; r++) {
            for (let c = 0; c < piece.matrix[0].length; c++) {
              if (!piece.matrix[r][c]) continue;
              const x = this.boardX + this.padPx + (this.drag.snapC + c) * step;
              const y = this.boardY + this.padPx + (this.drag.snapR + r) * step;
              ctx.drawImage(sprite, x, y, this.cellPx, this.cellPx);
            }
          }
          ctx.restore();
        }

        // 6. Flashes e feixes de laser (Additive Blending)
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const f of this.flashes) {
          if (!f.active) continue;
          const a = 1 - f.life / f.maxLife;
          ctx.globalAlpha = a * 0.52;
          ctx.fillStyle = f.color;
          if (f.isRow) {
            const ry = this.boardY + this.padPx + f.index * step;
            roundRectPath(ctx, this.boardX + this.padPx, ry, this.boardPx - this.padPx * 2, this.cellPx, 8);
          } else {
            const cx = this.boardX + this.padPx + f.index * step;
            roundRectPath(ctx, cx, this.boardY + this.padPx, this.cellPx, this.boardPx - this.padPx * 2, 8);
          }
          ctx.fill();
        }

        for (const l of this.lasers) {
          if (!l.active) continue;
          const t = l.life / l.maxLife;
          const thick = this.cellPx * (1 - t) * 0.55;
          ctx.globalAlpha = (1 - t) * 0.9;
          ctx.fillStyle = '#FFFFFF';
          if (l.isRow) {
            const cy = this.boardY + this.padPx + l.index * step + this.cellPx * 0.5;
            ctx.fillRect(this.boardX + this.padPx, cy - thick * 0.5, this.boardPx - this.padPx * 2, thick);
          } else {
            const cx = this.boardX + this.padPx + l.index * step + this.cellPx * 0.5;
            ctx.fillRect(cx - thick * 0.5, this.boardY + this.padPx, thick, this.boardPx - this.padPx * 2);
          }
        }

        // Ondas de choque circulares
        for (const s of this.shockwaves) {
          if (!s.active) continue;
          const t = s.life / s.maxLife;
          const ease = 1 - Math.pow(1 - t, 3);
          ctx.globalAlpha = (1 - t) * 0.72;
          ctx.strokeStyle = s.color;
          ctx.lineWidth = Math.max(1.5, (1 - t) * 7);
          ctx.beginPath();
          ctx.arc(s.x, s.y, ease * s.maxR, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        ctx.restore(); // fim do screen shake

        // 7. Bandeja inferior de 3 peças
        const trayCenterY = this.trayY + this.trayH * 0.5;
        const maxSlotW = (this.boardPx / 3) * 0.84;
        const maxSlotH = this.trayH * 0.84;

        for (let i = 0; i < 3; i++) {
          const piece = this.tray[i];
          if (!piece) continue;
          if (this.drag.active && this.drag.trayIndex === i) continue;

          const rows = piece.matrix.length;
          const cols = piece.matrix[0].length;
          const fits = this.board.canFitMatrixAnywhere(piece.matrix);

          const baseCell = Math.min(this.cellPx * 0.62, maxSlotW / cols, maxSlotH / rows);
          const pGap = Math.max(2, baseCell * 0.1);
          const anim = piece.spawnAnim < 1
            ? (1 - Math.pow(1 - piece.spawnAnim, 3))
            : 1;
          const cell = baseCell * anim;
          const pw = cols * cell + (cols - 1) * pGap;
          const ph = rows * cell + (rows - 1) * pGap;
          const startX = this.slotCenters[i] - pw * 0.5;
          const startY = trayCenterY - ph * 0.5;

          const sprite = this.sprites.blocks[this.worldIdx][piece.colorId];
          ctx.save();
          if (!fits) ctx.globalAlpha = 0.34;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!piece.matrix[r][c]) continue;
              ctx.drawImage(sprite, startX + c * (cell + pGap), startY + r * (cell + pGap), cell, cell);
            }
          }
          ctx.restore();
        }

        // 8. Peça sendo arrastada
        if (this.drag.active && this.drag.piece) {
          const piece = this.drag.piece;
          const liftY = this.drag.isTouch ? Math.max(72, this.cellPx * 1.95) : Math.max(26, this.cellPx * 0.65);
          const rows = piece.matrix.length;
          const cols = piece.matrix[0].length;
          const scale = 1.04;
          const dCell = this.cellPx * scale;
          const dGap = this.gapPx * scale;
          const pw = cols * dCell + (cols - 1) * dGap;
          const ph = rows * dCell + (rows - 1) * dGap;
          const sx0 = this.drag.x - pw * 0.5;
          const sy0 = (this.drag.y - liftY) - ph * 0.5;
          const sprite = this.sprites.blocks[this.worldIdx][piece.colorId];

          // Sombra física simples deslocada (sem shadowBlur)
          ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!piece.matrix[r][c]) continue;
              roundRectPath(ctx, sx0 + c * (dCell + dGap) + 3, sy0 + r * (dCell + dGap) + 7, dCell, dCell, dCell * 0.18);
              ctx.fill();
            }
          }
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!piece.matrix[r][c]) continue;
              ctx.drawImage(sprite, sx0 + c * (dCell + dGap), sy0 + r * (dCell + dGap), dCell, dCell);
            }
          }
        }

        // 9. Partículas
        for (const p of this.particles) {
          if (!p.active) continue;
          const a = 1 - p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          if (p.kind === 1) {
            const star = this.sprites.starSprites[p.starIdx];
            const sz = p.size * 2.2;
            ctx.drawImage(star, -sz * 0.5, -sz * 0.5, sz, sz);
          } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
          }
          ctx.restore();
        }

        // 10. Banners centrais de combo / fase
        for (const b of this.banners) {
          if (!b.active || !b.sprite) continue;
          const t = b.life / b.maxLife;
          let sc = 1;
          let alpha = 1;
          if (t < 0.18) {
            const k = t / 0.18;
            sc = 0.55 + Math.sin(k * Math.PI * 0.65) * 0.55;
          } else if (t > 0.75) {
            alpha = 1 - (t - 0.75) / 0.25;
          }
          const bx = this.boardX + this.boardPx * 0.5;
          const by = this.boardY + this.boardPx * 0.34 - t * 18;
          const dw = Math.min(this.boardPx * 0.92, b.sw * 0.85) * sc;
          const dh = (b.sh / b.sw) * dw;

          ctx.save();
          ctx.globalAlpha = clamp(alpha, 0, 1);
          ctx.drawImage(b.sprite, bx - dw * 0.5, by - dh * 0.5, dw, dh);
          ctx.restore();
        }

        // 11. Z-ORDER MÁXIMO: Popups de pontuação WCAG AAA + Badge de Qualidade acima
        for (const p of this.popups) {
          if (!p.active) continue;
          const t = p.life / p.maxLife;
          const alpha = t < 0.14 ? t / 0.14 : (t > 0.72 ? (1 - t) / 0.28 : 1);
          const lift = Math.pow(t, 0.7) * 44;

          ctx.save();
          ctx.globalAlpha = clamp(alpha, 0, 1);

          // Medidas da pílula de pontuação
          ctx.font = '800 18px "Space Grotesk", system-ui, sans-serif';
          const scoreW = ctx.measureText(p.text).width;
          const pillW = Math.max(66, scoreW + 24);
          const pillH = 32;

          let badgeW = 0;
          const badgeH = 24;
          if (p.badge) {
            ctx.font = '800 12px "Inter", system-ui, sans-serif';
            badgeW = ctx.measureText(p.badge).width + 20;
          }

          const halfW = Math.max(pillW, badgeW) * 0.5 + 8;
          const px = clamp(p.x, halfW, this.w - halfW);
          const topPad = p.badge ? 46 : 24;
          const py = clamp(p.y - lift, topPad, this.h - 24);

          // Badge de qualidade imediatamente acima (zero sobreposição)
          if (p.badge) {
            const by = py - pillH * 0.5 - badgeH * 0.5 - 5;
            roundRectPath(ctx, px - badgeW * 0.5, by - badgeH * 0.5, badgeW, badgeH, 12);
            ctx.fillStyle = p.badgeColor;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(13, 17, 23, 0.85)';
            ctx.stroke();

            ctx.font = '800 11.5px "Inter", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(p.badge, px, by + 0.5);
          }

          // Pílula de pontuação WCAG AAA (grafite profundo + borda nítida + branco/ouro)
          roundRectPath(ctx, px - pillW * 0.5, py - pillH * 0.5, pillW, pillH, 16);
          ctx.fillStyle = 'rgba(13, 17, 23, 0.94)';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = p.isGold ? '#FDE047' : '#FFFFFF';
          ctx.stroke();

          ctx.font = '800 18px "Space Grotesk", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = p.isGold ? '#FDE047' : '#FFFFFF';
          ctx.fillText(p.text, px, py + 0.5);

          ctx.restore();
        }

        ctx.restore();
      }
    }

    /* =========================================================================
       8. INICIALIZAÇÃO & REGISTRO DO SERVICE WORKER (GITHUB PAGES PWA)
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      new KubikoGame();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  })();
  </script>
