<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E232B"/>
      <stop offset="100%" stop-color="#11151B"/>
    </linearGradient>
    <linearGradient id="orangeBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6A2B"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="creamBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#DDD6C8"/>
    </linearGradient>
  </defs>

  <!-- Base industrial -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#2D3542" stroke-width="6"/>

  <!-- Bloco 1: Creme PBT (Topo esquerdo) -->
  <rect x="84" y="88" width="156" height="156" rx="28" fill="#B5AC9C"/>
  <rect x="84" y="76" width="156" height="152" rx="28" fill="url(#creamBlock)"/>
  <rect x="106" y="98" width="112" height="108" rx="18" fill="#EFEAE0"/>
  <rect x="142" y="148" width="40" height="8" rx="4" fill="#BFB6A6"/>

  <!-- Bloco 2: Esmeralda (Topo direito) -->
  <rect x="272" y="88" width="156" height="156" rx="28" fill="#0B7A5C"/>
  <rect x="272" y="76" width="156" height="152" rx="28" fill="#10B981"/>
  <rect x="294" y="98" width="112" height="108" rx="18" fill="#34D399" opacity="0.38"/>

  <!-- Bloco 3: Ciano (Base esquerda) -->
  <rect x="84" y="276" width="156" height="156" rx="28" fill="#0369A1"/>
  <rect x="84" y="264" width="156" height="152" rx="28" fill="#0EA5E9"/>
  <rect x="106" y="286" width="112" height="108" rx="18" fill="#38BDF8" opacity="0.38"/>

  <!-- Bloco 4: Caixa Laranja assinatura KUBIK[O] (Base direita) -->
  <rect x="272" y="276" width="156" height="156" rx="28" fill="#A8320A"/>
  <rect x="272" y="264" width="156" height="152" rx="28" fill="url(#orangeBox)"/>
  <rect x="286" y="278" width="128" height="124" rx="20" fill="none" stroke="#FFA375" stroke-width="4" opacity="0.55"/>
  <!-- Letra "O" geométrica vetorial pura (garante renderização em qualquer SO) -->
  <rect x="318" y="302" width="64" height="76" rx="30" fill="none" stroke="#FFFFFF" stroke-width="18"/>
</svg>
